<script>
(() => {
'use strict';
// ---- src/engine/tiles.js ----
// 牌の表現
//   0-8   : 1m-9m（萬子）
//   9-17  : 1p-9p（筒子）
//   18-26 : 1s-9s（索子）
//   27-33 : 東 南 西 北 白 發 中
//   34/35/36 : 赤5m / 赤5p / 赤5s（計算上は 4/13/22 と同じ牌として扱う）

const EAST = 27, SOUTH = 28, WEST = 29, NORTH = 30;
const HAKU = 31, HATSU = 32, CHUN = 33;
const RED_MAN = 34, RED_PIN = 35, RED_SOU = 36;
const ALL_TILE_IDS = Array.from({ length: 37 }, (_, i) => i);

const SUIT_LETTERS = ['m', 'p', 's', 'z'];
const HONOR_NAMES = ['東', '南', '西', '北', '白', '發', '中'];
const SUIT_NAMES = ['萬', '筒', '索'];
const GREEN_TILES = new Set([19, 20, 21, 23, 25, HATSU]); // 2s 3s 4s 6s 8s 發

/** 赤5を通常の5に読み替えた牌番号(0-33) */
function tileBase(id) {
  return id >= 34 ? (id - 34) * 9 + 4 : id;
}
function isRed(id) {
  return id >= 34;
}
/** 0:萬 1:筒 2:索 3:字 */
function suitOf(b) {
  return b < 27 ? (b / 9) | 0 : 3;
}
/** 数牌は1-9、字牌は1-7 */
function rankOf(b) {
  return b < 27 ? (b % 9) + 1 : b - 26;
}
function isHonor(b) {
  return b >= 27;
}
function isTerminal(b) {
  return b < 27 && (b % 9 === 0 || b % 9 === 8);
}
function isYaochu(b) {
  return b >= 27 || b % 9 === 0 || b % 9 === 8;
}
function isSimple(b) {
  return !isYaochu(b);
}
function isDragon(b) {
  return b >= HAKU;
}
function isWind(b) {
  return b >= EAST && b <= NORTH;
}
function isGreen(b) {
  return GREEN_TILES.has(b);
}
/** 通常の5に対応する赤5のid（5以外は -1） */
function redIdOf(b) {
  return b === 4 ? RED_MAN : b === 13 ? RED_PIN : b === 22 ? RED_SOU : -1;
}

/** ドラ表示牌 → ドラ */
function doraFromIndicator(id) {
  const b = tileBase(id);
  if (b < 27) return ((b / 9) | 0) * 9 + (((b % 9) + 1) % 9);
  if (b <= NORTH) return EAST + ((b - EAST + 1) % 4);
  return HAKU + ((b - HAKU + 1) % 3);
}

/** "123m0p11z" 形式 → id配列（0 = 赤5、z は 1-7 = 東南西北白發中） */
function parseTiles(str) {
  const out = [];
  let pending = [];
  for (const ch of String(str).replace(/\s+/g, '')) {
    if (ch >= '0' && ch <= '9') {
      pending.push(ch.charCodeAt(0) - 48);
      continue;
    }
    const s = SUIT_LETTERS.indexOf(ch);
    if (s < 0 || pending.length === 0) throw new Error(`牌の表記が不正です: ${str}`);
    for (const n of pending) {
      if (s === 3) {
        if (n < 1 || n > 7) throw new Error(`字牌は1-7で指定してください: ${str}`);
        out.push(26 + n);
      } else if (n === 0) {
        out.push(34 + s);
      } else {
        out.push(s * 9 + n - 1);
      }
    }
    pending = [];
  }
  if (pending.length) throw new Error(`牌の表記が不正です: ${str}`);
  return out;
}

/** id配列 → "123m0p11z" 形式（並び替えあり） */
function tilesToString(ids) {
  const groups = [[], [], [], []];
  for (const id of sortTiles(ids)) {
    const b = tileBase(id);
    const s = suitOf(b);
    groups[s].push(isRed(id) ? 0 : rankOf(b));
  }
  return groups.map((g, s) => (g.length ? g.join('') + SUIT_LETTERS[s] : '')).join('');
}

function sortKey(id) {
  return tileBase(id) * 2 + (isRed(id) ? 1 : 0);
}
function sortTiles(ids) {
  return [...ids].sort((a, b) => sortKey(a) - sortKey(b));
}

/** 34種の枚数配列（赤5は通常の5として数える） */
function countsOf(ids) {
  const c = new Array(34).fill(0);
  for (const id of ids) c[tileBase(id)]++;
  return c;
}

function tileLabel(id) {
  const b = tileBase(id);
  if (b >= 27) return HONOR_NAMES[b - 27];
  return (isRed(id) ? '赤' : '') + ((b % 9) + 1) + SUIT_NAMES[(b / 9) | 0];
}
function windLabel(b) {
  return HONOR_NAMES[b - 27];
}

/** 鳴きの牌を作る。type: chi / pon / minkan / ankan。chiは tapped が一番小さい牌 */
function makeMeld(type, tappedId, withRed = false) {
  const b = tileBase(tappedId);
  let bases;
  if (type === 'chi') {
    if (b >= 27 || b % 9 > 6) return null;
    bases = [b, b + 1, b + 2];
  } else if (type === 'pon') {
    bases = [b, b, b];
  } else if (type === 'minkan' || type === 'ankan') {
    bases = [b, b, b, b];
  } else {
    return null;
  }
  const red = withRed || isRed(tappedId);
  let redUsed = false;
  const tiles = bases.map((x) => {
    const r = redIdOf(x);
    if (red && !redUsed && r >= 0) {
      redUsed = true;
      return r;
    }
    return x;
  });
  return { type, tiles };
}

const MELD_LABELS = { chi: 'チー', pon: 'ポン', minkan: '明槓', ankan: '暗槓' };

// ---- src/engine/shanten.js ----
// シャンテン数（向聴数）の計算
//   一般手: 8 - 2×面子 - 搭子(上限あり) - 雀頭
//   色ごと（萬・筒・索・字）に「面子数・搭子数・雀頭有無」の達成可能な組をメモ化して求め、最後に合成する。

// 1グループ分の結果は (m, t, p) の組の配列。m:面子 0-4, t:搭子 0-4, p:雀頭 0/1
// 1つの整数 code = (m*5 + t)*2 + p に詰める。
const enc = (m, t, p) => (m * 5 + t) * 2 + p;
const decM = (c) => ((c >> 1) / 5) | 0;
const decT = (c) => (c >> 1) % 5;
const decP = (c) => c & 1;

// パレート最適（面子・搭子ともに劣る組）を除去。雀頭あり/なしは別々に扱う。
function pareto(flags) {
  const out = [];
  for (let p = 0; p < 2; p++) {
    let bestT = -1;
    for (let m = 4; m >= 0; m--) {
      let tmax = -1;
      for (let t = 4; t >= 0; t--) {
        if (flags[enc(m, t, p)]) {
          tmax = t;
          break;
        }
      }
      if (tmax > bestT) {
        out.push(enc(m, tmax, p));
        bestT = tmax;
      }
    }
  }
  return out;
}

function addShifted(flags, sub, dm, dt, dp) {
  for (let j = 0; j < sub.length; j++) {
    const c = sub[j];
    const p = decP(c);
    if (p + dp > 1) continue;
    flags[enc(Math.min(decM(c) + dm, 4), Math.min(decT(c) + dt, 4), p + dp)] = 1;
  }
}

// 各グループの枚数ベクトルを 3bit×9 の整数にしてメモ化（1種最大7枚まで表現可）
const memoNumber = new Map([[0, [0]]]);
const memoHonor = new Map([[0, [0]]]);
const SHIFT = [0, 3, 6, 9, 12, 15, 18, 21, 24];

function solveGroup(a, code, honor, memo) {
  const hit = memo.get(code);
  if (hit) return hit;
  let i = 0;
  while (a[i] === 0) i++;
  const flags = new Uint8Array(50);
  const unit = 1 << SHIFT[i];

  // 刻子
  if (a[i] >= 3) {
    a[i] -= 3;
    addShifted(flags, solveGroup(a, code - 3 * unit, honor, memo), 1, 0, 0);
    a[i] += 3;
  }
  // 順子
  if (!honor && i <= 6 && a[i + 1] > 0 && a[i + 2] > 0) {
    a[i]--; a[i + 1]--; a[i + 2]--;
    addShifted(flags, solveGroup(a, code - unit - (1 << SHIFT[i + 1]) - (1 << SHIFT[i + 2]), honor, memo), 1, 0, 0);
    a[i]++; a[i + 1]++; a[i + 2]++;
  }
  // 対子（雀頭 or 搭子）
  if (a[i] >= 2) {
    a[i] -= 2;
    const sub = solveGroup(a, code - 2 * unit, honor, memo);
    addShifted(flags, sub, 0, 0, 1);
    addShifted(flags, sub, 0, 1, 0);
    a[i] += 2;
  }
  // 両面・辺張
  if (!honor && i <= 7 && a[i + 1] > 0) {
    a[i]--; a[i + 1]--;
    addShifted(flags, solveGroup(a, code - unit - (1 << SHIFT[i + 1]), honor, memo), 0, 1, 0);
    a[i]++; a[i + 1]++;
  }
  // 嵌張
  if (!honor && i <= 6 && a[i + 2] > 0) {
    a[i]--; a[i + 2]--;
    addShifted(flags, solveGroup(a, code - unit - (1 << SHIFT[i + 2]), honor, memo), 0, 1, 0);
    a[i]++; a[i + 2]++;
  }
  // 孤立牌として外す
  a[i]--;
  addShifted(flags, solveGroup(a, code - unit, honor, memo), 0, 0, 0);
  a[i]++;

  const res = pareto(flags);
  memo.set(code, res);
  return res;
}

const scratch = new Array(10).fill(0);
function groupResult(counts, offset, len, honor) {
  let code = 0;
  for (let i = 0; i < len; i++) {
    const v = counts[offset + i];
    scratch[i] = v;
    code += v << SHIFT[i];
  }
  scratch[len] = 0;
  scratch[len + 1] = 0;
  return solveGroup(scratch, code, honor, honor ? memoHonor : memoNumber);
}

function merge(A, B) {
  const flags = new Uint8Array(50);
  for (const a of A) {
    for (const b of B) {
      const p = decP(a) + decP(b);
      if (p > 1) continue;
      flags[enc(Math.min(decM(a) + decM(b), 4), Math.min(decT(a) + decT(b), 4), p)] = 1;
    }
  }
  return pareto(flags);
}

/** 一般手のシャンテン数。counts: 手牌(鳴きを除く)34種の枚数、meldCount: 鳴き(暗槓含む)の数 */
function shantenNormal(counts, meldCount = 0) {
  let cur = groupResult(counts, 0, 9, false);
  cur = merge(cur, groupResult(counts, 9, 9, false));
  cur = merge(cur, groupResult(counts, 18, 9, false));
  cur = merge(cur, groupResult(counts, 27, 7, true));
  let best = 8;
  for (const c of cur) {
    const m = decM(c) + meldCount;
    const t = Math.min(decT(c), Math.max(0, 4 - m));
    const s = 8 - 2 * m - t - decP(c);
    if (s < best) best = s;
  }
  return best;
}

/** 七対子のシャンテン数（鳴きがある場合は Infinity） */
function shantenChiitoi(counts, meldCount = 0) {
  if (meldCount > 0) return Infinity;
  let pairs = 0;
  let kinds = 0;
  for (let i = 0; i < 34; i++) {
    if (counts[i] >= 1) kinds++;
    if (counts[i] >= 2) pairs++;
  }
  return 6 - pairs + Math.max(0, 7 - kinds);
}

const YAOCHU = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];
/** 国士無双のシャンテン数（鳴きがある場合は Infinity） */
function shantenKokushi(counts, meldCount = 0) {
  if (meldCount > 0) return Infinity;
  let kinds = 0;
  let pair = 0;
  for (const i of YAOCHU) {
    if (counts[i] >= 1) kinds++;
    if (counts[i] >= 2) pair = 1;
  }
  return 13 - kinds - pair;
}

/** 対子の数と、么九牌（1・9・字）の種類数。画面で「七対子・国士を出すか」の判断に使う */
function handShape(counts) {
  let pairs = 0;
  for (let i = 0; i < 34; i++) if (counts[i] >= 2) pairs++;
  let yaochu = 0;
  for (const i of YAOCHU) if (counts[i] >= 1) yaochu++;
  return { pairs, yaochu };
}

/** 3形式すべてを返す */
function shantenAll(counts, meldCount = 0) {
  const normal = shantenNormal(counts, meldCount);
  const chiitoi = shantenChiitoi(counts, meldCount);
  const kokushi = shantenKokushi(counts, meldCount);
  const { pairs, yaochu } = handShape(counts);
  return { normal, chiitoi, kokushi, min: Math.min(normal, chiitoi, kokushi), pairs, yaochu };
}

function shanten(counts, meldCount = 0) {
  return shantenAll(counts, meldCount).min;
}

/** 和了形か（一般手・七対子・国士） */
function isAgariCounts(counts, meldCount = 0) {
  return shanten(counts, meldCount) === -1;
}

// ---- src/engine/agari.js ----
// 和了形の面子分解


/**
 * 一般形の分解をすべて列挙する。
 * counts: 手牌(鳴き以外)の34種枚数。needMentsu: 手牌で作る面子数（4 - 鳴き数）
 * 戻り値: [{ pair, mentsu: [{ type: 'shuntsu'|'koutsu', tile }] }]
 */
function decomposeStandard(counts, needMentsu) {
  const total = counts.reduce((a, b) => a + b, 0);
  if (total !== needMentsu * 3 + 2) return [];
  const c = counts.slice();
  const results = [];
  const stack = [];

  const rec = (i, pair) => {
    while (i < 34 && c[i] === 0) i++;
    if (i === 34) {
      if (stack.length === needMentsu) results.push({ pair, mentsu: stack.slice() });
      return;
    }
    if (stack.length >= needMentsu) return;
    if (c[i] >= 3) {
      c[i] -= 3;
      stack.push({ type: 'koutsu', tile: i });
      rec(i, pair);
      stack.pop();
      c[i] += 3;
    }
    if (i < 27 && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
      c[i]--; c[i + 1]--; c[i + 2]--;
      stack.push({ type: 'shuntsu', tile: i });
      rec(i, pair);
      stack.pop();
      c[i]++; c[i + 1]++; c[i + 2]++;
    }
  };

  for (let p = 0; p < 34; p++) {
    if (c[p] < 2) continue;
    c[p] -= 2;
    rec(0, p);
    c[p] += 2;
  }
  return results;
}

/** 七対子形（7種の対子） */
function isChiitoitsuShape(counts) {
  let pairs = 0;
  for (let i = 0; i < 34; i++) {
    if (counts[i] === 2) pairs++;
    else if (counts[i] !== 0) return false;
  }
  return pairs === 7;
}

/** 国士無双形 */
function isKokushiShape(counts) {
  let pair = false;
  for (let i = 0; i < 34; i++) {
    if (isYaochu(i)) {
      if (counts[i] === 0) return false;
      if (counts[i] === 2) {
        if (pair) return false;
        pair = true;
      } else if (counts[i] !== 1) return false;
    } else if (counts[i] !== 0) return false;
  }
  return pair;
}

/**
 * 分解に対して「和了牌がどのブロックに入ったか」の解釈を列挙する。
 * 戻り値: [{ wait: 'tanki'|'shanpon'|'ryanmen'|'kanchan'|'penchan', index }]
 *   index: 刻子/順子の場合は mentsu 配列内の位置、単騎は -1
 */
function waitInterpretations(dec, win) {
  const out = [];
  const seen = new Set();
  const push = (wait, index, key) => {
    if (seen.has(key)) return;
    seen.add(key);
    out.push({ wait, index });
  };
  if (dec.pair === win) push('tanki', -1, 'tanki');
  dec.mentsu.forEach((m, idx) => {
    if (m.type === 'koutsu') {
      if (m.tile === win) push('shanpon', idx, `k${m.tile}`);
      return;
    }
    const s = m.tile;
    if (win === s + 1) push('kanchan', idx, `c${s}`);
    else if (win === s) push(s % 9 === 6 ? 'penchan' : 'ryanmen', idx, `l${s}`);
    else if (win === s + 2) push(s % 9 === 0 ? 'penchan' : 'ryanmen', idx, `h${s}`);
  });
  return out;
}

const WAIT_LABELS = {
  ryanmen: 'リャンメン',
  kanchan: 'カンチャン',
  penchan: 'ペンチャン',
  shanpon: 'シャンポン',
  tanki: 'タンキ',
  chiitoitsu: 'タンキ',
  kokushi: '国士',
  kokushi13: '国士13面',
};

// ---- src/engine/score.js ----
// 役・符・点数の計算



const DEFAULT_RULES = Object.freeze({
  kuitan: true, // 喰いタン
  kiriage: false, // 切り上げ満貫（30符4翻・60符3翻を満貫に）
  kazoe: true, // 13翻以上を数え役満にする（false なら三倍満止まり）
  multipleYakuman: true, // 役満の複合
  doubleYakuman: false, // 四暗刻単騎・国士13面・純正九蓮・大四喜をダブル役満に
  doubleWindPairFu: 4, // 連風牌の雀頭の符（2 または 4）
  ryuuiisouNeedsHatsu: false, // 緑一色に發が必須か
  sanma: false, // 三人麻雀（2〜8萬なし・チーなし・北や花は抜きドラ）
  tsumoLoss: true, // 三人麻雀のツモ損（いない家のぶんは受け取らない）。false なら二人で折半
  fuMode: 'normal', // 符の数え方: 'normal' | 'fix30'（30符固定）| 'fix40'（40符固定）
  fuExceptions: true, // 固定符でも 七対子25符・平和ツモ20符 は例外にする
  flowers: false, // 花牌（春夏秋冬）を使う。false なら写真から花牌として読まない
});

/** 三人麻雀で使わない牌（2萬〜8萬） */
const isSanmaMissing = (tile) => tile >= 1 && tile <= 7;

const SPECIAL_LABELS = {
  rinshan: '嶺上開花',
  chankan: '槍槓',
  haitei: '海底摸月',
  houtei: '河底撈魚',
  tenhou: '天和',
  chiihou: '地和',
};

const YAKUMAN_NAMES = {
  kokushi: '国士無双',
  kokushi13: '国士無双十三面待ち',
  suuankou: '四暗刻',
  suuankouTanki: '四暗刻単騎',
  daisangen: '大三元',
  shousuushii: '小四喜',
  daisuushii: '大四喜',
  tsuuiisou: '字一色',
  ryuuiisou: '緑一色',
  chinroutou: '清老頭',
  chuuren: '九蓮宝燈',
  junseiChuuren: '純正九蓮宝燈',
  suukantsu: '四槓子',
  tenhou: '天和',
  chiihou: '地和',
};
const DOUBLE_TYPES = new Set(['kokushi13', 'suuankouTanki', 'junseiChuuren', 'daisuushii']);

const up100 = (x) => Math.ceil(x / 100) * 100;

/** 基本点と満貫以上の名称 */
function basePoints(han, fu, rules = DEFAULT_RULES) {
  if (han >= 13 && rules.kazoe) return { base: 8000, limit: '数え役満' };
  if (han >= 11) return { base: 6000, limit: '三倍満' };
  if (han >= 8) return { base: 4000, limit: '倍満' };
  if (han >= 6) return { base: 3000, limit: '跳満' };
  if (han >= 5) return { base: 2000, limit: '満貫' };
  const raw = fu * 2 ** (han + 2);
  if (raw >= 2000) return { base: 2000, limit: '満貫' };
  if (rules.kiriage && raw === 1920) return { base: 2000, limit: '満貫' };
  return { base: raw, limit: '' };
}

/**
 * 支払い（本場・供託込みの合計も返す）
 * 三人麻雀（rules.sanma）では子が1人少ない。
 *   ツモ損あり: いない子のぶんは受け取らない
 *   ツモ損なし: いない子のぶんを、払う2人で折半する（100点単位に切り上げ）
 */
function payments(base, { dealer, tsumo, honba = 0, kyotaku = 0, rules = DEFAULT_RULES }) {
  const bonus = 1000 * kyotaku;
  const sanma = !!rules.sanma;
  const loss = rules.tsumoLoss !== false;
  if (!tsumo) {
    const ron = up100(base * (dealer ? 6 : 4));
    return {
      payment: { type: 'ron', ron, honbaBonus: 300 * honba },
      points: ron,
      total: ron + 300 * honba + bonus,
      label: `${ron}`,
    };
  }
  const half = (x) => up100(x / 2); // いない家のぶんを2人で折半（100点単位に切り上げ）
  if (dealer) {
    const kids = sanma ? 2 : 3;
    const one = up100(base * 2);
    const each = sanma && !loss ? one + half(one) : one;
    return {
      payment: { type: 'tsumoDealer', each, honbaEach: 100 * honba, payers: kids },
      points: each * kids,
      total: (each + 100 * honba) * kids + bonus,
      label: `${each}オール`,
    };
  }
  const kids = sanma ? 1 : 2; // 自分以外の子の人数
  const one = up100(base);
  const extra = sanma && !loss ? half(one) : 0; // いない子のぶんを折半
  const child = one + extra;
  const parent = up100(base * 2) + extra;
  return {
    payment: { type: 'tsumo', child, parent, honbaEach: 100 * honba, payers: kids },
    points: child * kids + parent,
    total: child * kids + parent + 100 * honba * (kids + 1) + bonus,
    label: `${child}-${parent}`,
  };
}

function checkChuuren(c, win) {
  const need = [3, 1, 1, 1, 1, 1, 1, 1, 3];
  for (let s = 0; s < 3; s++) {
    let total = 0;
    for (let r = 0; r < 9; r++) total += c[s * 9 + r];
    if (total !== 14) continue;
    for (let r = 0; r < 9; r++) if (c[s * 9 + r] < need[r]) return null;
    const w = win - s * 9;
    let junsei = true;
    for (let r = 0; r < 9; r++) {
      if (c[s * 9 + r] - (r === w ? 1 : 0) !== need[r]) junsei = false;
    }
    return junsei ? 'junseiChuuren' : 'chuuren';
  }
  return null;
}

function colorInfo(full) {
  const suits = new Set();
  let total = 0, honors = 0, simples = 0, terminals = 0;
  let allGreen = true;
  for (let i = 0; i < 34; i++) {
    const n = full[i];
    if (!n) continue;
    total += n;
    if (i >= 27) honors += n;
    else suits.add(suitOf(i));
    if (isSimple(i)) simples += n;
    if (isTerminal(i)) terminals += n;
    if (!isGreen(i)) allGreen = false;
  }
  return {
    suitCount: suits.size,
    hasHonor: honors > 0,
    allHonor: honors === total,
    allSimple: simples === total,
    allYaochu: simples === 0,
    allTerminal: terminals === total,
    allGreen,
    hasHatsu: full[HATSU] > 0,
  };
}

function buildEnv(input) {
  const rules = { ...DEFAULT_RULES, ...(input.rules || {}) };
  const melds = (input.melds || []).map((m) => ({ type: m.type, tiles: m.tiles.slice() }));
  const k = melds.length;
  if (input.winTile == null) return { error: 'noWinTile' };
  const concealed = input.concealed || [];
  const hand = [...concealed, input.winTile];
  if (hand.length !== 14 - 3 * k) return { error: 'count' };

  if (rules.sanma && melds.some((m) => m.type === 'chi')) return { error: 'sanmaChi' };
  const menzen = melds.every((m) => m.type === 'ankan');
  const tsumo = !!input.tsumo;
  const seatWind = input.seatWind ?? EAST;
  const roundWind = input.roundWind ?? EAST;
  const dealer = seatWind === EAST;
  const hasKan = melds.some((m) => m.type === 'minkan' || m.type === 'ankan');
  const riichi = menzen ? input.riichi | 0 : 0;
  const ippatsu = riichi > 0 && !!input.ippatsu;

  let special = input.special || '';
  if (special === 'rinshan' && !(tsumo && hasKan)) special = '';
  if (special === 'haitei' && !tsumo) special = '';
  if ((special === 'houtei' || special === 'chankan') && tsumo) special = '';
  if (special === 'tenhou' && !(tsumo && dealer && k === 0)) special = '';
  if (special === 'chiihou' && !(tsumo && !dealer && k === 0)) special = '';

  const c = countsOf(hand);
  const allTiles = hand.concat(...melds.map((m) => m.tiles));
  const full = countsOf(allTiles);
  let dora = 0;
  for (const ind of input.doraIndicators || []) dora += full[doraFromIndicator(ind)];
  let ura = 0;
  if (riichi > 0) {
    for (const ind of input.uraIndicators || []) ura += full[doraFromIndicator(ind)];
    ura += Math.max(0, input.uraCount | 0); // 枚数で直接入れた裏ドラ
  }
  const aka = allTiles.filter(isRed).length;
  const nuki = Math.max(0, input.nuki | 0); // 抜きドラ（北・花）

  return {
    rules, melds, k, menzen, tsumo, seatWind, roundWind, dealer, riichi, ippatsu, special,
    honba: Math.max(0, input.honba | 0),
    kyotaku: Math.max(0, input.kyotaku | 0),
    c, win: tileBase(input.winTile), full,
    color: colorInfo(full),
    chuuren: k === 0 ? checkChuuren(c, tileBase(input.winTile)) : null,
    dora: { dora, aka, ura, nuki },
  };
}

function situationalYaku(env) {
  const y = [];
  if (env.riichi === 2) y.push(['ダブル立直', 2]);
  else if (env.riichi === 1) y.push(['立直', 1]);
  if (env.ippatsu) y.push(['一発', 1]);
  if (env.menzen && env.tsumo) y.push(['門前清自摸和', 1]);
  if (env.special && env.special !== 'tenhou' && env.special !== 'chiihou') {
    y.push([SPECIAL_LABELS[env.special], 1]);
  }
  return y;
}

function yakumanResult(keys, env, detail) {
  const list = keys.map((key) => ({
    key,
    name: YAKUMAN_NAMES[key],
    mult: DOUBLE_TYPES.has(key) && env.rules.doubleYakuman ? 2 : 1,
  }));
  const mult = env.rules.multipleYakuman
    ? list.reduce((s, x) => s + x.mult, 0)
    : Math.max(...list.map((x) => x.mult));
  const base = 8000 * mult;
  const limit = mult === 1 ? '役満' : mult === 2 ? 'ダブル役満' : mult === 3 ? 'トリプル役満' : `${mult}倍役満`;
  return {
    ok: true,
    yakuman: mult,
    yaku: list.map((x) => ({ name: x.name, yakuman: x.mult })),
    doraList: [],
    han: null,
    fu: null,
    fuParts: [],
    base,
    limit,
    dealer: env.dealer,
    tsumo: env.tsumo,
    ...payments(base, env),
    ...detail,
  };
}

function regularResult(yaku, fuInfo, env, detail) {
  const yakuHan = yaku.reduce((s, y) => s + y[1], 0);
  if (yakuHan === 0) {
    return { ok: false, reason: 'noYaku', fu: fuInfo.fu, fuParts: fuInfo.parts, dora: env.dora, ...detail };
  }
  const { dora, aka, ura, nuki } = env.dora;
  const doraList = [];
  if (dora) doraList.push({ name: `ドラ${dora}枚`, han: dora });
  if (aka) doraList.push({ name: `赤ドラ${aka}枚`, han: aka });
  if (nuki) doraList.push({ name: `抜きドラ${nuki}枚`, han: nuki });
  if (ura) doraList.push({ name: `裏ドラ${ura}枚`, han: ura });
  const han = yakuHan + dora + aka + ura + nuki;
  const { base, limit } = basePoints(han, fuInfo.fu, env.rules);
  return {
    ok: true,
    yakuman: 0,
    yaku: yaku.map(([name, h]) => ({ name, han: h })),
    doraList,
    han,
    fu: fuInfo.fu,
    fuRaw: fuInfo.raw,
    fuParts: fuInfo.parts,
    base,
    limit,
    dealer: env.dealer,
    tsumo: env.tsumo,
    ...payments(base, env),
    ...detail,
  };
}

/**
 * 符の設定を反映する。'fix30' / 'fix40' は符を一律にする（素人麻雀でよくある数え方）。
 * fuExceptions が true なら、七対子25符と平和ツモ20符はそのまま残す。
 */
function applyFuMode(info, env, kind) {
  const mode = env.rules.fuMode || 'normal';
  if (mode !== 'fix30' && mode !== 'fix40') return info;
  if (env.rules.fuExceptions !== false && (kind === 'chiitoi' || info.pinfuTsumo)) return info;
  const fu = mode === 'fix30' ? 30 : 40;
  return { fu, raw: info.raw, fixed: true, parts: [{ label: `${fu}符固定`, fu }] };
}

function calcFu(blocks, pair, wait, env, pinfu) {
  if (pinfu && env.tsumo) return { fu: 20, raw: 20, pinfuTsumo: true, parts: [{ label: '平和ツモ', fu: 20 }] };
  const parts = [{ label: '副底', fu: 20 }];
  if (env.menzen && !env.tsumo) parts.push({ label: '門前ロン', fu: 10 });
  if (env.tsumo) parts.push({ label: 'ツモ', fu: 2 });
  if (wait === 'tanki' || wait === 'kanchan' || wait === 'penchan') {
    parts.push({ label: `${WAIT_LABELS[wait]}待ち`, fu: 2 });
  }
  let pf = 0;
  if (isDragon(pair)) pf = 2;
  else {
    const s = pair === env.seatWind;
    const r = pair === env.roundWind;
    if (s && r) pf = env.rules.doubleWindPairFu;
    else if (s || r) pf = 2;
  }
  if (pf) parts.push({ label: `雀頭 ${tileLabel(pair)}`, fu: pf });
  for (const b of blocks) {
    if (b.kind !== 'koutsu') continue;
    const concealed = !b.open && !b.ronOpen;
    const v = (isYaochu(b.tile) ? 4 : 2) * (concealed ? 2 : 1) * (b.kan ? 4 : 1);
    const name = b.kan ? (concealed ? '暗槓' : '明槓') : concealed ? '暗刻' : '明刻';
    parts.push({ label: `${name} ${tileLabel(b.tile)}`, fu: v });
  }
  const raw = parts.reduce((s, p) => s + p.fu, 0);
  let fu = Math.ceil(raw / 10) * 10;
  if (!env.menzen && fu < 30) {
    parts.push({ label: '喰い平和形は30符', fu: 30 - fu });
    fu = 30;
  }
  return { fu, raw, parts };
}

function evalStandard(dec, interp, env) {
  const blocks = dec.mentsu.map((m, idx) => ({
    kind: m.type,
    tile: m.tile,
    open: false,
    kan: false,
    ronOpen: !env.tsumo && interp.wait === 'shanpon' && interp.index === idx,
  }));
  for (const m of env.melds) {
    blocks.push({
      kind: m.type === 'chi' ? 'shuntsu' : 'koutsu',
      tile: Math.min(...m.tiles.map(tileBase)),
      open: m.type !== 'ankan',
      kan: m.type === 'minkan' || m.type === 'ankan',
      ronOpen: false,
    });
  }
  const pair = dec.pair;
  const wait = interp.wait;
  const koutsu = blocks.filter((b) => b.kind === 'koutsu');
  const shuntsu = blocks.filter((b) => b.kind === 'shuntsu');
  const ankou = koutsu.filter((b) => !b.open && !b.ronOpen).length;
  const kans = koutsu.filter((b) => b.kan).length;
  const dragonK = koutsu.filter((b) => isDragon(b.tile)).length;
  const windK = koutsu.filter((b) => isWind(b.tile)).length;
  const ci = env.color;
  const detail = { form: 'standard', wait, waitIndex: interp.index, pair, blocks };

  // 役満
  const ym = [];
  if (env.special === 'tenhou') ym.push('tenhou');
  if (env.special === 'chiihou') ym.push('chiihou');
  if (ankou === 4) ym.push(wait === 'tanki' ? 'suuankouTanki' : 'suuankou');
  if (dragonK === 3) ym.push('daisangen');
  if (windK === 4) ym.push('daisuushii');
  else if (windK === 3 && isWind(pair)) ym.push('shousuushii');
  if (ci.allHonor) ym.push('tsuuiisou');
  if (ci.allGreen && (!env.rules.ryuuiisouNeedsHatsu || ci.hasHatsu)) ym.push('ryuuiisou');
  if (ci.allTerminal) ym.push('chinroutou');
  if (kans === 4) ym.push('suukantsu');
  if (env.chuuren) ym.push(env.chuuren);
  if (ym.length) return yakumanResult(ym, env, detail);

  // 通常役
  const y = situationalYaku(env);
  const menzen = env.menzen;
  const kui = (h) => (menzen ? h : h - 1);
  const valuePair = isDragon(pair) || pair === env.seatWind || pair === env.roundWind;
  const pinfu = menzen && env.k === 0 && shuntsu.length === 4 && !valuePair && wait === 'ryanmen';
  if (pinfu) y.push(['平和', 1]);
  if (ci.allSimple && (menzen || env.rules.kuitan)) y.push(['断幺九', 1]);
  if (menzen) {
    const cnt = new Map();
    for (const b of shuntsu) cnt.set(b.tile, (cnt.get(b.tile) || 0) + 1);
    let peiko = 0;
    for (const v of cnt.values()) peiko += (v / 2) | 0;
    if (peiko >= 2) y.push(['二盃口', 3]);
    else if (peiko === 1) y.push(['一盃口', 1]);
  }
  for (const b of koutsu) {
    if (b.tile === HAKU) y.push(['役牌 白', 1]);
    else if (b.tile === HATSU) y.push(['役牌 發', 1]);
    else if (b.tile === CHUN) y.push(['役牌 中', 1]);
    else if (isWind(b.tile)) {
      if (b.tile === env.roundWind) y.push([`場風 ${windLabel(b.tile)}`, 1]);
      if (b.tile === env.seatWind) y.push([`自風 ${windLabel(b.tile)}`, 1]);
    }
  }
  const shun = new Set(shuntsu.map((b) => b.tile));
  for (let r = 0; r < 7; r++) {
    if (shun.has(r) && shun.has(r + 9) && shun.has(r + 18)) {
      y.push(['三色同順', kui(2)]);
      break;
    }
  }
  for (let s = 0; s < 3; s++) {
    if (shun.has(s * 9) && shun.has(s * 9 + 3) && shun.has(s * 9 + 6)) {
      y.push(['一気通貫', kui(2)]);
      break;
    }
  }
  const blockHasYaochu = (b) =>
    b.kind === 'shuntsu' ? b.tile % 9 === 0 || b.tile % 9 === 6 : isYaochu(b.tile);
  if (shuntsu.length > 0 && isYaochu(pair) && blocks.every(blockHasYaochu)) {
    if (ci.hasHonor) y.push(['混全帯幺九', kui(2)]);
    else y.push(['純全帯幺九', kui(3)]);
  }
  if (koutsu.length === 4) y.push(['対々和', 2]);
  if (ankou === 3) y.push(['三暗刻', 2]);
  const kou = new Set(koutsu.map((b) => b.tile));
  for (let r = 0; r < 9; r++) {
    if (kou.has(r) && kou.has(r + 9) && kou.has(r + 18)) {
      y.push(['三色同刻', 2]);
      break;
    }
  }
  if (kans === 3) y.push(['三槓子', 2]);
  if (dragonK === 2 && isDragon(pair)) y.push(['小三元', 2]);
  if (ci.allYaochu) y.push(['混老頭', 2]);
  if (ci.suitCount === 1) {
    if (ci.hasHonor) y.push(['混一色', kui(3)]);
    else y.push(['清一色', kui(6)]);
  }

  const fuInfo = applyFuMode(calcFu(blocks, pair, wait, env, pinfu), env, 'standard');
  return regularResult(y, fuInfo, env, detail);
}

function evalChiitoi(env) {
  const detail = { form: 'chiitoitsu', wait: 'tanki', pair: env.win, blocks: [] };
  const ym = [];
  if (env.special === 'tenhou') ym.push('tenhou');
  if (env.special === 'chiihou') ym.push('chiihou');
  if (env.color.allHonor) ym.push('tsuuiisou');
  if (ym.length) return yakumanResult(ym, env, detail);
  const y = situationalYaku(env);
  y.push(['七対子', 2]);
  const ci = env.color;
  if (ci.allSimple) y.push(['断幺九', 1]);
  if (ci.allYaochu) y.push(['混老頭', 2]);
  if (ci.suitCount === 1) {
    if (ci.hasHonor) y.push(['混一色', 3]);
    else y.push(['清一色', 6]);
  }
  const fuInfo = applyFuMode({ fu: 25, raw: 25, parts: [{ label: '七対子', fu: 25 }] }, env, 'chiitoi');
  return regularResult(y, fuInfo, env, detail);
}

function evalKokushi(env) {
  const thirteen = env.c[env.win] === 2;
  const ym = [thirteen ? 'kokushi13' : 'kokushi'];
  if (env.special === 'tenhou') ym.unshift('tenhou');
  if (env.special === 'chiihou') ym.unshift('chiihou');
  return yakumanResult(ym, env, { form: 'kokushi', wait: thirteen ? 'kokushi13' : 'kokushi', pair: null, blocks: [] });
}

function better(a, b) {
  if (a.points !== b.points) return a.points > b.points;
  if ((a.yakuman || 0) !== (b.yakuman || 0)) return (a.yakuman || 0) > (b.yakuman || 0);
  if ((a.han || 0) !== (b.han || 0)) return (a.han || 0) > (b.han || 0);
  return (a.fu || 0) > (b.fu || 0);
}

/**
 * 和了の点数を計算する（高点法で最も高い解釈を採用）。
 * input: {
 *   concealed: 手牌id配列（和了牌を除く）, winTile: 和了牌id, melds: [{type, tiles}],
 *   tsumo, riichi(0/1/2), ippatsu, special, roundWind, seatWind,
 *   doraIndicators, uraIndicators, honba, kyotaku, rules
 * }
 */
function evaluateWin(input) {
  const env = buildEnv(input);
  if (env.error) return { ok: false, reason: env.error };
  const cands = [];
  if (env.k === 0 && isKokushiShape(env.c)) cands.push(evalKokushi(env));
  if (env.k === 0 && isChiitoitsuShape(env.c)) cands.push(evalChiitoi(env));
  for (const dec of decomposeStandard(env.c, 4 - env.k)) {
    for (const it of waitInterpretations(dec, env.win)) cands.push(evalStandard(dec, it, env));
  }
  if (!cands.length) return { ok: false, reason: 'notAgari' };
  let best = null;
  for (const r of cands) if (r.ok && (!best || better(r, best))) best = r;
  if (best) return best;
  // 役なし: 形の説明用に、符が最も高い解釈の分解を返す
  let shape = cands[0];
  for (const r of cands) if ((r.fu || 0) > (shape.fu || 0)) shape = r;
  return { ...shape, ok: false, reason: 'noYaku', dora: env.dora };
}

// ---- src/engine/analyze.js ----
// 画面から呼ぶ総合解析
//   13枚（鳴きがあれば 13-3n 枚）: シャンテン数 → テンパイなら待ちと待ち牌ごとの点数、未テンパイなら有効牌
//   14枚（和了牌つき）           : 和了なら点数、和了でなければ打牌候補と受け入れ




/** その牌がそのルールに存在するか（三人麻雀では2〜8萬がない） */
const exists = (tile, rules) => !(rules && rules.sanma && isSanmaMissing(tile));

function removeOne(list, id) {
  const i = list.indexOf(id);
  if (i < 0) return list.slice();
  return [...list.slice(0, i), ...list.slice(i + 1)];
}

function scoringContext(state) {
  const s = state.situation || {};
  return {
    melds: state.melds || [],
    tsumo: !!s.tsumo,
    riichi: s.riichi | 0,
    ippatsu: !!s.ippatsu,
    special: s.special || '',
    roundWind: s.roundWind ?? EAST,
    seatWind: s.seatWind ?? EAST,
    doraIndicators: state.dora || [],
    uraIndicators: state.ura || [],
    uraCount: s.uraDora | 0, // 帯の「裏ドラ」±で入れた枚数（表示牌とは別に足す）
    honba: s.honba | 0,
    kyotaku: s.kyotaku | 0,
    nuki: s.nuki | 0,
    rules: { ...DEFAULT_RULES, ...(state.rules || {}) },
  };
}

/** 13枚形（3n+1）の解析 */
function analyzeWaiting(concealed, ctx, visible) {
  const k = ctx.melds.length;
  const c = countsOf(concealed);
  const sh = shantenAll(c, k);
  const out = { shanten: sh };
  if (sh.min === 0) {
    const waits = [];
    for (let x = 0; x < 34; x++) {
      if (c[x] >= 4) continue; // 自分で4枚使っている牌は和了れない
      if (!exists(x, ctx.rules)) continue; // 三人麻雀にない牌
      c[x]++;
      const ok = isAgariCounts(c, k);
      c[x]--;
      if (!ok) continue;
      waits.push({
        tile: x,
        remaining: Math.max(0, 4 - visible[x]),
        ron: evaluateWin({ ...ctx, concealed, winTile: x, tsumo: false }),
        tsumo: evaluateWin({ ...ctx, concealed, winTile: x, tsumo: true }),
      });
    }
    out.waits = waits;
    out.waitTotal = waits.reduce((s, w) => s + w.remaining, 0);
  } else {
    const ukeire = [];
    for (let x = 0; x < 34; x++) {
      if (c[x] >= 4 || !exists(x, ctx.rules)) continue;
      c[x]++;
      const s = shanten(c, k);
      c[x]--;
      if (s < sh.min) ukeire.push({ tile: x, remaining: Math.max(0, 4 - visible[x]) });
    }
    out.ukeire = ukeire;
    out.ukeireTotal = ukeire.reduce((s, u) => s + u.remaining, 0);
    if (sh.min === 1) out.tenpaiDraws = tenpaiDraws(concealed, ctx, visible);
  }
  return out;
}

/**
 * 1シャンテンの13枚形: 何を引けばテンパイになるか。
 * 戻り値: [{ draw, remaining, options: [{ discard, waits: [{tile, remaining}], total, kinds }], best }]
 *   options は「その牌を引いたあと、何を切ればどう待てるか」（待ちの種類が多い順）
 */
function tenpaiDraws(concealed, ctx, visible) {
  const k = ctx.melds.length;
  const c = countsOf(concealed);
  if (shanten(c, k) !== 1) return [];
  const out = [];
  for (let x = 0; x < 34; x++) {
    if (c[x] >= 4 || !exists(x, ctx.rules)) continue;
    c[x]++;
    if (shanten(c, k) === 0) {
      const options = [];
      for (let d = 0; d < 34; d++) {
        if (!c[d] || d === x) continue;
        c[d]--;
        if (shanten(c, k) === 0) {
          const waits = [];
          for (let w = 0; w < 34; w++) {
            if (c[w] >= 4 || !exists(w, ctx.rules)) continue;
            c[w]++;
            if (isAgariCounts(c, k)) {
              waits.push({ tile: w, remaining: Math.max(0, 4 - visible[w] - (w === x ? 1 : 0)) });
            }
            c[w]--;
          }
          if (waits.length) {
            const total = waits.reduce((s, v) => s + v.remaining, 0);
            options.push({ discard: d, waits, total, kinds: waits.length });
          }
        }
        c[d]++;
      }
      // 待ちの種類が多い順（枚数は手牌からしか数えられないので目安にとどめる）
      options.sort((p, q) => q.kinds - p.kinds || q.total - p.total || p.discard - q.discard);
      out.push({
        draw: x,
        remaining: Math.max(0, 4 - visible[x]),
        options,
        best: options[0] || null,
      });
    }
    c[x]--;
  }
  return out;
}

function noYakuHints(concealed, win, ctx) {
  const hints = [];
  const menzen = ctx.melds.every((m) => m.type === 'ankan');
  if (!menzen) return hints;
  if (!ctx.tsumo) {
    const r = evaluateWin({ ...ctx, concealed, winTile: win, tsumo: true });
    if (r.ok) hints.push('ツモ和了なら門前清自摸和で和了できます');
  }
  if (!(ctx.riichi > 0)) {
    const r = evaluateWin({ ...ctx, concealed, winTile: win, riichi: 1 });
    if (r.ok) hints.push('リーチをかけていれば和了できます');
  }
  return hints;
}

/** 14枚形（3n+2）の解析 */
function analyzeDrawn(concealed, win, ctx, visible) {
  const k = ctx.melds.length;
  const hand = [...concealed, win];
  const c = countsOf(hand);
  const sh = shantenAll(c, k);
  if (sh.min === -1) {
    const result = evaluateWin({ ...ctx, concealed, winTile: win });
    const out = { shanten: sh, agari: result };
    if (!result.ok && result.reason === 'noYaku') out.hints = noYakuHints(concealed, win, ctx);
    return out;
  }
  // 打牌候補
  const seen = new Set();
  const options = [];
  for (const id of hand) {
    const b = tileBase(id);
    if (seen.has(b)) continue;
    seen.add(b);
    // 赤5と通常5があれば通常5を切る
    const normalExists = hand.includes(b);
    const discard = normalExists ? b : redIdOf(b);
    const rest = removeOne(hand, discard);
    const s = shanten(countsOf(rest), k);
    options.push({ discard, rest, s });
  }
  const best = Math.min(...options.map((o) => o.s));
  const discards = options
    .filter((o) => o.s === best)
    .map((o) => {
      const a = analyzeWaiting(o.rest, ctx, visible);
      const entry = { discard: o.discard, shanten: o.s };
      if (best === 0) {
        entry.waits = a.waits;
        entry.total = a.waitTotal;
        entry.kinds = a.waits.length;
      } else {
        entry.ukeire = a.ukeire;
        entry.total = a.ukeireTotal;
        entry.kinds = a.ukeire.length;
      }
      return entry;
    })
    .sort((x, y) => y.kinds - x.kinds || y.total - x.total || sortKey(x.discard) - sortKey(y.discard));
  return { shanten: sh, discards };
}

/**
 * 鳴きを省いた「何待ち問題」の形（10枚・7枚）を、鳴きが k 組あるものとして解析する。
 * テンパイのときだけ { k, shanten, waits, waitTotal } を返す（点数は鳴きの中身が分からないので出さない）。
 * waits[].ron / tsumo は面子の分け方だけを持つ（ok: false, reason: 'hidden'）。
 */
function analyzeHidden(concealed, state, visible, k) {
  const c = countsOf(concealed);
  const sh = shantenAll(c, k);
  if (sh.min !== 0) return null;
  // 形の説明を作るための仮の鳴き（手牌にない字牌のポン）。点数・残り枚数には使わない
  const free = [];
  for (let h = 27; h < 34 && free.length < k; h++) if (c[h] === 0) free.push(h);
  const melds = free.map((h) => ({ type: 'pon', tiles: [h, h, h] }));
  const ctx = scoringContext({ ...state, melds, dora: [], ura: [] });
  const shapeOnly = (r) => {
    const blocks = r.blocks ? r.blocks.slice(0, r.blocks.length - k) : [];
    return { ok: false, reason: 'hidden', form: r.form, wait: r.wait, waitIndex: r.waitIndex, pair: r.pair, blocks };
  };
  const waits = [];
  for (let x = 0; x < 34; x++) {
    if (c[x] >= 4 || !exists(x, ctx.rules)) continue;
    c[x]++;
    const ok = isAgariCounts(c, k);
    c[x]--;
    if (!ok) continue;
    waits.push({
      tile: x,
      remaining: Math.max(0, 4 - visible[x]),
      ron: shapeOnly(evaluateWin({ ...ctx, concealed, winTile: x, tsumo: false })),
      tsumo: shapeOnly(evaluateWin({ ...ctx, concealed, winTile: x, tsumo: true })),
    });
  }
  if (!waits.length) return null;
  return { k, shanten: sh, waits, waitTotal: waits.reduce((s, w) => s + w.remaining, 0) };
}

/**
 * state = {
 *   concealed: 手牌id配列（和了牌を除く）, win: 和了牌id | null,
 *   melds: [{type, tiles}], dora: ドラ表示牌id[], ura: 裏ドラ表示牌id[],
 *   situation: { roundWind, seatWind, tsumo, riichi, ippatsu, special, honba, kyotaku },
 *   rules
 * }
 */
function analyze(state) {
  const concealed = state.concealed || [];
  const melds = state.melds || [];
  const win = state.win ?? null;
  const k = melds.length;
  const need = 13 - 3 * k;
  const base = { need, count: concealed.length + (win != null ? 1 : 0), errors: [], warnings: [] };

  if (k > 4) base.errors.push('鳴きは4組までです');
  const rules = { ...DEFAULT_RULES, ...(state.rules || {}) };
  if (rules.sanma) {
    if (melds.some((m) => m.type === 'chi')) base.errors.push('三人麻雀ではチーできません');
    const man = [...concealed, ...(win != null ? [win] : []), ...melds.flatMap((m) => m.tiles)]
      .map(tileBase)
      .filter((t) => isSanmaMissing(t));
    if (man.length) base.warnings.push(`三人麻雀では${tileLabel(man[0])}は使いません（設定で四人麻雀に戻せます）`);
  }
  const handTiles = win != null ? [...concealed, win] : concealed.slice();
  const meldTiles = melds.flatMap((m) => m.tiles);
  const everything = [...handTiles, ...meldTiles, ...(state.dora || []), ...(state.ura || [])];
  const cAll = countsOf(everything);
  for (let i = 0; i < 34; i++) {
    if (cAll[i] > 4) base.errors.push(`${tileLabel(i)}が${cAll[i]}枚あります（同じ牌は4枚まで）`);
  }
  if (concealed.length > need) {
    base.errors.push(`鳴きが${k}組のとき、手牌は${need}枚＋和了牌です（いま${concealed.length}枚）`);
  }
  if (base.errors.length) return { ...base, phase: 'error' };
  const visible = cAll;
  if (concealed.length < need) {
    const out = { ...base, phase: 'incomplete', missing: need - concealed.length };
    // 鳴きの入力がない10枚・7枚は「鳴きを省いた問題」の形としても見る（テンパイなら待ちを添える）
    if (k === 0 && win == null && (concealed.length === 10 || concealed.length === 7)) {
      const hidden = analyzeHidden(concealed, state, visible, (13 - concealed.length) / 3);
      if (hidden) out.hidden = hidden;
    }
    return out;
  }

  const ctx = scoringContext(state);
  if (win == null) {
    const r = analyzeWaiting(concealed, ctx, visible);
    if (r.shanten.min === 0) {
      if (!r.waits.length) base.warnings.push('テンパイ形ですが、待ち牌を自分で4枚使っているため和了れません');
      else if (r.waitTotal === 0) base.warnings.push('待ち牌がすべて見えています（残り0枚）');
    }
    return { ...base, phase: 'hand13', ...r };
  }
  return { ...base, phase: 'hand14', ...analyzeDrawn(concealed, win, ctx, visible) };
}

// ---- src/recognition/parse.js ----
// 読み取り結果（牌の表記の配列）を手牌データに変換する
//   クラウドAI（β）の JSON 出力や、手入力の文字列を想定


const HONOR_WORDS = { '東': 27, '南': 28, '西': 29, '北': 30, '白': 31, '發': 32, '発': 32, '中': 33 };
const MELD_WORDS = {
  chi: 'chi', 'チー': 'chi',
  pon: 'pon', 'ポン': 'pon',
  kan: 'minkan', minkan: 'minkan', 'カン': 'minkan', '明槓': 'minkan', 'ミンカン': 'minkan',
  ankan: 'ankan', '暗槓': 'ankan', 'アンカン': 'ankan',
};

/** "5m" "0p"(赤) "7z" "東" "赤5s" などを牌idに。読めなければ null */
function tokenToId(token) {
  if (token == null) return null;
  let t = String(token).trim().toLowerCase().replace(/\s+/g, '');
  if (!t || t === '?' || t === '？' || t === 'unknown') return null;
  if (HONOR_WORDS[t] != null) return HONOR_WORDS[t];
  let red = false;
  if (t.startsWith('赤')) {
    red = true;
    t = t.slice(1);
  } else if (t.length === 3 && t[0] === 'r') {
    red = true;
    t = t.slice(1);
  } else if (t.length === 3 && t[2] === 'r') {
    red = true;
    t = t.slice(0, 2);
  }
  const m = /^([0-9])([mpsz])$/.exec(t);
  if (!m) return null;
  const n = Number(m[1]);
  const suit = 'mpsz'.indexOf(m[2]);
  if (suit === 3) return !red && n >= 1 && n <= 7 ? 26 + n : null;
  if (n === 0 || (red && n === 5)) return 34 + suit;
  if (red) return null;
  return suit * 9 + n - 1;
}

function meldTypeOf(type, ids) {
  const named = MELD_WORDS[String(type || '').trim().toLowerCase()] || MELD_WORDS[String(type || '').trim()];
  const bases = ids.map(tileBase).sort((a, b) => a - b);
  const same = bases.every((b) => b === bases[0]);
  if (ids.length === 4 && same) return named === 'ankan' ? 'ankan' : 'minkan';
  if (ids.length === 3 && same) return 'pon';
  if (
    ids.length === 3 &&
    bases[0] < 27 &&
    bases[0] % 9 <= 6 &&
    bases[1] === bases[0] + 1 &&
    bases[2] === bases[0] + 2
  ) {
    return 'chi';
  }
  return null;
}

/**
 * { tiles: ["1m",...], win: "5p"|null, melds: [{type, tiles:[...]}], confidence }
 *   → { tiles: (id|null)[], win: id|null, melds, unknown, warnings, confidence }
 * tiles は左から右の並び。読めない牌は null のまま残す（画面で「？」として直してもらう）。
 */
function parseRecognition(obj) {
  const warnings = [];
  if (!obj || typeof obj !== 'object') {
    return { tiles: [], win: null, melds: [], unknown: 0, warnings: ['読み取り結果の形式が不正です'], confidence: null };
  }
  const melds = [];
  for (const m of Array.isArray(obj.melds) ? obj.melds : []) {
    const ids = Array.isArray(m && m.tiles) ? m.tiles.map(tokenToId) : [];
    const type = ids.length && ids.every((x) => x != null) ? meldTypeOf(m.type, ids) : null;
    if (!type) {
      warnings.push('鳴きの組を読み取れなかったため除外しました');
      continue;
    }
    const sorted = type === 'chi' ? ids.slice().sort((a, b) => tileBase(a) - tileBase(b)) : ids;
    melds.push({ type, tiles: sorted });
  }
  if (melds.length > 4) {
    warnings.push('鳴きが5組以上読み取られたため、4組までにしました');
    melds.length = 4;
  }
  const tiles = (Array.isArray(obj.tiles) ? obj.tiles : []).map(tokenToId);
  const winGiven = obj.win != null && String(obj.win).trim() !== '' && String(obj.win).toLowerCase() !== 'null';
  let win = winGiven ? tokenToId(obj.win) : null;
  let unknown = tiles.filter((x) => x == null).length;
  if (winGiven && win == null) {
    // 読めなかった和了牌は手牌の末尾に「？」として残す
    tiles.push(null);
    unknown++;
  }
  const need = 13 - 3 * melds.length;
  if (win == null && tiles.length === need + 1 && tiles[tiles.length - 1] != null) {
    win = tiles.pop();
  }
  if (tiles.length > need + (win == null ? 1 : 0)) {
    warnings.push(`手牌が${tiles.length}枚読み取られました（鳴き${melds.length}組なら${need}枚）。余分な牌を削除してください`);
  } else if (tiles.length < need) {
    warnings.push(`手牌が${tiles.length}枚しか読み取れませんでした（${need}枚必要）。足りない牌を追加してください`);
  }
  const confidence = typeof obj.confidence === 'number' ? Math.max(0, Math.min(1, obj.confidence)) : null;
  return { tiles, win, melds, unknown, warnings, confidence };
}
