<style>
:root {
  --ground: #edf1ec;
  --surface: #fafbf8;
  --surface-2: #e5eae4;
  --ink: #15201b;
  --muted: #56655e;
  --line: #cfd8d0;
  --felt: #1c5a47;
  --felt-deep: #123d31;
  --felt-lit: #2b765f;
  --felt-ink: #ecf5f0;
  --felt-muted: #a6c8b9;
  --accent: #1c5a47;
  --accent-soft: #d5e8df;
  --warn: #a8660f;
  --warn-soft: #f7ead2;
  --danger: #b42318;
  --danger-soft: #f9e2df;
  --tile-face: #f1ecdc;
  --tile-face-hi: #fffdf6;
  --tile-back: #dc9f37;
  --tile-back-hi: #efbd62;
  --key-bg: #dbe2da;
  --shadow: 0 1px 2px rgb(21 32 27 / 0.07), 0 6px 18px rgb(21 32 27 / 0.06);
  --font-ui: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Noto Sans CJK JP', system-ui, sans-serif;
  --font-display: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'Noto Serif CJK JP', serif;
  /* 見出し「何待ち？」だけは丸ゴシックで柔らかく */
  --font-brand: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', 'Kosugi Maru', 'Noto Sans JP', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --ground: #0c1310;
    --surface: #141d19;
    --surface-2: #1c2823;
    --ink: #e2ebe6;
    --muted: #93a49c;
    --line: #2b3a33;
    --felt: #1a5443;
    --felt-deep: #0f3328;
    --felt-lit: #256a55;
    --felt-ink: #eaf4ef;
    --felt-muted: #98bcad;
    --accent: #6cc6a0;
    --accent-soft: #183a2e;
    --warn: #e5ad52;
    --warn-soft: #3a2d15;
    --danger: #f28b80;
    --danger-soft: #3d1f1b;
    --tile-face: #e3ddcc;
    --tile-face-hi: #f3efe3;
    --tile-back: #c58a2b;
    --tile-back-hi: #daa44d;
    --key-bg: #22302a;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.45), 0 6px 18px rgb(0 0 0 / 0.3);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --ground: #0c1310;
  --surface: #141d19;
  --surface-2: #1c2823;
  --ink: #e2ebe6;
  --muted: #93a49c;
  --line: #2b3a33;
  --felt: #1a5443;
  --felt-deep: #0f3328;
  --felt-lit: #256a55;
  --felt-ink: #eaf4ef;
  --felt-muted: #98bcad;
  --accent: #6cc6a0;
  --accent-soft: #183a2e;
  --warn: #e5ad52;
  --warn-soft: #3a2d15;
  --danger: #f28b80;
  --danger-soft: #3d1f1b;
  --tile-face: #e3ddcc;
  --tile-face-hi: #f3efe3;
  --tile-back: #c58a2b;
  --tile-back-hi: #daa44d;
  --key-bg: #22302a;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.45), 0 6px 18px rgb(0 0 0 / 0.3);
  color-scheme: dark;
}

html {
  height: 100%;
  box-sizing: border-box;
}
*,
*::before,
*::after {
  box-sizing: inherit;
}
body {
  height: 100%;
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--muted);
}

/* ---------- レイアウト ---------- */
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.app > .cam,
.app > .manual {
  flex: 1;
  min-height: 0;
}

/* ---------- 共通のヘッダー（どちらの画面でも同じ位置・同じ見た目） ---------- */
.appbar {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  padding: 8px max(12px, env(safe-area-inset-left, 0px)) 6px max(12px, env(safe-area-inset-right, 0px));
}
.brand-mini {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-brand);
  font-weight: 900;
  font-size: 24px;
  letter-spacing: 0.04em;
  line-height: 1;
  white-space: nowrap;
}
/* 見出しの横の牌（中）。少し傾けて遊びを出す */
.brand-tile {
  display: inline-flex;
  align-items: center;
  flex: none;
}
.brand-tile .tile.brand-mark {
  --w: 18px;
  --edge: 2px;
  margin-bottom: 3px;
  transform: rotate(-10deg);
}
.guide-hero .brand-tile .tile.brand-mark {
  --w: 24px;
  --edge: 3px;
  margin-right: 3px;
}
.appbar .mode-switch {
  /* 見出しと「？」のあとに回して、狭い画面では下の行いっぱいに広げる */
  order: 3;
  flex: 1 1 100%;
}
.appbar .mode-switch button {
  flex: 1 1 0;
  min-width: 0;
  justify-content: center;
  padding-inline: 6px;
}
.appbar .help-btn {
  margin-left: auto;
}
@media (min-width: 560px) {
  .appbar .mode-switch {
    order: 0;
    flex: 0 0 auto;
    margin-left: auto;
  }
  .appbar .mode-switch button {
    flex: 0 0 auto;
    padding-inline: 13px;
  }
  .appbar .help-btn {
    margin-left: 0;
  }
}
.appbar .help-btn {
  flex: none;
}

/* ---------- 状況の帯（場の設定／アガリ想定。画像の外に出して、枠で囲う） ---------- */
.rules-bar {
  flex: none;
  display: grid;
  /* 見出しの列は2段で同じ幅（右のボタンの始まりが揃う）。3列目は その他・リセット・OK の縦の列 */
  grid-template-columns: max-content minmax(0, 1fr) auto;
  align-items: center;
  gap: 5px 7px;
  margin: 0 max(10px, env(safe-area-inset-left, 0px)) 4px;
  padding: 6px 6px 6px 8px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  min-width: 0;
}
.sit-head {
  justify-self: stretch;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 3px;
  min-width: 4.4em;
  padding: 2px 1px;
  font-size: 12px;
  font-weight: 800;
  line-height: 1.2;
  white-space: nowrap;
  color: var(--ink);
}
/* 見出しの下のステータス札: 未設定（灰）→ 未確定（オレンジ）→ 設定済（緑） */
.sit-head .st {
  font-style: normal;
  font-size: 10px;
  font-weight: 800;
  line-height: 16px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
}
.sit-head .st[data-st='edit'] {
  background: var(--warn-soft);
  color: var(--warn);
}
.sit-head .st[data-st='ok'] {
  background: var(--accent-soft);
  color: var(--accent);
}
/* 「リセット」「OK」 */
.sbtn {
  height: 24px;
  padding: 0 10px;
  border: 0;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.sbtn.reset {
  background: var(--surface-2);
  color: var(--ink);
  box-shadow: inset 0 0 0 1.5px var(--line);
}
.sbtn.ok {
  background: var(--accent);
  color: #fff;
}
.sbtn.ok[data-done='true'] {
  background: var(--accent-soft);
  color: var(--accent);
  box-shadow: inset 0 0 0 1.5px var(--accent);
}
:root[data-theme='dark'] .sbtn.ok[data-done='false'] {
  color: #0c1310;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .sbtn.ok[data-done='false'] {
    color: #0c1310;
  }
}
/* 見出しの帯: 「条件/ルール 設定」（帯の上）と「何待ち 判断」（判断エリアの上）。背景つきのヘッダー、右に2行の補足 */
.area-head {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 2px max(8px, env(safe-area-inset-left, 0px)) 4px;
  padding: 4px 9px;
  border-radius: 10px;
  background: var(--accent-soft);
  box-shadow: inset 4px 0 0 var(--accent);
}
/* ヘッダー左端の ＋／− で、中の設定枠を開いたり閉じたりする */
.area-toggle {
  flex: none;
  position: relative;
  width: 22px;
  height: 22px;
  border: 0;
  padding: 0;
  border-radius: 7px;
  background: var(--surface);
  color: var(--accent);
  box-shadow: inset 0 0 0 1.5px var(--accent);
}
.area-toggle .pm::before,
.area-toggle .pm::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 12px;
  height: 2.5px;
  border-radius: 2px;
  background: currentColor;
  transform: translate(-50%, -50%);
}
/* 開いているときは「−」、たたんでいるときは「＋」 */
.area-toggle .pm::after {
  transform: translate(-50%, -50%) rotate(90deg);
  opacity: 0;
  transition: opacity 0.15s ease;
}
.setup-head[data-open='false'] .area-toggle .pm::after {
  opacity: 1;
}
/* 見出しと、その下のステータス札（たたんでいても状態が分かるように） */
.head-title {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
  min-width: 0;
}
.head-st {
  font-style: normal;
  font-size: 10px;
  font-weight: 800;
  line-height: 16px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  box-shadow: inset 0 0 0 1.5px var(--line);
}
.head-st[data-st='edit'] {
  background: var(--warn-soft);
  color: var(--warn);
  box-shadow: inset 0 0 0 1.5px var(--warn);
}
.head-st[data-st='ok'] {
  background: var(--accent);
  color: #fff;
  box-shadow: none;
}
.area-head b {
  flex: none;
  font-family: var(--font-brand);
  font-size: 14.5px;
  font-weight: 900;
  letter-spacing: 0.02em;
  color: var(--accent);
  white-space: nowrap;
}
/* 画面の幅に合わせて少しずつ縮め、どの端末でも2行に収まるようにする */
.area-head small {
  flex: 1 1 auto;
  min-width: 0;
  font-size: clamp(9px, 2.65vw, 11px);
  line-height: 1.5;
  color: var(--ink);
}
/* 補足の中の「未設定」（帯の札と同じ見た目）・見出しの名前（見出しと同じ書体・色）・「OK」（ボタンと同じ色） */
.area-head small .st-mini {
  display: inline-block;
  font-style: normal;
  font-size: 0.9em;
  font-weight: 800;
  line-height: 15px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  box-shadow: inset 0 0 0 1px var(--line);
  vertical-align: 1px;
}
.area-head small .ref-head {
  font-family: var(--font-brand);
  font-size: 1.04em;
  font-weight: 900;
  letter-spacing: 0;
  color: var(--accent);
  white-space: nowrap;
}
.area-head small .ok-mini {
  display: inline-block;
  margin: 0 2px;
  font-size: 9.5px;
  font-weight: 800;
  line-height: 15px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  vertical-align: 1px;
}
:root[data-theme='dark'] .area-head small .ok-mini {
  color: #0c1310;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .area-head small .ok-mini {
    color: #0c1310;
  }
}
.judge-head {
  margin-top: 4px;
}
/* 点数を出す前の案内 */
.score-wait {
  display: grid;
  gap: 4px;
  margin: 8px 0;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1.5px dashed var(--line);
  background: var(--surface-2);
}
.score-wait b {
  font-size: 13px;
  color: var(--ink);
}
.score-wait span {
  font-size: 12px;
  line-height: 1.45;
  color: var(--muted);
}
.pending {
  color: var(--muted);
  font-weight: 700;
}
/* 見出し横の「4人／3人」 */
.players-seg {
  flex: none;
  display: inline-flex;
  padding: 2px;
  border-radius: 999px;
  background: var(--surface-2);
}
.players-seg button {
  display: inline-flex;
  align-items: center; /* 高さの中央にそろえる（baseline だと上に寄る） */
  gap: 1px;
  height: 30px;
  padding: 0 10px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: var(--muted);
  font-weight: 800;
  line-height: 1;
}
.players-seg button b {
  font-size: 17px; /* 「四人」「三人」を大きく */
  line-height: 1;
}
.players-seg button small {
  align-self: flex-end;
  margin-bottom: 7px; /* 大きい文字の下端にそろえる */
  font-size: 10px; /* 「麻雀」は小さく */
  font-weight: 700;
  line-height: 1;
}
.players-seg button[aria-pressed='true'] {
  background: var(--accent);
  color: #fff;
}
:root[data-theme='dark'] .players-seg button[aria-pressed='true'] {
  color: #0c1310;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .players-seg button[aria-pressed='true'] {
    color: #0c1310;
  }
}
/* 場の設定 と アガリ想定 の間の鎖線（右の縦の列にはかからない） */
.sit-sep {
  grid-column: 1 / 3;
  height: 0;
  margin: 1px 0;
  border-top: 1.5px dashed var(--line);
}
/* 右の縦の列: その他・リセット・OK。2段の高さの中央に置き、左の縦線で「両方の段に対応」を示す */
.sit-side {
  grid-column: 3;
  grid-row: 1 / 4;
  align-self: center;
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-left: -2px;
  padding-left: 6px;
  border-left: 1.5px solid var(--line);
}
.sit-side .sbtn,
.sit-side .gchip.more {
  width: 100%;
  min-width: 4.2em;
  height: 24px;
  padding: 0 5px;
  font-size: 11px;
}
/* その他はOK（緑）と見分けるため黒 */
.rules-bar .sit-side .gchip.more {
  min-width: 0;
  border-radius: 999px;
  background: var(--ink);
  color: var(--surface);
}
.rules-bar .sit-side .gchip.more[data-changed='true']::after {
  top: 0;
  right: 1px;
}
.sit-chips {
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}
.bstep {
  display: inline-flex;
  align-items: center;
  gap: 0;
  border-radius: 999px;
  padding: 1px 3px 1px 5px; /* ＋の右にも少し余白 */
  background: var(--surface-2);
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
}
.bstep[data-on='true'] {
  background: var(--warn-soft);
  color: var(--ink);
}
/* 裏ドラはリーチのときだけ数える（リーチなしのときは薄く） */
.bstep[data-dim='true'] {
  opacity: 0.55;
}
.bstep button {
  width: 18px;
  height: 22px;
  border: 0;
  border-radius: 50%;
  background: none;
  color: var(--ink);
  font-size: 15px;
  line-height: 1;
}
.bstep button:active {
  background: rgb(0 0 0 / 0.1);
}
.bstep output {
  min-width: 1.15em; /* 2桁でも枠が動かない */
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
}
.rules-label {
  flex: none;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.rules-bar .gchip {
  padding: 3px 7px;
  font-size: 11px;
  background: var(--surface-2);
  color: var(--ink);
  box-shadow: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
.rules-bar .gchip[aria-pressed='true'] {
  background: var(--ink);
  color: var(--surface);
}
.rules-bar .gchip.toggle[aria-pressed='true'] {
  background: var(--warn);
  color: #fff;
}
.manual {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 1120px;
  margin-inline: auto;
  padding-inline: 16px;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 10px 8px;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}
.brand b {
  flex: none;
  white-space: nowrap;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 23px;
  letter-spacing: 0.06em;
  line-height: 1;
}
.brand span {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.status-chip {
  flex: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.status-chip .dealer {
  color: var(--accent);
}
.workspace {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto;
  grid-template-areas: 'table' 'results';
}
/* 手入力はページ全体をスクロールする（結果の欄だけを小さくスクロールさせない）。
   スマホでは牌のキーボードを画面の下に重ねて出し、その高さぶん body の下に余白を足す（--kb-space は JS が入れる） */
.app[data-mode='manual'] {
  height: auto;
  min-height: 100%;
}
.app[data-mode='manual'] > .manual {
  flex: 1 0 auto;
  height: auto;
}
body {
  padding-bottom: var(--kb-space, 0px);
}
/* 写真の画面は画面の高さに合わせて作る（html・body は 100%）。手入力の画面は中身の高さでページごとスクロールする */
html[data-mode='manual'],
html[data-mode='manual'] body {
  height: auto;
  min-height: 100%;
}
/* キーボードを開いている間は、手牌を画面の上に留める（下の結果を見ながら入れられる） */
.manual[data-kb='open'] .table {
  position: sticky;
  top: 0;
  z-index: 6;
}
@media (min-width: 720px) and (min-height: 600px) {
  .workspace {
    grid-template-columns: minmax(0, clamp(342px, 42%, 470px)) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: 'table results' 'keyboard results';
    column-gap: 24px;
  }
  /* 広い画面では今までどおり左の列に置く（重ねない）。下の「牌キーボード」の基本より強くするため .workspace を付ける */
  .workspace > .keyboard {
    position: static;
    align-self: start;
    max-width: none;
    margin: 0;
    padding: 8px 0 10px;
    background: none;
    border-radius: 0;
    box-shadow: none;
  }
  .manual[data-kb='open'] .table {
    position: relative;
  }
}

/* ---------- 卓（手牌） ---------- */
.table {
  grid-area: table;
  container-type: inline-size;
  position: relative;
  color: var(--felt-ink);
  border-radius: 14px;
  padding: 9px 12px 12px;
  background:
    radial-gradient(rgb(255 255 255 / 0.035) 0.8px, transparent 0.9px) 0 0 / 3px 3px,
    radial-gradient(130% 150% at 50% 0%, var(--felt-lit) 0%, var(--felt) 48%, var(--felt-deep) 100%);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.07), inset 0 12px 28px rgb(0 0 0 / 0.2);
}
.table-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--felt-muted);
  letter-spacing: 0.04em;
}
.table-head strong {
  color: var(--felt-ink);
  font-variant-numeric: tabular-nums;
}
.sample-tag {
  border: 1px solid rgb(255 255 255 / 0.35);
  color: var(--felt-ink);
  border-radius: 999px;
  padding: 1px 8px;
  margin-right: 6px;
  font-size: 11px;
}
.hand {
  /* --w0 が普通の牌の幅。入力中の枠だけ 1.25 倍にするので、そのぶんの余裕を見ておく */
  --w0: min(40px, calc((100cqw - 34px) / 15.6));
  --w: var(--w0);
  display: flex;
  align-items: flex-end;
  gap: 2px;
  margin-top: 10px;
  min-height: calc(var(--w) * 4 / 3 + 20px);
}
.hand > button,
.win-slot > button,
.melds button {
  appearance: none;
  border: 0;
  padding: 0;
  background: none;
  border-radius: 4px;
  display: block;
}
.win-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin-left: 10px;
}
.win-caption {
  font-size: 10px;
  line-height: 1;
  letter-spacing: 0.1em;
  color: var(--felt-muted);
  white-space: nowrap;
}
.win-caption.on {
  color: var(--tile-back-hi);
  font-weight: 700;
}
.slot,
.hand > .slot,
.win-slot > .slot {
  flex: none;
  width: var(--w);
  aspect-ratio: 3 / 4;
  border-radius: 14% / 10.5%;
  border: 1.5px dashed rgb(255 255 255 / 0.28);
  padding: 0;
  background: none;
}
.hand-tile {
  flex: none;
}
/* 入力中の位置は赤く・大きく。入れると1つ右へ進む */
.hand > .active,
.win-slot > .active {
  --w: calc(var(--w0) * 1.25);
}
.hand > .slot.active,
.win-slot > .slot.active {
  border: 2.5px solid #ff5a4d;
  background: rgb(255 90 77 / 0.18);
  box-shadow: 0 0 0 3px rgb(255 90 77 / 0.22);
  animation: slot-blink 1.4s ease-in-out infinite;
}
.hand > .hand-tile.active .tile,
.win-slot > .hand-tile.active .tile {
  box-shadow:
    0 0 0 2.5px #ff5a4d,
    0 var(--edge) 0 var(--tile-back),
    0 calc(var(--edge) + 1px) 4px rgb(0 0 0 / 0.35);
}
@keyframes slot-blink {
  50% {
    border-color: rgb(255 90 77 / 0.45);
    box-shadow: 0 0 0 5px rgb(255 90 77 / 0.12);
  }
}
/* 選んでいる牌を消すボタン（案内の右） */
.del-btn {
  flex: none;
  border: 1px solid var(--danger);
  background: transparent;
  color: var(--danger);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.del-btn:active {
  background: var(--danger-soft);
}
.melds {
  --w: min(30px, calc((100cqw - 60px) / 15));
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  align-items: flex-end;
  gap: 8px 12px;
  margin-top: 8px;
  min-height: 0;
}
.melds:empty {
  display: none;
}
.meld {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.meld-tiles {
  display: flex;
  align-items: flex-end;
  gap: 1px;
}
.meld-label {
  font-size: 10px;
  line-height: 1;
  color: var(--felt-muted);
  letter-spacing: 0.08em;
}

/* ---------- 牌 ---------- */
.tile {
  --edge: 3px;
  position: relative;
  display: inline-block;
  flex: none;
  width: var(--w, 30px);
  aspect-ratio: 3 / 4;
  border-radius: 14% / 10.5%;
  background: linear-gradient(172deg, var(--tile-face-hi) 0%, var(--tile-face) 100%);
  box-shadow:
    0 var(--edge) 0 var(--tile-back),
    0 calc(var(--edge) + 1px) 3px rgb(0 0 0 / 0.3),
    inset 0 -1px 0 rgb(0 0 0 / 0.07);
  margin-bottom: var(--edge);
  vertical-align: bottom;
}
.tile svg {
  position: absolute;
  inset: 7%;
  width: 86%;
  height: 86%;
  overflow: visible;
}
.tile.side {
  width: calc(var(--w, 30px) * 4 / 3);
  aspect-ratio: 4 / 3;
  border-radius: 10.5% / 14%;
}
.tile.side svg {
  inset: auto;
  left: 50%;
  top: 50%;
  width: calc(var(--w, 30px) * 0.86);
  height: calc(var(--w, 30px) * 4 / 3 * 0.86);
  transform: translate(-50%, -50%) rotate(-90deg);
}
.tile.back {
  background:
    linear-gradient(172deg, var(--tile-back-hi) 0%, var(--tile-back) 100%);
  box-shadow:
    0 var(--edge) 0 var(--tile-face),
    0 calc(var(--edge) + 1px) 3px rgb(0 0 0 / 0.3);
}
.t-xxs {
  --w: 13px;
  --edge: 1px;
}
.t-xs {
  --w: 21px;
  --edge: 2px;
}
.t-sm {
  --w: 27px;
  --edge: 2.5px;
}
.t-md {
  --w: 34px;
}
.t-hand {
  --edge: max(2px, calc(var(--w) * 0.09));
}
.t-key {
  width: 100%;
  --edge: 3px;
}
/* 入れたばかりの牌。クラス名はポップアップ（.pop）と必ず分けること */
.tile.just-in,
.meld.just-in {
  animation: pop 0.16s ease-out;
}
@keyframes pop {
  from {
    transform: translateY(-6px) scale(0.92);
    opacity: 0.4;
  }
}

/* ---------- 牌キーボード ---------- */
/* スマホ: 画面の下に重ねるシート。上の段に手牌・鳴きのタブと大きな「閉じる」 */
.keyboard {
  grid-area: keyboard;
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 12;
  max-width: 640px;
  margin-inline: auto;
  padding: 8px max(12px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -10px 28px rgb(0 0 0 / 0.16), 0 -1px 0 var(--line);
}
.keyboard[hidden],
.kb-open[hidden] {
  display: none;
}
.kb-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.kb-head .kb-tabs {
  flex: 1 1 auto;
  min-width: 0;
}
/* 閉じるボタン: タブと見分けがつくよう濃い色の丸いボタンに、矢印と「閉じる」の文字 */
.kb-close {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  height: 38px;
  border: 0;
  border-radius: 999px;
  padding: 0 14px 0 9px;
  background: var(--ink);
  color: var(--surface);
  font-size: 13.5px;
  font-weight: 800;
  white-space: nowrap;
}
.kb-close svg {
  width: 18px;
  height: 18px;
}
.kb-close:active {
  filter: brightness(1.2);
}
/* 閉じているときに下に出す「牌を入力」 */
.kb-open {
  position: fixed;
  z-index: 12;
  left: 50%;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 48px;
  border: 0;
  border-radius: 999px;
  padding: 0 22px 0 18px;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.04em;
  white-space: nowrap;
  box-shadow: 0 10px 24px rgb(0 0 0 / 0.28);
}
.kb-open svg {
  width: 22px;
  height: 22px;
}
.kb-open:active {
  transform: translateX(-50%) scale(0.97);
}
.kb-tabs {
  display: flex;
  gap: 3px;
  align-items: center;
  padding: 3px;
  border-radius: 12px;
  background: var(--surface-2);
}
.kb-tab {
  flex: 1 1 0;
  min-width: 0;
  border: 0;
  background: transparent;
  border-radius: 9px;
  padding: 7px 0;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
}
.kb-tab[aria-selected='true'] {
  background: var(--ink);
  color: var(--surface);
  font-weight: 700;
}
.kb-fold {
  flex: none;
  width: 34px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  padding: 7px 0;
}
.kb-hint {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 34px;
  padding-block: 4px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.35;
}
.red-toggle {
  flex: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 700;
}
.red-toggle[aria-pressed='true'] {
  background: #c4302b;
  border-color: #c4302b;
  color: #fff;
}
.kb-grid {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 6px 4px;
}
.kb-grid[hidden] {
  display: none;
}
.key {
  appearance: none;
  border: 0;
  padding: 0;
  background: none;
  border-radius: 6px;
  display: block;
}
.key .tile {
  transition: transform 0.06s ease;
}
.key:active:not(:disabled) .tile {
  transform: translateY(2px);
}
.key:disabled {
  opacity: 0.26;
  cursor: not-allowed;
}
.key.act {
  display: grid;
  place-items: center;
  align-content: center;
  gap: 2px;
  background: var(--key-bg);
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 3px;
}
.key.act svg {
  width: 18px;
  height: 18px;
}
.key.act.wide {
  grid-column: span 2;
}
.key.act:active {
  filter: brightness(0.94);
}

/* ---------- 結果 ---------- */
.results {
  grid-area: results;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-block: 12px 28px;
  scrollbar-width: thin;
}
@media (min-width: 880px) {
  .results {
    padding-block: 0 28px;
  }
}
.card {
  background: var(--surface);
  border-radius: 14px;
  padding: 14px 14px 16px;
  box-shadow: var(--shadow);
}
.verdict {
  display: grid;
  gap: 4px;
}
.eyebrow {
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--muted);
}
.big {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 34px;
  line-height: 1.15;
  letter-spacing: 0.02em;
  text-wrap: balance;
}
.big .unit {
  font-size: 0.55em;
  margin-left: 2px;
}
.big .num {
  font-size: 1.35em;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}
.verdict.ok .big {
  color: var(--accent);
}
.verdict.warn .big {
  color: var(--warn);
}
.verdict.err .big,
.verdict.win .big {
  color: var(--danger);
}
.limit {
  display: inline-block;
  margin-left: 10px;
  padding: 3px 10px 4px;
  border-radius: 999px;
  background: var(--felt);
  color: var(--felt-ink);
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.06em;
  vertical-align: 0.35em;
}
.sub {
  font-size: 14px;
  color: var(--muted);
}
.sub b {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.forms {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.form-pill {
  font-size: 12px;
  border-radius: 999px;
  padding: 2px 9px;
  background: var(--surface-2);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.form-pill.best {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
}
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-top: 16px;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 700;
}
.section-title span {
  font-weight: 500;
  color: var(--muted);
  font-size: 12px;
}
.notice {
  margin-top: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 13px;
  background: var(--warn-soft);
  color: var(--ink);
}
.notice.err {
  background: var(--danger-soft);
}
.notice ul {
  margin: 0;
  padding-left: 1.2em;
}

.wait-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.wait-row > details > summary {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.15fr);
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--surface-2);
  list-style: none;
  cursor: pointer;
}
.wait-row > details > summary::-webkit-details-marker {
  display: none;
}
.wait-row > details[open] > summary {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}
.left {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.2;
}
.left b {
  display: block;
  font-size: 17px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.left.zero b {
  color: var(--danger);
}
.score-cell {
  display: grid;
  line-height: 1.25;
  min-width: 0;
}
.score-cell .k {
  font-size: 11px;
  color: var(--muted);
}
.score-cell .v {
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.score-cell .v small {
  font-size: 11px;
}
.score-cell .s {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.score-cell .none {
  color: var(--warn);
}
.wait-detail {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px 16px;
  padding: 10px 12px 12px;
  border: 1px solid var(--surface-2);
  border-top: 0;
  border-radius: 0 0 10px 10px;
  font-size: 13px;
}
.wait-detail h3 {
  margin: 0 0 4px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
}

.yaku-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.yaku-table td {
  padding: 5px 0;
  border-bottom: 1px solid var(--surface-2);
}
.yaku-table td:last-child {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  padding-left: 12px;
}
.yaku-table tr.dora td {
  color: var(--muted);
}
.yaku-table tr.total td {
  border-bottom: 0;
  font-weight: 700;
  padding-top: 8px;
}
.wait-detail .yaku-table {
  font-size: 13px;
}
.pay-list {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 0;
  margin: 12px 0 0;
  font-size: 14px;
}
.pay-list dt {
  color: var(--muted);
}
.pay-list dd {
  margin: 0;
  padding-left: 12px;
  text-align: right;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.pay-list .sum {
  border-top: 1px solid var(--line);
  padding-top: 6px;
}
details.more > summary {
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  margin-top: 12px;
  list-style: none;
}
details.more > summary::-webkit-details-marker {
  display: none;
}
details.more > summary::before {
  content: '＋ ';
}
details.more[open] > summary::before {
  content: '－ ';
}
.fu-list {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
  font-size: 13px;
  display: grid;
  gap: 2px;
}
.fu-list li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px dotted var(--line);
  padding-block: 3px;
}
.fu-list b {
  font-variant-numeric: tabular-nums;
}
.shape {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 12px;
  margin-top: 8px;
}
.shape-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
  align-items: flex-start;
}
.shape-group .row-tiles {
  display: flex;
  gap: 1px;
}
.shape-group small {
  font-size: 10px;
  color: var(--muted);
}
.shape-group.win small {
  color: var(--accent);
  font-weight: 700;
}

.uke-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 8px;
}
.uke {
  display: grid;
  justify-items: center;
  gap: 1px;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.uke.zero {
  opacity: 0.45;
}
.discard-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.discard {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 10px;
  border-radius: 10px;
  background: var(--surface-2);
}
.discard .cut {
  display: grid;
  justify-items: center;
  gap: 2px;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
}
.discard .info {
  display: grid;
  gap: 6px;
  min-width: 0;
}
.discard .info p {
  margin: 0;
  font-size: 13px;
}
.discard .info b {
  font-variant-numeric: tabular-nums;
}
.tiles-inline {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 4px;
}
.start-btn {
  justify-self: start;
  margin-top: 10px;
  border: 0;
  background: var(--felt);
  color: var(--felt-ink);
  border-radius: 10px;
  padding: 9px 14px;
  font-weight: 700;
}

/* ---------- 状況・ドラ・ルール ---------- */
.panel-rows {
  display: grid;
  gap: 10px;
  margin-top: 10px;
}
.row {
  display: grid;
  grid-template-columns: 4.2em minmax(0, 1fr);
  align-items: center;
  gap: 10px;
}
.row > .label {
  font-size: 13px;
  font-weight: 700;
}
.row .note {
  grid-column: 2;
  font-size: 11px;
  color: var(--muted);
  margin-top: -6px;
}
.seg {
  display: flex;
  gap: 2px;
  padding: 3px;
  border-radius: 10px;
  background: var(--surface-2);
}
.seg button {
  flex: 1 1 0;
  min-width: 0;
  border: 0;
  background: transparent;
  border-radius: 8px;
  padding: 6px 2px;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
}
.seg button small {
  font-size: 10px;
  margin-left: 2px;
}
.seg button[aria-pressed='true'] {
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.14);
}
.seg button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
/* 文字数に合わせて幅を変える（「なし」は細く、長いほうは広く） */
.seg.auto button {
  flex: 0 1 auto;
  padding-inline: 10px;
  white-space: normal;
  font-size: 12px;
}
.seg.auto button:last-child {
  flex: 0 0 auto;
  padding-inline: 14px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 13px;
  font-weight: 500;
}
.chip[aria-pressed='true'] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--surface);
  font-weight: 700;
}
.chip:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.steppers {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
}
.stepper {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
}
.stepper svg {
  width: 30px;
  height: 10px;
  flex: none;
}
.stepper .ctl {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.stepper .ctl button {
  width: 34px;
  height: 32px;
  border: 0;
  background: none;
  font-size: 17px;
  line-height: 1;
}
.stepper output {
  min-width: 1.6em;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-size: 15px;
}
.ind-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  min-height: 42px;
}
.ind-row > button:not(.add) {
  appearance: none;
  border: 0;
  padding: 0;
  background: none;
}
.add {
  border: 1px dashed var(--line);
  background: transparent;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
}
.add[aria-pressed='true'] {
  border-style: solid;
  border-color: var(--accent);
  color: var(--accent);
}
.derived {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}
.dim {
  opacity: 0.5;
}
.rules > summary {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  cursor: pointer;
  list-style: none;
}
.rules > summary::-webkit-details-marker {
  display: none;
}
.rules > summary .rs {
  font-size: 12px;
  color: var(--muted);
  text-align: right;
}
.rules > summary .rs::after {
  content: ' ▾';
}
.rules[open] > summary .rs::after {
  content: ' ▴';
}
.rule {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 9px;
  border-bottom: 1px solid var(--surface-2);
  font-size: 14px;
}
.rule:last-child {
  border-bottom: 0;
}
.rule small {
  display: block;
  font-size: 11px;
  color: var(--muted);
}
.rule .seg {
  flex: none;
  width: 9.5em;
}
.switch {
  appearance: none;
  -webkit-appearance: none;
  flex: none;
  position: relative;
  width: 44px;
  height: 26px;
  margin: 0;
  border-radius: 999px;
  background: var(--line);
  cursor: pointer;
  transition: background 0.15s ease;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.3);
  transition: transform 0.15s ease;
}
.switch:checked {
  background: var(--felt);
}
.switch:checked::after {
  transform: translateX(18px);
}
.footnote {
  margin: 4px 2px 0;
  font-size: 11px;
  line-height: 1.7;
  color: var(--muted);
}

.toast {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  transform: translateX(-50%);
  z-index: 10;
  /* left:50% だと使える幅が画面の半分になり、短い文でも折り返してしまう。中身の幅にそろえて上限だけ決める */
  width: max-content;
  max-width: min(92vw, 420px);
  padding: 9px 14px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--surface);
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.25);
  animation: toast-in 0.18s ease-out;
}
/* ボタン付き（「元に戻す」など）。ボタンは押しやすい大きさに */
.toast.has-act {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 6px 6px 14px;
}
.toast-act {
  flex: none;
  border: 0;
  border-radius: 999px;
  padding: 7px 13px;
  background: #8fe3bd;
  color: #10352a;
  font-size: 12.5px;
  font-weight: 800;
  white-space: nowrap;
}
@keyframes toast-in {
  from {
    transform: translate(-50%, -8px);
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}


/* ---------- 画面切り替え ---------- */
.mode-switch {
  flex: none;
  display: inline-flex;
  padding: 3px;
  border-radius: 999px;
  background: var(--surface-2);
}
.mode-switch button {
  display: inline-flex;
  min-height: 38px;
  align-items: center;
  gap: 5px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  padding: 6px 13px;
  border-radius: 999px;
  white-space: nowrap;
}
.mode-switch button svg {
  width: 17px;
  height: 17px;
  flex: none;
}
.mode-switch button[aria-selected='true'] {
  background: var(--felt);
  color: var(--felt-ink);
}
.mode-switch.light {
  background: var(--surface-2);
  box-shadow: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
.mode-switch.light button {
  color: var(--muted);
}
.mode-switch.light button[aria-selected='true'] {
  background: var(--ink);
  color: var(--surface);
}

/* ---------- カメラ画面 ---------- */
/* スマホは縦向きのまま使う前提。横にしても同じ積み方（上＝写真／下＝結果）にする。
   写真の枠は中身（操作ボタン・待ち牌・手牌・読み取り枠）の高さで決め、画面に入りきらなければ全体がスクロールする
   （高さを割合で決めると、Safari のツールバーぶん低い画面で手牌のチップが読み取り枠の裏に隠れてしまう） */
.cam {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: max-content max-content;
  align-content: start;
  gap: 6px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-block: 2px 8px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
/* 写真を枠に合わせている間（とカメラ・写真なし）は写真を見る場所を確保し、読み取った後は中身の高さだけにする */
.cam-stage {
  min-height: 0;
}
.cam-stage[data-framing],
.cam-stage[data-empty] {
  min-height: min(46vh, 380px);
}
.cam-side {
  min-height: 200px;
}
.side-body {
  overflow: visible;
}
/* 十分に大きい画面（タブレット・PC）のときだけ横に2枚並べる */
@media (min-width: 720px) and (min-height: 600px) {
  .cam {
    grid-template-columns: minmax(0, 1fr) clamp(236px, 31%, 340px);
    grid-template-rows: minmax(0, 1fr);
    align-content: stretch;
    overflow: visible;
    gap: 10px;
  }
  .cam-stage {
    min-height: 0;
  }
  .cam-side {
    min-height: 0;
  }
  .side-body {
    overflow-y: auto;
  }
}
/* 横向きのときだけ「縦にすると使いやすい」と出す */
.rotate-hint {
  display: none;
  margin: 0 max(12px, env(safe-area-inset-left, 0px)) 4px;
  font-size: 11px;
  color: var(--muted);
}
@media (orientation: landscape) and (max-height: 560px) {
  .rotate-hint {
    display: block;
  }
}
.cam-stage {
  /* 写真を指で動かすときに文字が選択されないように */
  -webkit-user-select: none;
  user-select: none;
  --roi-h: clamp(56px, 11svh, 120px);
  --roi-inset: 10px;
  position: relative;
  min-height: 0;
  overflow: hidden;
  border-radius: 16px;
  background: #0a0f0d;
  color: #f3f6f4;
  /* 高さは外から決める（size にすると中身の高さが枠に伝わらず、横向きで手牌がはみ出す） */
  container-type: inline-size;
  isolation: isolate;
  /* 設定チップ → 案内 → 手牌 の順に積む。下は読み取り枠のぶんを空ける（重ならないように） */
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px 6px calc(var(--roi-inset) + var(--roi-h) + 2px);
}
.cam-stage[data-source='photo'] {
  touch-action: none;
  cursor: grab;
}
.cam-media {
  position: absolute;
  inset: 0;
  z-index: 0;
}
#cam-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#cam-photo {
  position: absolute;
  max-width: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-user-drag: none;
}
.demo-scene {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(rgb(255 255 255 / 0.04) 0.8px, transparent 0.9px) 0 0 / 3px 3px,
    radial-gradient(120% 90% at 50% 100%, #2f7a62 0%, #1b5343 45%, #0f3027 100%);
}
.demo-row {
  position: absolute;
  left: var(--roi-inset);
  right: var(--roi-inset);
  bottom: var(--roi-inset);
  height: var(--roi-h);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1px;
  transform: perspective(620px) rotateX(26deg);
  transform-origin: 50% 90%;
}
.demo-row .tile {
  --w: min(calc(var(--roi-h) * 0.52), calc((100cqw - 2 * var(--roi-inset) - 40px) / 15.4));
  --edge: calc(var(--w) * 0.16);
}
.demo-gap {
  flex: none;
  width: 14px;
}
.cam-empty {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  z-index: 2;
  display: grid;
  /* safe を付けると、入りきらないときに上が切れず、上から表示される */
  align-content: safe center;
  justify-content: center;
  justify-items: center;
  gap: 10px;
  padding: 4px 12px;
  text-align: center;
  font-size: 14px;
}
.cam-empty p {
  margin: 0;
  max-width: 34em;
}
.cam-empty .muted,
.pop .muted {
  color: rgb(255 255 255 / 0.65);
}
.cam-empty .small {
  font-size: 11px;
}
.cam-stage[data-empty] .roi {
  display: none;
}
.cam-stage[data-empty] {
  padding-bottom: 8px;
}
.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 0;
  border-radius: 10px;
  padding: 9px 14px;
  background: #f3efe3;
  color: #15201b;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.btn svg {
  width: 18px;
  height: 18px;
}
.btn.ghost {
  background: rgb(255 255 255 / 0.12);
  color: #fff;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.3);
}
.btn.small {
  padding: 5px 10px;
  font-size: 12px;
}
.cam-side .btn.ghost {
  background: var(--surface-2);
  color: var(--ink);
  box-shadow: none;
  justify-self: start;
}

.cam-stage[data-read] .roi {
  box-shadow: 0 0 0 200vmax rgb(2 5 4 / 0.88);
}
.roi {
  position: absolute;
  z-index: 1;
  left: var(--roi-inset);
  right: var(--roi-inset);
  bottom: var(--roi-inset);
  height: var(--roi-h);
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 0 0 200vmax rgb(4 9 7 / 0.5);
  outline: 1px solid rgb(255 255 255 / 0.3);
  pointer-events: none;
}
.corner {
  position: absolute;
  width: 20px;
  height: 20px;
  border: 3px solid #fff;
}
.corner.tl {
  left: 0;
  top: 0;
  border-right: 0;
  border-bottom: 0;
  border-top-left-radius: 12px;
}
.corner.tr {
  right: 0;
  top: 0;
  border-left: 0;
  border-bottom: 0;
  border-top-right-radius: 12px;
}
.corner.bl {
  left: 0;
  bottom: 0;
  border-right: 0;
  border-top: 0;
  border-bottom-left-radius: 12px;
}
.corner.br {
  right: 0;
  bottom: 0;
  border-left: 0;
  border-top: 0;
  border-bottom-right-radius: 12px;
}
.roi-label {
  position: absolute;
  left: 12px;
  top: 5px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: rgb(255 255 255 / 0.9);
  text-shadow: 0 1px 2px rgb(0 0 0 / 0.7);
}
/* 写真のときの案内は、写真の上でも読めるように大きめ＋背景つき（クラス名は使い方画面の .guide と分ける） */
.roi-label.photo-hint {
  left: 8px;
  top: 6px;
  max-width: calc(100% - 62px);
  padding: 4px 9px;
  border-radius: 999px;
  background: rgb(0 0 0 / 0.62);
  font-size: 12.5px;
  letter-spacing: 0.01em;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #fff;
  text-shadow: none;
}
.roi-label.photo-hint small {
  font-size: 10.5px;
  font-weight: 700;
  color: rgb(255 255 255 / 0.8);
}
/* 写真を90度回すボタン（読み取り枠の右上） */
/* 90°回転。手牌を枠に合わせるとき、いちばん右の牌と重なるのでうすくする */
.rot-btn {
  position: absolute;
  z-index: 2;
  right: calc(var(--roi-inset) + 5px);
  bottom: calc(var(--roi-inset) + var(--roi-h) - 4px - 28px);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  border: 0;
  border-radius: 999px;
  padding: 0 10px 0 8px;
  background: rgb(0 0 0 / 0.38);
  color: rgb(255 255 255 / 0.9);
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.28);
}
.rot-btn svg {
  width: 15px;
  height: 15px;
}
.rot-btn:active {
  background: rgb(0 0 0 / 0.7);
  color: #fff;
}
/* 読み取り中に枠の中を流れる光。left ではなく transform で動かす（計算で画面が止まっている間も流れ続ける） */
.roi.scan::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 30%;
  background: linear-gradient(90deg, transparent, rgb(143 227 189 / 0.45), transparent);
  transform: translateX(-100%);
  animation: scan 1.1s linear infinite;
  will-change: transform;
}
@keyframes scan {
  to {
    transform: translateX(333%);
  }
}
/* 読み取り中の目印（枠の真ん中） */
.read-busy {
  position: absolute;
  z-index: 2;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 10px;
  border-radius: 999px;
  background: rgb(0 0 0 / 0.72);
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.04em;
  white-space: nowrap;
  box-shadow: 0 2px 10px rgb(0 0 0 / 0.4);
}
.read-busy[hidden] {
  display: none;
}
.rb-spin {
  flex: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2.5px solid rgb(255 255 255 / 0.28);
  border-top-color: #8fe3bd;
  animation: spin 0.8s linear infinite;
  will-change: transform;
}
/* 読み取り枠の案内の補足（スマホを横にすると近くから撮れる） */
.roi-label small {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: rgb(255 255 255 / 0.78);
}
.land-hint {
  display: none;
}

/* ---------- カメラ: スマホを横にして撮るとき（カメラだけの画面） ----------
   横にすると手牌の列が画面の長い辺に沿うので、縦のときの半分ほどの距離から撮れる。
   ブラウザでは画面の向きを勝手に変えられないので、スマホを横にしたらこの画面にする（camera.js の setLandCapture）。
   読み取り枠は画面の真ん中に横長に、右端に大きな「認識する」。結果の詳しい表示は縦に戻して見る */
html[data-cam-land],
html[data-cam-land] body {
  overflow: hidden;
}
html[data-cam-land] .cam-stage {
  position: fixed;
  inset: 0;
  z-index: 14; /* ポップアップ（15）より下、ページより上 */
  min-height: 0;
  border-radius: 0;
  padding: 0;
  display: block;
  --roi-h: clamp(64px, 27svh, 124px);
  --land-l: max(14px, env(safe-area-inset-left, 0px));
  --land-r: max(12px, env(safe-area-inset-right, 0px));
  --land-act: 108px; /* 右端のボタンの列 */
}
html[data-cam-land] .toast {
  z-index: 16;
}
html[data-cam-land] .roi {
  left: var(--land-l);
  right: calc(var(--land-r) + var(--land-act));
  top: calc(50% - var(--roi-h) / 2);
  bottom: auto;
}
html[data-cam-land] .cam-empty {
  position: absolute;
  inset: 0;
}
html[data-cam-land] .cam-overlay {
  position: absolute;
  inset: 0;
  margin: 0;
  overflow: visible;
  display: block;
}
/* 左上: 状態の言葉（テンパイなど）とリセット */
html[data-cam-land] .cam-head-col {
  position: absolute;
  left: var(--land-l);
  right: calc(var(--land-r) + var(--land-act));
  top: max(8px, env(safe-area-inset-top, 0px));
  flex-direction: row;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 10px;
}
html[data-cam-land] .band-head-slot {
  flex: 0 1 auto;
}
/* 右端: 撮り直す → 認識する（大きく） → 配牌整理 */
html[data-cam-land] .cam-actions {
  position: absolute;
  right: var(--land-r);
  top: 50%;
  transform: translateY(-50%);
  width: calc(var(--land-act) - 10px);
  margin: 0;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
}
html[data-cam-land] .cam-side-btns {
  display: contents;
}
html[data-cam-land] #retake {
  order: 1;
}
html[data-cam-land] .shutter {
  order: 2;
  width: 100%;
  height: 92px;
  border-radius: 20px;
  font-size: 13px;
}
html[data-cam-land] .shutter svg {
  width: 32px;
  height: 32px;
}
html[data-cam-land] #cam-sort {
  order: 3;
}
/* 読み取った牌は枠のすぐ下に。待ち・点数の帯は縦に戻して見る */
html[data-cam-land] .band {
  display: none;
}
html[data-cam-land] .twin {
  position: absolute;
  left: var(--land-l);
  right: calc(var(--land-r) + var(--land-act));
  top: calc(50% + var(--roi-h) / 2 + 6px);
  pointer-events: auto;
}
html[data-cam-land] .land-hint:not([hidden]) {
  display: block;
  position: absolute;
  left: var(--land-l);
  right: calc(var(--land-r) + var(--land-act));
  bottom: max(8px, env(safe-area-inset-bottom, 0px));
  margin: 0;
  text-align: center;
}
.land-close {
  display: none;
}
html[data-cam-land] .land-close {
  position: absolute;
  z-index: 4;
  top: max(8px, env(safe-area-inset-top, 0px));
  right: var(--land-r);
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  padding: 0;
  background: rgb(0 0 0 / 0.55);
  color: #fff;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.25);
}
html[data-cam-land] .land-close svg {
  width: 18px;
  height: 18px;
}
html[data-cam-land] .land-hint:not([hidden])::before {
  content: '↻ ';
}
.land-hint {
  justify-self: center;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgb(0 0 0 / 0.66);
  color: #fff;
  font-size: 12.5px;
  font-weight: 800;
}

/* 撮った合図（一瞬白く光る） */
.cam-flash {
  position: absolute;
  inset: 0;
  z-index: 3;
  background: #fff;
  opacity: 0;
  pointer-events: none;
}
.cam-flash.on {
  animation: cam-flash 0.35s ease-out;
}
@keyframes cam-flash {
  from {
    opacity: 0.65;
  }
  to {
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .cam-flash.on {
    animation: none;
  }
}

.set-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-width: 0;
}
.gchip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 0;
  border-radius: 999px;
  padding: 4px 11px;
  background: rgb(0 0 0 / 0.5);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.14);
}
.gchip em {
  font-style: normal;
  font-size: 10px;
  line-height: 15px;
  padding: 0 4px;
  border-radius: 4px;
  background: #e5ad52;
  color: #1b1406;
}
.gchip[aria-pressed='true'] {
  background: #f3efe3;
  color: #15201b;
}
.gchip.toggle[aria-pressed='true'] {
  background: #e9b949;
  color: #1b1406;
}
.gchip:disabled {
  opacity: 0.45;
}
.gchip .tile {
  margin-bottom: 1px;
}

/* 状態の見出し（テンパイ・アガリなど）と操作ボタンを同じ行に置いて、上の空きをなくす */
.cam-top {
  flex: none;
  z-index: 3;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  min-width: 0;
}
.band-head-slot {
  flex: 1 1 auto;
  min-width: 0;
}
.band-head-slot:empty {
  display: none;
}
/* 見出しの列: 状態の言葉（テンパイなど）の下に「リセット」。右の「配牌整理」と同じ段にそろう */
.cam-head-col {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 5px;
}
.cam-head-col > .band-head-slot {
  flex: none;
  align-self: stretch;
}
/* 「リセット」: 牌のチップと認識の結果を消す。「別の写真」と同じ操作ボタンの見た目に左回りの矢印 */
.cam-reset {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 0;
  border-radius: 999px;
  padding: 6px 11px 6px 8px;
  background: rgb(0 0 0 / 0.55);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.2;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.2);
}
.cam-reset svg {
  width: 14px;
  height: 14px;
}
.cam-reset:active {
  background: rgb(0 0 0 / 0.78);
}
.cam-actions {
  position: relative;
  z-index: 3;
  flex: none;
  margin-left: auto; /* 見出しがないときも右に寄せる */
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  min-height: 0;
}
/* 「別の写真」「配牌整理」は縦に並べて、認識ボタンの左に置く（枠幅はそろえる） */
.cam-side-btns {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 5px;
  min-width: 88px;
}
.cam-side-btns > button {
  width: 100%;
}
/* 認識ボタン。丸だと iPhone の画面内アクセシビリティボタンと紛らわしいので四角にする */
.shutter {
  flex: none;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 1px;
  width: 68px;
  height: 68px;
  border: 0;
  border-radius: 16px;
  padding: 0;
  background: #f5f7f6;
  color: #10352a;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.02em;
  box-shadow: 0 6px 18px rgb(0 0 0 / 0.45), inset 0 0 0 2px rgb(255 255 255 / 0.75);
  transition: transform 0.08s ease, background 0.18s ease, color 0.18s ease;
}
.sh-ic {
  display: block;
  line-height: 0;
}
.shutter svg {
  width: 26px;
  height: 26px;
  stroke-width: 2.1;
}
.shutter:active {
  transform: scale(0.95);
}
/* 読み取り済み＝緑（色で完了が分かる。押せばもう一度認識できる） */
.shutter[data-state='done'] {
  background: #2fae7d;
  color: #04241a;
  box-shadow: 0 6px 18px rgb(0 0 0 / 0.45), inset 0 0 0 2px rgb(255 255 255 / 0.45);
}
.shutter[data-state='busy'] {
  background: #e9b949;
  color: #1b1406;
}
.shutter[data-state='busy'] .sh-ic {
  animation: spin 0.9s linear infinite;
}
/* 端末内で読み取っている間は押せない（見た目は黄色のまま。薄くしない） */
.shutter:disabled {
  opacity: 1;
  cursor: progress;
}
@keyframes spin {
  to {
    transform: rotate(1turn);
  }
}
.retake {
  flex: none;
  border: 0;
  border-radius: 999px;
  padding: 6px 10px;
  background: rgb(0 0 0 / 0.55);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.2);
}

.cam-overlay {
  flex: 0 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
  margin-top: auto;
  z-index: 2;
  padding-inline: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  pointer-events: none;
}
.cam-overlay > * {
  pointer-events: auto;
  flex: none;
}
.cam-stage[data-framing] .cam-overlay {
  margin-top: 0;
}
.band {
  display: grid;
  gap: 4px;
  min-width: 0;
}
.band-head {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  text-shadow: 0 1px 3px rgb(0 0 0 / 0.75);
}
/* 状態の言葉（テンパイ・1シャンテン・アガリ）だけ大きく。補足は元の大きさのまま下の行 */
.band-head b {
  font-family: var(--font-display);
  font-size: clamp(21px, 6.8cqw, 26px);
  font-weight: 800;
  letter-spacing: 0.04em;
  color: #fff;
  line-height: 1.15;
}
.band-head b em {
  display: inline-block;
  font-style: normal;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  margin-left: 2px;
  vertical-align: 2px;
}
.band-head.ok b {
  color: #8fe3bd;
}
.band-head.warn b {
  color: #f3c46f;
}
/* アガリは赤（テンパイの緑と見分ける） */
.band-head.win b {
  color: #ff8a7a;
}
.band-head.err b {
  color: #ff9a8f;
}
.band-head span,
.band-sub {
  font-size: 11.5px;
  color: rgb(255 255 255 / 0.88);
  text-shadow: 0 1px 3px rgb(0 0 0 / 0.75);
}
.band-sub {
  line-height: 1.35;
}
.chip-row {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 3px 2px 4px;
}
.chip-row::-webkit-scrollbar,
.twin::-webkit-scrollbar {
  display: none;
}
.wchip {
  flex: none;
  display: grid;
  justify-items: center;
  gap: 1px;
  min-width: 44px;
  border: 0;
  border-radius: 10px;
  padding: 4px 5px 3px;
  background: rgb(8 14 12 / 0.66);
  color: #fff;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12);
  transition: transform 0.12s ease;
}
.wchip .tile {
  --w: clamp(22px, 5.6cqw, 34px);
  --edge: 2px;
}
.wchip[aria-pressed='true'] {
  background: #f3efe3;
  color: #15201b;
  box-shadow: 0 0 0 2px #8fe3bd, 0 6px 16px rgb(0 0 0 / 0.35);
  transform: translateY(-2px);
}
.wchip.static {
  background: rgb(8 14 12 / 0.5);
}
.wc-rem {
  font-size: 10px;
  line-height: 1.2;
  opacity: 0.85;
  font-variant-numeric: tabular-nums;
}
.wc-pt {
  font-size: 11px;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.wc-pt.none {
  color: #f3c46f;
}
.wchip[aria-pressed='true'] .wc-pt.none {
  color: #a8660f;
}

.twin {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 4px 1px 0;
}
.twin-hand,
.twin-melds {
  display: flex;
  align-items: flex-end;
  gap: 1px;
  flex: none;
}
.twin-melds {
  gap: 6px;
}
.tw,
.tw-meld {
  position: relative;
  flex: none;
  display: grid;
  justify-items: center;
  border: 0;
  padding: 0;
  background: none;
  border-radius: 4px;
  transition: transform 0.12s ease, opacity 0.12s ease;
}
.tw-meld {
  display: flex;
  align-items: flex-end;
  gap: 1px;
}
/* 牌の大きさは横幅いっぱいまで広げる（--tw-w は並ぶ枚数から JS が決める） */
.tw .tile,
.tw-meld .tile {
  --w: clamp(16px, var(--tw-w, 5.4cqw), 36px);
  --edge: 2px;
}
.tw.hl {
  transform: translateY(-6px);
}
.tw.hl .tile {
  box-shadow: 0 0 0 2px #8fe3bd, 0 var(--edge) 0 var(--tile-back), 0 8px 14px rgb(0 0 0 / 0.45);
}
.tw.fade {
  opacity: 0.5;
}
.tw.cut .tile {
  box-shadow: 0 0 0 2px #ff8a7e, 0 var(--edge) 0 var(--tile-back);
}
.tw.cut::before {
  content: '切';
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  padding: 0 4px;
  border-radius: 4px;
  background: #c4302b;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  line-height: 15px;
  white-space: nowrap;
}
.tw small {
  font-size: 8.5px;
  letter-spacing: -0.02em;
  line-height: 1.3;
  color: rgb(255 255 255 / 0.85);
}
.tw.ghost .tile {
  outline: 2px dashed #8fe3bd;
  outline-offset: 1px;
  opacity: 0.92;
}
.tw.ghost small {
  color: #8fe3bd;
  font-weight: 700;
}
.tile.qm {
  display: grid;
  place-items: center;
  color: #a8660f;
  background: #fbe9c8;
  outline: 2px dashed #e5ad52;
  outline-offset: -3px;
  font-weight: 800;
  font-size: calc(var(--w) * 0.62);
  line-height: 1;
}
.tw-add {
  flex: none;
  align-self: stretch;
  display: grid;
  place-content: center;
  min-width: 42px;
  padding: 2px 6px;
  border: 1.5px dashed rgb(255 255 255 / 0.55);
  border-radius: 8px;
  background: rgb(0 0 0 / 0.35);
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.1;
}
.tw-add small {
  font-size: 9px;
  font-weight: 500;
}
.tw-add[aria-pressed='true'] {
  border-style: solid;
  border-color: #8fe3bd;
}

.pop {

  z-index: 15;

  padding: 10px 12px 12px;
  border-radius: 14px;
  background: rgb(13 20 17 / 0.95);

  -webkit-backdrop-filter: blur(12px);

.pop-head {

  flex-wrap: wrap;

/* 下までスクロールしても、選んだ内容と決定ボタンは見えたままにする */

.pop-buttons .btn {

.pop-head b {

.pop-x {

.plabel small {

.psep {

.pop .stepper .ctl {

.pop .stepper .ctl button {

.ind-line {

.ind {

/* ドラ表示牌シートの見出し行: 「ドラ表示牌 → ドラ ○○」 */

.pop-head .dora-arrow svg {

.demo-list {

  overscroll-behavior: contain;
  display: grid;
  align-content: start;
  gap: 12px;

}
.s-sum {
  display: grid;
  gap: 2px;
}
.s-big {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 800;
  line-height: 1.2;
}
.s-big.ok {
  color: var(--accent);
}
.s-big.win {
  color: var(--danger);
}
.s-head .s-sub {
  align-self: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}
.howto {
  margin: 4px 0 0;
  padding-left: 1.2em;
  display: grid;
  gap: 4px;
  font-size: 13px;
}
.sel-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 12px;
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px rgb(28 90 71 / 0.18);
}
.sel-head b {
  display: block;
  font-size: 15px;
  line-height: 1.3;
}
.sel-head span {
  display: block;
  font-size: 12px;
  color: var(--muted);
}
.seg.rt button {
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.pt-big {
  font-family: var(--font-display);
  font-weight: 800;
  color: var(--accent);
  line-height: 1.1;
}
.pt-big .num {
  font-size: 34px;
  font-variant-numeric: tabular-nums;
}
.pt-big .unit {
  margin-left: 2px;
  font-size: 15px;
}
.pt-big .limit {
  font-size: 12px;
  vertical-align: 0.45em;
}
.side-body .sub,
.side-body .section-title {
  margin: 0;
}
.opt-list,
.mini-waits {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.opt {
  display: grid;
  gap: 5px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--surface-2);
}
.opt-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 13px;
}
.cut-lbl {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 700;
  white-space: nowrap;
}
.opt small {
  font-size: 11px;
  color: var(--muted);
}
.mini-waits {
  gap: 4px;
}
.mini-waits li {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.s-note {
  display: grid;
  gap: 4px;
  padding-top: 10px;
  border-top: 1px solid var(--surface-2);
  font-size: 12px;
}
.s-note p {
  margin: 0;
}
.s-note-head {
  display: flex;
  align-items: center;
  gap: 6px;
}
.tag {
  font-style: normal;
  font-size: 10px;
  font-weight: 700;
  line-height: 16px;
  padding: 0 5px;
  border-radius: 4px;
  background: var(--warn-soft);
  color: var(--warn);
}
.tag.on {
  background: var(--accent-soft);
  color: var(--accent);
}
.linkish {
  margin-left: auto;
  border: 0;
  padding: 2px 0;
  background: none;
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
}
.muted {
  color: var(--muted);
  font-size: 12px;
}
.warn-list {
  margin: 0;
  padding-left: 1.2em;
  color: var(--warn);
}
.inline-tiles {
  display: inline-flex;
  gap: 1px;
  vertical-align: middle;
}

/* 1シャンテンの「引けばテンパイ」一覧（手入力画面） */
.draw-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.draw-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: start;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--surface-2);
}
.draw-tile {
  display: grid;
  justify-items: center;
  gap: 1px;
}
.draw-tile small,
.more-note {
  font-size: 10px;
  color: var(--muted);
}
.draw-opts {
  display: grid;
  gap: 4px;
  min-width: 0;
}
.draw-opt {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}
.draw-opt .arrow {
  color: var(--muted);
}

.pop-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 1px;
  padding: 6px 8px;
  border-radius: 8px;
  background: rgb(255 255 255 / 0.08);
}
@media (min-width: 720px) and (min-height: 600px) {
  .cam-stage {
    --roi-h: clamp(76px, 20svh, 170px);
  }
}

/* JavaScript が動かない表示（ファイルのプレビューなど）への案内 */
.noscript-note {
  margin: 16px;
  padding: 14px 16px;
  border-radius: 12px;
  background: var(--warn-soft);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.7;
}
.noscript-note p {
  margin: 6px 0 0;
}

/* ---------- スタート画面・使い方画面 ---------- */
.guide {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
  background: rgb(8 14 12 / 0.62);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.guide-card {
  width: min(100%, 540px);
  max-height: 100%;
  overflow-y: auto;
  display: grid;
  gap: 10px;
  padding: 18px 18px 20px;
  border-radius: 18px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 18px 48px rgb(0 0 0 / 0.4);
}
.guide-hero {
  display: grid;
  gap: 2px;
  justify-items: center;
  text-align: center;
  padding-bottom: 6px;
}
.guide-hero b {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-brand);
  font-weight: 900;
  font-size: 30px;
  letter-spacing: 0.05em;
}
.guide-hero span {
  font-size: 13px;
  color: var(--muted);
}
.guide-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.guide-head b {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.06em;
}
.guide-head .pop-x {
  background: var(--surface-2);
  color: var(--ink);
}
.guide-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  background: var(--surface);
  text-align: left;
}
.guide-btn:active {
  background: var(--surface-2);
}
.gi {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent);
}
.gi svg {
  width: 22px;
  height: 22px;
}
.gi.small {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: none;
  color: inherit;
}
.gi.small svg {
  width: 16px;
  height: 16px;
}
.gt {
  display: grid;
  gap: 1px;
  min-width: 0;
}
.gt b {
  font-size: 15px;
}
.gt small {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}
.guide-steps {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}
.guide-steps li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.guide-note {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}
.guide-foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding-top: 4px;
}
.guide-foot .btn.ghost {
  background: var(--surface-2);
  color: var(--ink);
  box-shadow: none;
}
.help-btn {
  flex: none;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 50%;
  background: rgb(0 0 0 / 0.5);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  line-height: 1;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.18);
}
.help-btn.light {
  background: var(--surface-2);
  color: var(--muted);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: none;
}

/* 横向きは設定チップを1行スクロールにして、画面の高さを手牌側に回す */
.set-chips {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.set-chips::-webkit-scrollbar {
  display: none;
}

/* テンパイの見出しのすぐ横にアガリ牌 */
.s-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 10px;
}
.s-waits {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px;
}


/* 画面が低いとき（横向きのスマホ）は使い方カードを詰める */
@media (max-height: 480px) {
  .guide-card {
    padding: 12px 14px 14px;
    gap: 6px;
  }
  .guide-steps {
    gap: 6px;
  }
  .guide-hero b {
    font-size: 24px;
  }
  .gi {
    width: 32px;
    height: 32px;
    border-radius: 10px;
  }
  .gi svg {
    width: 18px;
    height: 18px;
  }
  .gt small {
    font-size: 11px;
    line-height: 1.45;
  }
}
/* 配牌整理の ON/OFF。設定チップと区別できるよう「操作ボタン」の見た目にする */
#cam-sort {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  border: 0;
  border-radius: 999px;
  padding: 5px 4px 5px 8px;
  background: rgb(255 255 255 / 0.16);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.32), 0 2px 10px rgb(0 0 0 / 0.35);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
#cam-sort .st-state {
  border-radius: 999px;
  padding: 2px 6px;
  background: rgb(0 0 0 / 0.4);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
}
#cam-sort[aria-pressed='true'] {
  background: #8fe3bd;
  color: #10352a;
  box-shadow: 0 2px 10px rgb(0 0 0 / 0.4);
}
#cam-sort[aria-pressed='true'] .st-state {
  background: #10352a;
  color: #8fe3bd;
}
/* まだ認識していないときは「押しても効かない」ことが分かるように薄く */
#cam-sort[data-ready='false'] {
  opacity: 0.55;
}
.s-waits small {
  font-size: 11px;
  color: var(--muted);
  margin-right: 2px;
}




/* ---------- 画面が低いとき（横向きのスマホ）の手入力画面 ---------- */
@media (max-height: 540px) {
  .manual {
    padding-inline: 10px;
  }
  .table {
    padding: 4px 8px 6px;
  }
  .table-head {
    font-size: 11px;
  }
  .hand {
    margin-top: 6px;
    min-height: 0;
  }
  .keyboard {
    padding-block: 2px 4px;
    max-width: 308px;
  }
  .workspace {
    column-gap: 12px;
  }
  .kb-grid {
    grid-template-columns: repeat(10, minmax(0, 1fr));
  }
  .hand {
    --w0: min(26px, calc((100cqw - 44px) / 15.6));
    --w: var(--w0);
    gap: 1px;
  }
  .melds {
    --w: min(20px, calc((100cqw - 60px) / 15));
    margin-top: 5px;
  }
  .win-slot {
    margin-left: 6px;
  }
  .win-caption {
    font-size: 9px;
  }
  .kb-tab {
    padding: 3px 0;
    font-size: 11px;
  }
  .kb-hint {
    min-height: 18px;
    padding-block: 1px;
    font-size: 10px;
    line-height: 1.25;
  }
  .red-toggle {
    padding: 2px 8px;
    font-size: 11px;
  }
  .kb-grid {
    gap: 4px 3px;
  }
  .key.act {
    font-size: 10px;
  }
  .appbar {
    padding-block: 3px 2px;
  }
  .brand-mini {
    font-size: 20px;
  }
  .rules-bar {
    padding: 3px 8px;
    margin-bottom: 4px;
  }
}


/* リーチは1タップで なし → リーチ → ダブリー。色でも分かるようにする */
.rules-bar .gchip.riichi[data-riichi='0'] {
  background: var(--surface-2);
  color: var(--muted);
}
.rules-bar .gchip.riichi[data-riichi='1'] {
  background: var(--warn);
  color: #fff;
}
.rules-bar .gchip.riichi[data-riichi='2'] {
  background: #c0392b;
  color: #fff;
}


/* 画面が低いとき（横向きのスマホ）は、認識ボタンまわりを詰める */
@media (max-height: 560px) {
  .shutter {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    font-size: 10px;
  }
  .shutter svg {
    width: 24px;
    height: 24px;
  }
  .retake,
  .cam-reset,
  #cam-sort {
    padding-block: 4px;
    font-size: 11px;
  }
}



/* ---------- 状況の帯: タップで切り替えるチップ ---------- */
.gchip em.oya {
  background: var(--warn);
  color: #fff;
  margin-left: 1px;
}
.gchip em.ko {
  background: var(--accent);
  color: #fff;
  margin-left: 1px;
}
/* 切り替えチップは幅を固定して、文字が変わっても押す場所が動かないようにする */
.rules-bar .gchip.fixed {
  justify-content: center;
  height: 24px;
  padding-block: 0;
}
.rules-bar .gchip.fixed[data-key='roundWind'] {
  min-width: 3.8em;
}
.rules-bar .gchip.fixed[data-key='seatWind'] {
  min-width: 5.4em;
}
.rules-bar .gchip.fixed[data-key='riichi'] {
  min-width: 6.3em;
  padding-inline: 5px;
}
.rules-bar .gchip.fixed[data-key='ippatsu'] {
  min-width: 3.6em;
}
/* 一発が付いているときはリーチと同じオレンジ */
.rules-bar .gchip.fixed[data-key='ippatsu'][aria-pressed='true'] {
  background: var(--warn);
  color: #fff;
}
/* ロン／ツモ: 両方の文字を出して、選んでいる側だけ塗る */
.rules-bar .gchip.seg2 {
  padding: 0 2px;
  gap: 1px;
  background: var(--surface-2);
  color: var(--muted);
}
.rules-bar .gchip.seg2[aria-pressed='true'] {
  background: var(--surface-2);
  color: var(--muted);
}
.rules-bar .gchip.seg2 span {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
}
.rules-bar .gchip.seg2[aria-pressed='false'] .seg-a,
.rules-bar .gchip.seg2[aria-pressed='true'] .seg-b {
  background: var(--ink);
  color: var(--surface);
}
/* 縦向きのスマホでは アガリ想定 を「リーチ・ロン/ツモ・一発」「裏ドラ・抜きドラ・その他」の2行に固定 */
.sit-br {
  display: none;
}
@media (max-width: 599px) {
  .sit-br {
    display: block;
    flex-basis: 100%;
    height: 0;
    margin: -5px 0 0; /* 行間はチップの gap ぶんだけ */
  }
}
/* 一発はリーチ・ダブリーのときだけ切り替わる（それ以外は薄く） */
.rules-bar .gchip.fixed[data-key='ippatsu'][data-off='true'] {
  color: var(--muted);
  opacity: 0.55;
}
/* ドラ表記: 「なし」でも牌1〜2枚でも同じ幅（3枚以上は伸びる） */
.rules-bar .gchip.dora {
  min-width: 6.6em;
  height: 24px;
  padding-block: 0;
  gap: 3px;
}
.rules-bar .gchip.dora .none {
  color: var(--muted);
}
/* その他（人数・符などの設定シート）は色を変えて区別 */
.rules-bar .gchip.more {
  position: relative;
  min-width: 4.2em;
  height: 24px;
  padding-block: 0;
  justify-content: center;
  background: var(--accent);
  color: #fff;
}
.rules-bar .gchip.more[data-changed='true']::after {
  content: '';
  position: absolute;
  top: 1px;
  right: 3px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--warn);
  box-shadow: 0 0 0 1.5px var(--surface);
}
:root[data-theme='dark'] .rules-bar .gchip.more {
  color: #0c1310;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .rules-bar .gchip.more {
    color: #0c1310;
  }
}
.rules-bar .gchip.fixed[data-key='riichi'][data-riichi='0'] {
  background: var(--surface-2);
  color: var(--muted);
}
.rules-bar .gchip.fixed[data-key='riichi'][data-riichi='1'] {
  background: var(--warn);
  color: #fff;
}
.rules-bar .gchip.fixed[data-key='riichi'][data-riichi='2'] {
  background: #c0392b;
  color: #fff;
}
/* 待ち牌の並びのあとの「でアガリ」「が来るとテンパイ」 */
.tail-lbl {
  align-self: center;
  margin-left: 2px;
  font-size: 12px;
  color: var(--muted);
}
/* 本場・供託をふくめた「動く点数」（基本の点数と分けて出す） */
.move-line {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px 4px;
  margin: 6px 0 2px;
  padding: 6px 10px;
  border-radius: 10px;
  background: var(--surface-2);
}
.move-line i {
  font-style: normal;
  font-size: 11px;
  color: var(--muted);
}
.move-line .mv {
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
  font-variant-numeric: tabular-nums;
}
.move-line .mv small {
  font-size: 10px;
  color: var(--muted);
}
.move-line .mv b {
  font-size: 13px;
  font-weight: 800;
}
.move-line .mv.add b {
  color: var(--warn);
}
.move-line .mv.total {
  margin-left: auto;
}
.move-line .mv.total b {
  font-size: 16px;
  color: var(--accent);
}
.move-line .mv.total b em {
  font-style: normal;
  font-size: 12px;
  font-weight: 700;
}

/* バナー広告のスペース（iPhoneアプリ・Webアプリで中身を差し替える） */
.ad-slot {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 54px;
  padding: 2px max(10px, env(safe-area-inset-left, 0px)) max(2px, env(safe-area-inset-bottom, 0px));
  background: var(--surface-2);
  border-top: 1px solid var(--line);
}
.ad-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: min(320px, 100%);
  height: 50px;
  border-radius: 6px;
  border: 1px dashed var(--line);
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
}
.ad-inner small {
  font-size: 10px;
  opacity: 0.7;
}
/* 横向きの画面は高さが足りないので、広告の枠は出さない（縦向き前提のアプリ） */
@media (max-height: 560px) {
  .ad-slot {
    display: none;
  }
}

/* テンパイになる切り方の待ち牌（横並び。点数はOK後に牌の下） */
.wait-chips {
  flex-wrap: wrap;
  gap: 6px 10px; /* ツモの2段の点数（子 ○・親 ○）が隣と詰まらないように */
}
.wait-chip {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}
.wait-chip small {
  font-size: 10px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  line-height: 1;
}
.wait-chip small.none {
  color: var(--muted);
}
/* 「○を切ると…」の見出しと受け入れ牌を → でつなぐ */
.next-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 6px 0 2px 6px;
}
.next-row .arrow {
  flex: none;
  font-size: 16px;
  font-weight: 800;
  line-height: 1;
  color: var(--accent);
}
.next-row .tiles-inline {
