// ---- src/recognition/layout.js ----
// 端末内の物体検出モデル（YOLO系）の出力 → 手牌の並びへの変換
//   モデルのクラス番号は牌id（0-36）と同じ並びで学習する想定:
//   0-8=1m-9m, 9-17=1p-9p, 18-26=1s-9s, 27-33=東南西北白發中, 34-36=赤5m/赤5p/赤5s


const CLASS_TOKENS = [
  '1m', '2m', '3m', '4m', '5m', '6m', '7m', '8m', '9m',
  '1p', '2p', '3p', '4p', '5p', '6p', '7p', '8p', '9p',
  '1s', '2s', '3s', '4s', '5s', '6s', '7s', '8s', '9s',
  '1z', '2z', '3z', '4z', '5z', '6z', '7z',
  '0m', '0p', '0s',
];

/** 元画像を正方形の入力にレターボックス配置するときの変換値 */
function letterbox(srcW, srcH, size = 640) {
  const scale = Math.min(size / srcW, size / srcH);
  const w = Math.round(srcW * scale);
  const h = Math.round(srcH * scale);
  return { size, scale, padX: Math.floor((size - w) / 2), padY: Math.floor((size - h) / 2), w, h };
}

/** 入力座標の検出枠を元画像の座標に戻す */
function unletterbox(det, lb) {
  return {
    ...det,
    x: (det.x - lb.padX) / lb.scale,
    y: (det.y - lb.padY) / lb.scale,
    w: det.w / lb.scale,
    h: det.h / lb.scale,
  };
}

function iou(a, b) {
  const x1 = Math.max(a.x, b.x);
  const y1 = Math.max(a.y, b.y);
  const x2 = Math.min(a.x + a.w, b.x + b.w);
  const y2 = Math.min(a.y + a.h, b.y + b.h);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  const union = a.w * a.h + b.w * b.h - inter;
  return union > 0 ? inter / union : 0;
}

/** クラスを問わない NMS（牌は重ならないので、同じ場所の重複を1つにする） */
function nms(dets, iouThreshold = 0.5) {
  const sorted = dets.slice().sort((a, b) => b.score - a.score);
  const kept = [];
  for (const d of sorted) {
    if (kept.every((k) => iou(k, d) < iouThreshold)) kept.push(d);
  }
  return kept;
}

/**
 * YOLOv8/YOLO11 の ONNX 出力（形状 [1, 4+クラス数, 候補数]、cx,cy,w,h + クラススコア）を検出枠に。
 * data: Float32Array（行優先）
 */
function decodeYolo(data, dims, { confThreshold = 0.35, iouThreshold = 0.5 } = {}) {
  const channels = dims[1];
  const n = dims[2];
  const classes = channels - 4;
  const out = [];
  for (let i = 0; i < n; i++) {
    let best = -1;
    let bestScore = confThreshold;
    for (let c = 0; c < classes; c++) {
      const s = data[(4 + c) * n + i];
      if (s > bestScore) {
        bestScore = s;
        best = c;
      }
    }
    if (best < 0) continue;
    const cx = data[i];
    const cy = data[n + i];
    const w = data[2 * n + i];
    const h = data[3 * n + i];
    out.push({ x: cx - w / 2, y: cy - h / 2, w, h, cls: best, score: bestScore });
  }
  return nms(out, iouThreshold);
}

const median = (arr) => {
  if (!arr.length) return 0;
  const s = arr.slice().sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

function meldFrom(segment) {
  const ids = segment.map((d) => d.cls);
  const bases = ids.map(tileBase).sort((a, b) => a - b);
  const same = bases.every((b) => b === bases[0]);
  if (ids.length === 4 && same) return { type: 'minkan', tiles: ids };
  if (ids.length === 3 && same) return { type: 'pon', tiles: ids };
  if (ids.length === 3 && bases[0] < 27 && bases[0] % 9 <= 6 && bases[1] === bases[0] + 1 && bases[2] === bases[0] + 2) {
    return { type: 'chi', tiles: ids.slice().sort((a, b) => tileBase(a) - tileBase(b)) };
  }
  return null;
}

/**
 * 検出枠の集まりから手牌の並びを組み立てる。
 *  - 縦位置が近い枠を1列にまとめ、いちばん枚数の多い列を手牌とみなす
 *  - 左から並べ、間隔が大きく空いたところで区切る
 *  - 右側の「横向きの牌を含む3〜4枚の組」は鳴き
 *  - 手牌の右に1枚だけ離れていて、枚数が 3n+2 なら和了牌
 * 戻り値: { tiles, win, melds, boxes: { tiles, win, melds }, warnings }
 */
function arrangeHand(dets, { minScore = 0.35 } = {}) {
  const warnings = [];
  const pool = dets.filter((d) => d.score >= minScore);
  if (!pool.length) return { tiles: [], win: null, melds: [], boxes: { tiles: [], win: null, melds: [] }, warnings: ['牌が見つかりません'] };

  // 1列にまとめる
  const mh = median(pool.map((d) => Math.max(d.w, d.h)));
  const byY = pool.slice().sort((a, b) => a.y + a.h / 2 - (b.y + b.h / 2));
  const rows = [];
  for (const d of byY) {
    const cy = d.y + d.h / 2;
    const row = rows[rows.length - 1];
    if (row && Math.abs(cy - row.cy) < mh * 0.6) {
      row.items.push(d);
      row.cy = row.items.reduce((s, x) => s + x.y + x.h / 2, 0) / row.items.length;
    } else {
      rows.push({ cy, items: [d] });
    }
  }
  rows.sort((a, b) => b.items.length - a.items.length || b.cy - a.cy);
  if (rows.length > 1) warnings.push('手牌以外の牌も写っています（いちばん長い列を手牌として扱いました）');
  const row = rows[0].items.sort((a, b) => a.x - b.x);

  // 区切り
  const sideways = (d) => d.w > d.h * 1.1;
  const upright = row.filter((d) => !sideways(d));
  const mw = median((upright.length ? upright : row).map((d) => Math.min(d.w, d.h)));
  const segments = [[row[0]]];
  for (let i = 1; i < row.length; i++) {
    const prev = row[i - 1];
    const gap = row[i].x - (prev.x + prev.w);
    if (gap > Math.max(mw * 0.35, 2)) segments.push([row[i]]);
    else segments[segments.length - 1].push(row[i]);
  }

  // 右から鳴きを取り出す
  const melds = [];
  const meldBoxes = [];
  while (segments.length > 1) {
    const seg = segments[segments.length - 1];
    if (!(seg.length >= 3 && seg.length <= 4 && seg.some(sideways))) break;
    const meld = meldFrom(seg);
    if (!meld) {
      warnings.push('鳴きの組を判定できませんでした');
      break;
    }
    melds.unshift(meld);
    meldBoxes.unshift(seg);
    segments.pop();
  }

  const handDets = segments.flat();
  const need = 13 - 3 * melds.length;
  let winDet = null;
  const last = segments[segments.length - 1];
  if (handDets.length === need + 1) {
    // 離れた1枚があればそれ、なければ右端の牌をツモ牌（和了牌）とみなす
    winDet = handDets.pop();
    if (!(segments.length >= 2 && last.length === 1)) warnings.push('14枚目の位置が分からないため、右端の牌を和了牌として扱いました');
  } else if (handDets.length !== need) {
    warnings.push(`手牌が${handDets.length}枚見つかりました（${need}枚のはず）`);
  }
  return {
    tiles: handDets.map((d) => d.cls),
    win: winDet ? winDet.cls : null,
    melds,
    boxes: { tiles: handDets, win: winDet, melds: meldBoxes },
    warnings,
  };
}

// ---- src/recognition/imgproc.js ----
// 画像処理の小さな道具（端末内の牌読み取り用）。ml/portable.py と同じ式
//   画像: { w, h, c, data }（data は Float64Array、画素ごとに c 個の値を並べる）

function fromRGBA(imageData) {
  const { width: w, height: h, data: src } = imageData;
  const data = new Float64Array(w * h * 3);
  for (let i = 0, j = 0; i < w * h; i++, j += 4) {
    data[i * 3] = src[j];
    data[i * 3 + 1] = src[j + 1];
    data[i * 3 + 2] = src[j + 2];
  }
  return { w, h, c: 3, data };
}

/**
 * RGBA（canvas の getImageData）→ 面積平均で縮小した RGB（Float64）。
 * canvas の drawImage で縮小すると（特にスマホの 4032px 幅の写真）細い線が飛び飛びになり、
 * 索子の竹の本数を読み違える原因になるため、縮小は自前の面積平均で行う。
 * 元の大きさの Float64 を作らず、入力の行ごとに処理してメモリを抑える
 */
function fromRGBAScaled(imageData, outW, outH) {
  const { width: W, height: H, data: src } = imageData;
  if (outW >= W && outH >= H) return fromRGBA(imageData);
  const wx = areaWeights(W, outW);
  const wy = areaWeights(H, outH);
  // 入力の行 y → それを使う出力の行 [o, weight]
  const byRow = Array.from({ length: H }, () => []);
  for (let o = 0; o < outH; o++) for (const [i, w] of wy[o]) byRow[i].push([o, w]);
  // 横方向の重みは (入力の列 i, 重み) を平らな配列にしておく
  const xIdx = new Int32Array(wx.reduce((n, ws) => n + ws.length, 0));
  const xW = new Float64Array(xIdx.length);
  const xStart = new Int32Array(outW + 1);
  let k = 0;
  for (let o = 0; o < outW; o++) {
    xStart[o] = k;
    for (const [i, w] of wx[o]) {
      xIdx[k] = i;
      xW[k] = w;
      k++;
    }
  }
  xStart[outW] = k;
  const out = new Float64Array(outW * outH * 3);
  const xr = new Float64Array(outW * 3);
  for (let y = 0; y < H; y++) {
    const users = byRow[y];
    if (!users.length) continue;
    const rowIn = y * W * 4;
    for (let o = 0; o < outW; o++) {
      let r = 0;
      let g = 0;
      let b = 0;
      for (let t = xStart[o]; t < xStart[o + 1]; t++) {
        const j = rowIn + xIdx[t] * 4;
        const w = xW[t];
        r += w * src[j];
        g += w * src[j + 1];
        b += w * src[j + 2];
      }
      xr[o * 3] = r;
      xr[o * 3 + 1] = g;
      xr[o * 3 + 2] = b;
    }
    for (const [o, w] of users) {
      const base = o * outW * 3;
      for (let x = 0; x < outW * 3; x++) out[base + x] += w * xr[x];
    }
  }
  return { w: outW, h: outH, c: 3, data: out };
}

function grayOf(img) {
  const n = img.w * img.h;
  const out = new Float64Array(n);
  const d = img.data;
  for (let i = 0; i < n; i++) out[i] = 0.299 * d[i * 3] + 0.587 * d[i * 3 + 1] + 0.114 * d[i * 3 + 2];
  return { w: img.w, h: img.h, c: 1, data: out };
}

/** H 0〜180、S・V 0〜255（小数） */
function hsvOf(img) {
  const n = img.w * img.h;
  const H = new Float64Array(n);
  const S = new Float64Array(n);
  const V = new Float64Array(n);
  const d = img.data;
  for (let i = 0; i < n; i++) {
    const r = d[i * 3];
    const g = d[i * 3 + 1];
    const b = d[i * 3 + 2];
    const v = Math.max(r, g, b);
    const m = Math.min(r, g, b);
    const dd = v - m;
    V[i] = v;
    S[i] = v > 0 ? (255 * dd) / v : 0;
    let hh = 0;
    if (dd > 0) {
      if (v === r) hh = (60 * (g - b)) / dd;
      else if (v === g) hh = 120 + (60 * (b - r)) / dd;
      else hh = 240 + (60 * (r - g)) / dd;
      if (hh < 0) hh += 360;
    }
    H[i] = hh / 2;
  }
  return { H, S, V };
}

/** numpy.percentile（線形補間）と同じ */
function percentile(arr, q) {
  const s = Float64Array.from(arr).sort();
  const idx = (q / 100) * (s.length - 1);
  const lo = Math.floor(idx);
  const hi = Math.min(lo + 1, s.length - 1);
  return s[lo] + (idx - lo) * (s[hi] - s[lo]);
}

/** numpy.median と同じ（偶数個なら中央の2つの平均） */
function medianOf(arr) {
  const n = arr.length;
  if (!n) return NaN;
  const s = Float64Array.from(arr).sort();
  return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
}

/** Python の round（0.5 は偶数へ） */
function roundHalfEven(x) {
  const r = Math.round(x);
  return Math.abs(x % 1) === 0.5 && r % 2 !== 0 ? r - 1 : r;
}

function areaWeights(nIn, nOut) {
  const scale = nIn / nOut;
  const rows = [];
  for (let o = 0; o < nOut; o++) {
    const a = o * scale;
    const b = (o + 1) * scale;
    const i0 = Math.floor(a);
    const i1 = Math.min(Math.ceil(b), nIn);
    const ws = [];
    for (let i = i0; i < i1; i++) {
      const w = Math.min(b, i + 1) - Math.max(a, i);
      if (w > 1e-9) ws.push([i, w / scale]);
    }
    rows.push(ws);
  }
  return rows;
}

function linearWeights(nIn, nOut) {
  const scale = nIn / nOut;
  const rows = [];
  for (let o = 0; o < nOut; o++) {
    let x = (o + 0.5) * scale - 0.5;
    x = Math.min(Math.max(x, 0), nIn - 1);
    const i0 = Math.floor(x);
    const i1 = Math.min(i0 + 1, nIn - 1);
    const f = x - i0;
    rows.push(i1 !== i0 ? [[i0, 1 - f], [i1, f]] : [[i0, 1]]);
  }
  return rows;
}

/** 面積平均で縮小（拡大の向きは線形補間）。sub = { x, y, w, h } で一部だけを使う */
function areaResize(img, outW, outH, sub = null) {
  const sx = sub ? sub.x : 0;
  const sy = sub ? sub.y : 0;
  const W = sub ? sub.w : img.w;
  const H = sub ? sub.h : img.h;
  const C = img.c;
  const wx = outW <= W ? areaWeights(W, outW) : linearWeights(W, outW);
  const wy = outH <= H ? areaWeights(H, outH) : linearWeights(H, outH);
  const tmp = new Float64Array(H * outW * C);
  const d = img.data;
  for (let y = 0; y < H; y++) {
    const rowIn = ((sy + y) * img.w + sx) * C;
    const rowOut = y * outW * C;
    for (let o = 0; o < outW; o++) {
      const ws = wx[o];
      for (let k = 0; k < ws.length; k++) {
        const [i, w] = ws[k];
        for (let ch = 0; ch < C; ch++) tmp[rowOut + o * C + ch] += w * d[rowIn + i * C + ch];
      }
    }
  }
  const out = new Float64Array(outH * outW * C);
  for (let o = 0; o < outH; o++) {
    const ws = wy[o];
    for (let k = 0; k < ws.length; k++) {
      const [i, w] = ws[k];
      const base = i * outW * C;
      const ob = o * outW * C;
      for (let x = 0; x < outW * C; x++) out[ob + x] += w * tmp[base + x];
    }
  }
  return { w: outW, h: outH, c: C, data: out };
}

function toU8(img) {
  const out = new Uint8ClampedArray(img.data.length);
  for (let i = 0; i < out.length; i++) out[i] = Math.min(255, Math.max(0, Math.floor(img.data[i] + 0.5)));
  return { w: img.w, h: img.h, c: img.c, data: out };
}

/** 4点の対応（src → dst）から射影変換行列 [9] */
function perspectiveMatrix(src, dst) {
  const A = [];
  const bv = [];
  for (let k = 0; k < 4; k++) {
    const [x, y] = src[k];
    const [u, v] = dst[k];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]);
    bv.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]);
    bv.push(v);
  }
  const h = solve(A, bv);
  return [...h, 1];
}

function solve(A, b) {
  const n = b.length;
  const M = A.map((row, i) => [...row, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const f = M[r][c] / M[c][c];
      for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
    }
  }
  return M.map((row, i) => row[n] / row[i]);
}

function mat3mul(A, B) {
  const out = new Array(9).fill(0);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) for (let k = 0; k < 3; k++) out[i * 3 + j] += A[i * 3 + k] * B[k * 3 + j];
  return out;
}

function invert3(m) {
  const [a, b, c, d, e, f, g, h, i] = m;
  const A = e * i - f * h;
  const B = -(d * i - f * g);
  const C = d * h - e * g;
  const det = a * A + b * B + c * C;
  return [
    A / det, -(b * i - c * h) / det, (b * f - c * e) / det,
    B / det, (a * i - c * g) / det, -(a * f - c * d) / det,
    C / det, -(a * h - b * g) / det, (a * e - b * d) / det,
  ];
}

/** 出力(x, y) ← 入力 M^-1 (x, y)。双線形補間、はみ出しは端の画素 */
function warpBilinear(img, M, outW, outH) {
  const Mi = invert3(M);
  const { w: W, h: H, c: C, data: d } = img;
  const out = new Float64Array(outW * outH * C);
  for (let y = 0; y < outH; y++) {
    for (let x = 0; x < outW; x++) {
      const den = Mi[6] * x + Mi[7] * y + Mi[8];
      let u = (Mi[0] * x + Mi[1] * y + Mi[2]) / den;
      let v = (Mi[3] * x + Mi[4] * y + Mi[5]) / den;
      u = Math.min(Math.max(u, 0), W - 1);
      v = Math.min(Math.max(v, 0), H - 1);
      const x0 = Math.floor(u);
      const y0 = Math.floor(v);
      const x1 = Math.min(x0 + 1, W - 1);
      const y1 = Math.min(y0 + 1, H - 1);
      const fx = u - x0;
      const fy = v - y0;
      const o = (y * outW + x) * C;
      const p00 = (y0 * W + x0) * C;
      const p01 = (y0 * W + x1) * C;
      const p10 = (y1 * W + x0) * C;
      const p11 = (y1 * W + x1) * C;
      for (let ch = 0; ch < C; ch++) {
        const top = d[p00 + ch] * (1 - fx) + d[p01 + ch] * fx;
        const bot = d[p10 + ch] * (1 - fx) + d[p11 + ch] * fx;
        out[o + ch] = top * (1 - fy) + bot * fy;
      }
    }
  }
  return { w: outW, h: outH, c: C, data: out };
}

/** 1行ぶんの最大値・最小値フィルタ（窓 [x-lo, x+hi]、はみ出しは使わない） */
function slide1d(src, n, lo, hi, isMax, out) {
  const dq = new Int32Array(n);
  let head = 0;
  let tail = 0;
  let next = 0;
  for (let x = 0; x < n; x++) {
    const end = Math.min(n - 1, x + hi);
    while (next <= end) {
      const v = src[next];
      while (tail > head && (isMax ? src[dq[tail - 1]] <= v : src[dq[tail - 1]] >= v)) tail--;
      dq[tail++] = next;
      next++;
    }
    while (dq[head] < x - lo) head++;
    out[x] = src[dq[head]];
  }
}

/** 長方形の窓での最大（dilate）・最小（erode）。kw×kh、中心は OpenCV と同じ (kw/2, kh/2) の切り捨て */
function rectFilter(data, w, h, kw, kh, isMax) {
  const ax = Math.floor(kw / 2);
  const ay = Math.floor(kh / 2);
  const tmp = new Float64Array(w * h);
  const rowIn = new Float64Array(w);
  const rowOut = new Float64Array(w);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) rowIn[x] = data[y * w + x];
    slide1d(rowIn, w, ax, kw - 1 - ax, isMax, rowOut);
    tmp.set(rowOut, y * w);
  }
  const out = new Float64Array(w * h);
  const colIn = new Float64Array(h);
  const colOut = new Float64Array(h);
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) colIn[y] = tmp[y * w + x];
    slide1d(colIn, h, ay, kh - 1 - ay, isMax, colOut);
    for (let y = 0; y < h; y++) out[y * w + x] = colOut[y];
  }
  return out;
}

/** OpenCV の楕円の構造要素（行ごとの横幅の半分） */
function ellipseHalfWidths(k) {
  const r = Math.floor(k / 2);
  const c = Math.floor(k / 2);
  const invR2 = r ? 1 / (r * r) : 0;
  const hw = [];
  for (let i = 0; i < k; i++) {
    const dy = i - r;
    if (Math.abs(dy) <= r) {
      const dx = Math.round(c * Math.sqrt((r * r - dy * dy) * invR2));
      const j1 = Math.max(c - dx, 0);
      const j2 = Math.min(c + dx + 1, k);
      hw.push([j1 - c, j2 - 1 - c]);
    } else hw.push(null);
  }
  return hw;
}

/** 楕円の窓での最大・最小（行ごとの横の窓を組み合わせる） */
function ellipseFilter(data, w, h, k, isMax) {
  const hw = ellipseHalfWidths(k);
  const cache = new Map();
  const rowIn = new Float64Array(w);
  const rowOut = new Float64Array(w);
  const horiz = (lo, hi) => {
    const key = `${lo},${hi}`;
    if (cache.has(key)) return cache.get(key);
    const out = new Float64Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) rowIn[x] = data[y * w + x];
      slide1d(rowIn, w, -lo, hi, isMax, rowOut);
      out.set(rowOut, y * w);
    }
    cache.set(key, out);
    return out;
  };
  const r = Math.floor(k / 2);
  const layers = hw.map((v) => (v ? horiz(v[0], v[1]) : null));
  const out = new Float64Array(w * h).fill(isMax ? -Infinity : Infinity);
  for (let i = 0; i < k; i++) {
    const L = layers[i];
    if (!L) continue;
    const dy = i - r;
    for (let y = 0; y < h; y++) {
      const yy = y + dy;
      if (yy < 0 || yy >= h) continue;
      const o = y * w;
      const s = yy * w;
      if (isMax) for (let x = 0; x < w; x++) out[o + x] = Math.max(out[o + x], L[s + x]);
      else for (let x = 0; x < w; x++) out[o + x] = Math.min(out[o + x], L[s + x]);
    }
  }
  return out;
}

/** 8近傍のつながり → { labels, stats: [{ x, y, w, h, area }] }（0 は背景） */
function connectedComponents(mask, w, h) {
  const labels = new Int32Array(w * h);
  const stats = [null];
  const stack = new Int32Array(w * h);
  let next = 1;
  for (let p = 0; p < w * h; p++) {
    if (!mask[p] || labels[p]) continue;
    let top = 0;
    stack[top++] = p;
    labels[p] = next;
    let x0 = w;
    let y0 = h;
    let x1 = -1;
    let y1 = -1;
    let area = 0;
    while (top) {
      const q = stack[--top];
      const qx = q % w;
      const qy = (q - qx) / w;
      area++;
      if (qx < x0) x0 = qx;
      if (qx > x1) x1 = qx;
      if (qy < y0) y0 = qy;
      if (qy > y1) y1 = qy;
      for (let dy = -1; dy <= 1; dy++) {
        const ny = qy + dy;
        if (ny < 0 || ny >= h) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const nx = qx + dx;
          if (nx < 0 || nx >= w || (!dx && !dy)) continue;
          const nq = ny * w + nx;
          if (mask[nq] && !labels[nq]) {
            labels[nq] = next;
            stack[top++] = nq;
          }
        }
      }
    }
    stats.push({ x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1, area });
    next++;
  }
  return { labels, stats };
}

/** y = a x + b（最小二乗） */
function polyfit1(xs, ys) {
  const n = xs.length;
  let sx = 0;
  let sy = 0;
  let sxx = 0;
  let sxy = 0;
  for (let i = 0; i < n; i++) {
    sx += xs[i];
    sy += ys[i];
    sxx += xs[i] * xs[i];
    sxy += xs[i] * ys[i];
  }
  const den = n * sxx - sx * sx;
  const a = den ? (n * sxy - sx * sy) / den : 0;
  return [a, (sy - a * sx) / n];
}

// ---- src/recognition/tilefeat.js ----
// 牌1枚（40×56 の切り出し）→ 1164次元の特徴量。ml/portable.py の features_v4 と同じ値になる
//   細かいHOG（6px）＋ 粗いHOG（12px）＋ 赤の配置（4×6）＋ 黒の配置（4×6）


const TILE_W = 40;
const TILE_H = 56;
const FEATURE_DIM = 1164;

/** 明るさをそろえた 0〜1 の画像（画像は {w,h,c:3,data}） */
function normGray(img) {
  const n = img.w * img.h;
  const Y = new Float64Array(n);
  const d = img.data;
  for (let i = 0; i < n; i++) Y[i] = 0.299 * d[i * 3] + 0.587 * d[i * 3 + 1] + 0.114 * d[i * 3 + 2];
  const lo = percentile(Y, 3);
  const hi = percentile(Y, 97);
  const den = Math.max(hi - lo, 1);
  const out = new Float64Array(n);
  for (let i = 0; i < n; i++) out[i] = Math.min(Math.max((Y[i] - lo) / den, 0), 1);
  return out;
}

/** scikit-image の hog（9方向・2×2ブロック・L2-Hys）と同じ */
function hog(img, w, h, ppc, orientations = 9, cpb = 2) {
  const eps = 1e-5;
  const mag = new Float64Array(w * h);
  const bin = new Int32Array(w * h);
  const step = 180 / orientations;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const gr = y > 0 && y < h - 1 ? img[i + w] - img[i - w] : 0;
      const gc = x > 0 && x < w - 1 ? img[i + 1] - img[i - 1] : 0;
      let ori = (Math.atan2(gr, gc) * 180) / Math.PI;
      ori %= 180;
      if (ori < 0) ori += 180;
      const b = Math.floor(ori / step);
      bin[i] = Math.min(b, orientations - 1);
      mag[i] = b < orientations ? Math.hypot(gc, gr) : 0;
    }
  }
  const ncr = Math.floor(h / ppc);
  const ncc = Math.floor(w / ppc);
  const hist = new Float64Array(ncr * ncc * orientations);
  for (let r = 0; r < ncr; r++) {
    for (let c = 0; c < ncc; c++) {
      const base = (r * ncc + c) * orientations;
      for (let y = r * ppc; y < (r + 1) * ppc; y++) {
        for (let x = c * ppc; x < (c + 1) * ppc; x++) {
          const i = y * w + x;
          hist[base + bin[i]] += mag[i];
        }
      }
      for (let o = 0; o < orientations; o++) hist[base + o] /= ppc * ppc;
    }
  }
  const nbr = ncr - cpb + 1;
  const nbc = ncc - cpb + 1;
  const out = new Float64Array(nbr * nbc * cpb * cpb * orientations);
  let k = 0;
  for (let r = 0; r < nbr; r++) {
    for (let c = 0; c < nbc; c++) {
      const blk = [];
      let s2 = 0;
      for (let br = 0; br < cpb; br++) {
        for (let bc = 0; bc < cpb; bc++) {
          const base = ((r + br) * ncc + (c + bc)) * orientations;
          for (let o = 0; o < orientations; o++) {
            const v = hist[base + o];
            blk.push(v);
            s2 += v * v;
          }
        }
      }
      const d1 = Math.sqrt(s2 + eps * eps);
      let s3 = 0;
      for (let i = 0; i < blk.length; i++) {
        blk[i] = Math.min(blk[i] / d1, 0.2);
        s3 += blk[i] * blk[i];
      }
      const d2 = Math.sqrt(s3 + eps * eps);
      for (let i = 0; i < blk.length; i++) out[k++] = blk[i] / d2;
    }
  }
  return out;
}

function gridMean(mask, w, h, gw, gh, out, at, scale) {
  for (let i = 0; i < gh; i++) {
    const y0 = Math.floor((i * h) / gh);
    const y1 = Math.floor(((i + 1) * h) / gh);
    for (let j = 0; j < gw; j++) {
      const x0 = Math.floor((j * w) / gw);
      const x1 = Math.floor(((j + 1) * w) / gw);
      let s = 0;
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) s += mask[y * w + x];
      out[at + i * gw + j] = (scale * s) / ((y1 - y0) * (x1 - x0));
    }
  }
}

/** img: { w: 40, h: 56, c: 3, data }（0〜255）→ Float32Array(1164) */
function featuresV4(img) {
  const { w, h, data } = img;
  const Yn = normGray(img);
  const cw = w - 6;
  const ch = h - 6;
  const inner = new Float64Array(cw * ch);
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) inner[y * cw + x] = Yn[(y + 3) * w + (x + 3)];
  const fine = hog(inner, cw, ch, 6);
  const coarse = hog(inner, cw, ch, 12);
  const n = w * h;
  const red = new Float64Array(n);
  const dark = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const r = data[i * 3];
    const g = data[i * 3 + 1];
    const b = data[i * 3 + 2];
    const v = Math.max(r, g, b);
    const m = Math.min(r, g, b);
    const dd = v - m;
    const S = v > 0 ? (255 * dd) / v : 0;
    let hh = 0;
    if (dd > 0) {
      if (v === r) hh = (60 * (g - b)) / dd;
      else if (v === g) hh = 120 + (60 * (b - r)) / dd;
      else hh = 240 + (60 * (r - g)) / dd;
      if (hh < 0) hh += 360;
    }
    hh /= 2;
    red[i] = (hh <= 12 || hh >= 160) && S > 60 && v > 50 ? 1 : 0;
    dark[i] = Yn[i] < 0.43 ? 1 : 0;
  }
  const out = new Float32Array(FEATURE_DIM);
  out.set(fine, 0);
  for (let i = 0; i < coarse.length; i++) out[fine.length + i] = 0.7 * coarse[i];
  const at = fine.length + coarse.length;
  gridMean(red, w, h, 4, 6, out, at, 0.8);
  gridMean(dark, w, h, 4, 6, out, at + 24, 0.5);
  return out;
}

// ---- src/recognition/rowfind.js ----
// 写真から手牌の列（立てた牌の面の四隅）を自動で見つける。ml/rowfind.py と同じ手順
//   牌の背の色（青・黄）の細い帯 → その下の牌の面 → 台（青緑のフェルト）との境目


const WORK_W = 1000;

/**
 * 色のマスク。relaxed は明るすぎる写真（色が白っぽく飛んで彩度が下がる）向けのゆるい条件。
 * まず普通の条件で探し、枠の近くに見つからないときだけゆるい条件で探し直す
 */
function masks(small, relaxed = false, hsv = null) {
  const { H, S, V } = hsv || hsvOf(small);
  const n = small.w * small.h;
  const blue = new Uint8Array(n);
  const yellow = new Uint8Array(n);
  const felt = new Uint8Array(n);
  const bS = relaxed ? 70 : 110;
  const yS = relaxed ? 55 : 100;
  const yH0 = relaxed ? 6 : 8;
  const yH1 = relaxed ? 34 : 28;
  const fS = relaxed ? 28 : 45;
  const fV = relaxed ? 30 : 50;
  for (let i = 0; i < n; i++) {
    const h = H[i];
    const s = S[i];
    const v = V[i];
    // 青い背は H 101〜（95 からにすると、青みの強いフェルト H 91〜97 まで背に数えて、フェルトと背が1つのかたまりになる）
    if (h >= 101 && h <= 130 && s >= bS && v >= 80) blue[i] = 1;
    if (h >= yH0 && h <= yH1 && s >= yS && v >= 130) yellow[i] = 1;
    if (h >= 70 && h <= 100 && s >= fS && v >= fV) felt[i] = 1;
  }
  return { blue, yellow, felt, S, V };
}

function closeRect(mask, w, h, kw, kh) {
  const f = Float64Array.from(mask);
  const d = rectFilter(f, w, h, kw, kh, true);
  const e = rectFilter(d, w, h, kw, kh, false);
  const out = new Uint8Array(w * h);
  for (let i = 0; i < out.length; i++) out[i] = e[i] > 0.5 ? 1 : 0;
  return out;
}

/** 外れ値を除きながら y = a x + b を当てはめる */
function fitLine(xs, ys, iters = 3, tol = 3) {
  let keep = new Array(xs.length).fill(true);
  let a = 0;
  let b = ys.length ? medianOf(ys) : 0;
  for (let it = 0; it < iters; it++) {
    const kx = [];
    const ky = [];
    for (let i = 0; i < xs.length; i++) if (keep[i]) { kx.push(xs[i]); ky.push(ys[i]); }
    if (kx.length < 5) break;
    [a, b] = polyfit1(kx, ky);
    const r = xs.map((x, i) => Math.abs(ys[i] - (a * x + b)));
    const rk = r.filter((_, i) => keep[i]);
    const med = medianOf(rk) + 1e-6;
    const lim = Math.max(tol, 3 * med);
    keep = r.map((v) => v < lim);
  }
  return { a, b, keep };
}

/** 帯の下端(0)〜面の下端(1)の間で、上面（明るい）から面（やや暗い）へ変わる位置 */
function ridgeFrac(small, aS, bS, aF, bF, L, R, S, V) {
  const steps = 61;
  const prof = new Array(steps).fill(NaN);
  const x0 = Math.trunc(L + (R - L) * 0.05);
  const x1 = Math.trunc(R - (R - L) * 0.05);
  for (let k = 0; k < steps; k++) {
    const f = (0.6 * k) / (steps - 1);
    const vals = [];
    for (let x = x0; x < x1; x++) {
      let yy = Math.trunc((aS * x + bS) * (1 - f) + (aF * x + bF) * f);
      yy = Math.min(Math.max(yy, 0), small.h - 1);
      const i = yy * small.w + x;
      if (S[i] < 70 && V[i] > 120) vals.push(V[i]);
    }
    if (vals.length > 20) prof[k] = medianOf(vals);
  }
  const ok = prof.map((v, i) => (Number.isNaN(v) ? -1 : i)).filter((i) => i >= 0);
  if (ok.length < 10) return 0.2;
  // 欠けたところは前後から補う（np.interp と同じ）
  for (let k = 0; k < steps; k++) {
    if (!Number.isNaN(prof[k])) continue;
    const after = ok.find((i) => i > k);
    const before = [...ok].reverse().find((i) => i < k);
    if (before === undefined) prof[k] = prof[after];
    else if (after === undefined) prof[k] = prof[before];
    else prof[k] = prof[before] + ((prof[after] - prof[before]) * (k - before)) / (after - before);
  }
  const sm = new Array(steps).fill(0);
  for (let k = 0; k < steps; k++) {
    let s = 0;
    for (let d = -2; d <= 2; d++) {
      const j = k + d;
      if (j >= 0 && j < steps) s += prof[j];
    }
    sm[k] = s / 5;
  }
  let best = Infinity;
  let bestJ = 5;
  for (let j = 5; j < 45; j++) {
    const g = sm[j + 1] - sm[j];
    if (g < best) {
      best = g;
      bestJ = j;
    }
  }
  return (0.6 * bestJ) / (steps - 1);
}

/**
 * img: { w, h, c: 3, data }（元の写真）
 * roi: 省略可。{ y0, y1 }（元画像の座標）で、その辺りにある列を優先する
 * 戻り値: { corners: [[x,y]×4], info } または null
 */
function findRow(img, roi = null, debug = null) {
  const k = WORK_W / img.w;
  const small = areaResize(img, WORK_W, Math.round(img.h * k));
  const w = small.w;
  const h = small.h;
  const hsv = hsvOf(small);
  // 普通の条件 → 枠の近くに見つからなければ、ゆるい条件（明るすぎる写真）で探し直す
  let found = findBand(small, w, h, k, roi, false, debug, hsv);
  if (!found || (roi && !found.best.inRoi)) {
    const f2 = findBand(small, w, h, k, roi, true, debug, hsv);
    if (f2 && (!found || f2.best.inRoi)) found = f2;
  }
  if (!found) return null;
  return traceRow(small, w, h, k, found.best, found.felt, hsv.S, hsv.V, roi);
}

function findBand(small, w, h, k, roi, relaxed, debug, hsv) {
  const { blue, yellow, felt, S, V } = masks(small, relaxed, hsv);
  let best = null;
  for (const [name, m] of [['blue', blue], ['yellow', yellow]]) {
    const mm = closeRect(m, w, h, 25, 3);
    const { labels, stats } = connectedComponents(mm, w, h);
    for (let i = 1; i < stats.length; i++) {
      const st = stats[i];
      const note = (why) => debug && debug.push({ color: name, x: st.x, y: st.y, w: st.w, h: st.h, why });
      if (st.w < 0.25 * w || st.h > 0.2 * h) {
        if (st.w >= 0.1 * w) note('size');
        continue;
      }
      const thick = [];
      for (let x = st.x; x < st.x + st.w; x++) {
        let t = 0;
        for (let y = st.y; y < st.y + st.h; y++) if (labels[y * w + x] === i) t++;
        if (t > 0) thick.push(t);
      }
      if (medianOf(thick) > 22) {
        note(`thick ${medianOf(thick)}`);
        continue;
      }
      const ys = st.y + st.h;
      let cnt = 0;
      let sum = 0;
      for (let y = Math.min(h - 1, ys + 5); y < Math.min(h, ys + 60); y++) {
        for (let x = st.x; x < st.x + st.w; x++) {
          sum += felt[y * w + x];
          cnt++;
        }
      }
      if (!cnt || sum / cnt > 0.5) {
        note(`felt-below ${(sum / Math.max(cnt, 1)).toFixed(2)}`);
        continue;
      }
      const bottom = st.y + st.h;
      const inRoi = roi ? bottom >= roi.y0 * k - 40 && bottom <= roi.y1 * k + 20 : true;
      note(`ok inRoi=${inRoi} bottom=${bottom}`);
      const cand = { color: name, idx: i, labels, st, bottom, inRoi, relaxed };
      if (!best || (cand.inRoi && !best.inRoi) || (cand.inRoi === best.inRoi && cand.bottom > best.bottom)) best = cand;
    }
  }
  return best ? { best, felt, S, V } : null;
}

/** 見つけた帯（背の色の細い帯）から、面の四隅をたどる */
function traceRow(small, w, h, k, best, felt, S, V, roi) {
  const { labels, idx, st } = best;
  const xs = [];
  const ybot = [];
  for (let x = st.x; x < st.x + st.w; x++) {
    let lo = -1;
    let hi = -1;
    for (let y = 0; y < h; y++) {
      if (labels[y * w + x] === idx) {
        if (lo < 0) lo = y;
        hi = y;
      }
    }
    if (lo >= 0) {
      xs.push(x);
      ybot.push(hi);
    }
  }
  const strip = fitLine(xs, ybot);
  const xsOk = xs.filter((_, i) => strip.keep[i]);
  if (!xsOk.length) return null;
  const xMin = Math.min(...xsOk);
  const xMax = Math.max(...xsOk);
  // 牌の下端: 帯の下から下へ進み、フェルトが4画素続き始める位置
  const fx = [];
  const fy = [];
  for (let x = xMin; x < xMax; x += 3) {
    let y = Math.trunc(strip.a * x + strip.b) + 4;
    let run = 0;
    while (y < h - 1) {
      if (felt[y * w + x]) {
        run++;
        if (run >= 4) {
          fx.push(x);
          fy.push(y - run + 1);
          break;
        }
      } else run = 0;
      y++;
    }
  }
  if (fx.length < 10) return null;
  const face = fitLine(fx, fy, 3, 4);
  const feltFrac = (f0, f1) => {
    const out = new Float64Array(w);
    for (let x = 0; x < w; x++) {
      const top = strip.a * x + strip.b;
      const bot = face.a * x + face.b;
      let y0 = Math.trunc(top + (bot - top) * f0);
      let y1 = Math.trunc(top + (bot - top) * f1);
      y0 = Math.max(0, y0);
      y1 = Math.min(h, Math.max(y1, y0 + 1));
      if (y1 <= y0) {
        out[x] = 1;
        continue;
      }
      let s = 0;
      for (let y = y0; y < y1; y++) s += felt[y * w + x];
      out[x] = s / (y1 - y0);
    }
    return out;
  };
  const cx = Math.trunc(medianOf(xsOk));
  const extent = (frac) => {
    const nf = Array.from(frac, (v) => v < 0.35);
    let L = cx;
    let run = 0;
    while (L > 0) {
      L -= 1;
      run = !nf[L] ? run + 1 : 0;
      if (run >= 6) {
        L += run;
        break;
      }
    }
    let R = cx;
    run = 0;
    while (R < w - 1) {
      R += 1;
      run = !nf[R] ? run + 1 : 0;
      if (run >= 6) {
        R -= run;
        break;
      }
    }
    return [L, R];
  };
  // 左右の端。フェルトが拾えない（明るすぎ・暗すぎ）と端が画像の縁まで走ってしまうので、
  // 読み取り枠があるときは枠の少し外までに抑える（手牌は枠の中に合わせてもらっている）
  const clampX = ([L, R]) => {
    if (!roi || roi.x0 == null || roi.x1 == null) return [L, R];
    const rw = (roi.x1 - roi.x0) * k;
    return [Math.max(L, roi.x0 * k - 0.08 * rw), Math.min(R, roi.x1 * k + 0.08 * rw)];
  };
  const [Lt, Rt] = clampX(extent(feltFrac(0.25, 0.55)));
  let [Lb, Rb] = clampX(extent(feltFrac(0.6, 0.92)));
  // 下端の左右は上端とほぼ同じ（低い角度で少し広がる程度）。フェルトの拾い方で下端だけ大きく外れたら上端に合わせる
  const lenT = Rt - Lt;
  if (lenT > 20) {
    Lb = Math.min(Math.max(Lb, Lt - 0.12 * lenT), Lt + 0.04 * lenT);
    Rb = Math.max(Math.min(Rb, Rt + 0.12 * lenT), Rt - 0.04 * lenT);
  }
  const rf = ridgeFrac(small, strip.a, strip.b, face.a, face.b, Lt, Rt, S, V);
  const aR = strip.a + (face.a - strip.a) * rf;
  const bR = strip.b + (face.b - strip.b) * rf;
  const pt = (x, a, b) => [x / k, (a * x + b) / k];
  const corners = [pt(Lt, aR, bR), pt(Rt, aR, bR), pt(Rb, face.a, face.b), pt(Lb, face.a, face.b)];
  return { corners, info: { color: best.color, relaxed: !!best.relaxed, ridge: rf, scale: k, xRange: [Lt / k, Rt / k, Lb / k, Rb / k] } };
}

/**
 * 牌の背の帯が見つからないとき用: 読み取り枠の中から「白っぽい牌が並ぶ帯」を探して四隅にする
 * roi: { x0, x1, y0, y1 }（元画像の座標）
 */
function refineRoi(img, roi) {
  const x0 = Math.max(0, Math.floor(roi.x0));
  const x1 = Math.min(img.w, Math.ceil(roi.x1));
  const y0 = Math.max(0, Math.floor(roi.y0));
  const y1 = Math.min(img.h, Math.ceil(roi.y1));
  const w0 = x1 - x0;
  const h0 = y1 - y0;
  if (w0 < 20 || h0 < 10) return null;
  const W = Math.min(800, w0);
  const H = Math.max(8, Math.round((h0 * W) / w0));
  const small = areaResize(img, W, H, { x: x0, y: y0, w: w0, h: h0 });
  const { S, V } = hsvOf(small);
  // 「白い面」の明るさは写真の明るさに合わせる（暗い写真では 120 を切る）。枠の中でいちばん明るい側の 62% を目安に
  const thV = Math.min(150, Math.max(70, 0.62 * percentile(V, 95)));
  const white = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) white[i] = V[i] > thV && S[i] < 70 ? 1 : 0;
  // 手牌の列の傾き（写真が少し斜め）。傾いたまま水平の帯で切ると、片側の牌の上端（萬子の「三」の上の線など）が欠ける
  const tilt = estimateTilt(white, W, H);
  const dyOf = (x) => Math.round((x - W / 2) * tilt);
  // 行ごとの「牌らしさ」も同じ考え方（筒子ばかりの手牌は白い画素が半分を切ることがある）。
  // 行は傾きに沿って数える（傾きがなければ水平の行）
  const rowFrac = new Float64Array(H);
  for (let y = 0; y < H; y++) {
    let sw = 0;
    let ss = 0;
    let cnt = 0;
    for (let x = 0; x < W; x++) {
      const yy = y + dyOf(x);
      if (yy < 0 || yy >= H) continue;
      const i = yy * W + x;
      cnt++;
      sw += white[i];
      if (S[i] >= 80 && V[i] >= 40) ss++;
    }
    if (cnt < W / 2) continue; // 傾けた行が枠の外に大きくはみ出す（端の行）
    const wf = sw / cnt;
    const sf = ss / cnt;
    rowFrac[y] = wf >= 0.45 || (sf <= 0.35 && wf >= 0.15) ? 1 : 0;
  }
  const run = longestRun(rowFrac, 0.5, 2);
  if (!run || run[1] - run[0] < 4) return null;
  const [ra, rb] = run;
  // 列ごとの「牌らしさ」: 白い画素が多い列。絵柄が濃い列（萬子の文字・9筒など）は白が減るので、
  // 「卓の色（彩度が高い）がほとんどなく、白も少しある」列も牌の列とみなす（小さな動画のコマ対策）
  const colFrac = new Float64Array(W);
  for (let x = 0; x < W; x++) {
    let sw = 0;
    let ss = 0;
    let n = 0;
    for (let y = ra; y <= rb; y++) {
      const yy = y + dyOf(x);
      if (yy < 0 || yy >= H) continue;
      const i = yy * W + x;
      n++;
      sw += white[i];
      if (S[i] >= 80 && V[i] >= 40) ss++;
    }
    if (!n) continue;
    const wf = sw / n;
    const sf = ss / n;
    colFrac[x] = wf >= 0.35 || (sf <= 0.35 && wf >= 0.12) ? 1 : 0;
  }
  const cr = longestRun(colFrac, 0.5, Math.max(2, Math.round(W * 0.03)));
  if (!cr || cr[1] - cr[0] < 10) return null;
  const k = w0 / W;
  const px = (x) => x0 + x * k;
  const py = (y) => y0 + y * k;
  const L = cr[0];
  const R = cr[1] + 1;
  const off = (x) => (x - W / 2) * tilt; // 傾きの分だけ上下にずらす（傾きがなければ 0）
  return [[px(L), py(ra + off(L))], [px(R), py(ra + off(R))], [px(R), py(rb + 1 + off(R))], [px(L), py(rb + 1 + off(L))]];
}

const TILT_MAX = 0.08; // 探す傾きの範囲（tan。±4.6度）
const TILT_STEP = 0.0025;
const TILT_GAIN = 1.03; // 水平より 3% 以上くっきりするときだけ傾ける（ほぼ水平の列はこれまでどおり）

/**
 * 白い面の画素を、傾き t（tan）に沿って行ごとに足し合わせ、行の数の2乗和がいちばん大きくなる t を選ぶ
 * （文書の傾き補正と同じ考え方。傾きが合うと面の上端・下端がそろって、行ごとの数が「0 か満杯」に分かれる）
 */
function estimateTilt(white, W, H) {
  const pad = Math.ceil((W / 2) * TILT_MAX) + 1;
  const prof = new Float64Array(H + 2 * pad);
  const energy = (t) => {
    prof.fill(0);
    for (let x = 0; x < W; x++) {
      const d = Math.round((x - W / 2) * t);
      for (let y = 0; y < H; y++) if (white[y * W + x]) prof[y - d + pad]++;
    }
    let e = 0;
    for (let i = 0; i < prof.length; i++) e += prof[i] * prof[i];
    return e;
  };
  const e0 = energy(0);
  let best = 0;
  let bestE = e0;
  for (let t = -TILT_MAX; t <= TILT_MAX + 1e-9; t += TILT_STEP) {
    if (Math.abs(t) < TILT_STEP / 2) continue;
    const e = energy(t);
    if (e > bestE) {
      bestE = e;
      best = t;
    }
  }
  return bestE >= e0 * TILT_GAIN ? best : 0;
}

/** 値がしきい値以上で続く、いちばん長い区間（gap 以下の途切れはつなぐ） */
function longestRun(arr, th, gap = 0) {
  let best = null;
  let start = -1;
  let last = -1;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] >= th) {
      if (start < 0 || i - last - 1 > gap) {
        if (start >= 0 && (!best || last - start > best[1] - best[0])) best = [start, last];
        start = i;
      }
      last = i;
    }
  }
  if (start >= 0 && (!best || last - start > best[1] - best[0])) best = [start, last];
  return best;
}

// ---- src/recognition/cuts.js ----
// 手牌の列をまっすぐにして、牌1枚ずつに区切る。ml/rowcut.py（rectify / gap_score / ink_mask / fit_cuts）と同じ考え方
//   帯は「行の長さ」をそのまま使う大きさで作り、枚数 n ごとに区切りを当てはめて比べる


const TW = 60; // 牌1枚ぶんの幅（学習データを作るときの大きさ）
const TH = 80; // 牌の面の高さ

/** 四隅 → 幅 coreW＋左右の余白 margin、高さ H の帯 */
function rectifyTo(img, corners, coreW, H, margin) {
  const W = Math.round(coreW + 2 * margin);
  const M = perspectiveMatrix(corners, [[margin, 0], [margin + coreW, 0], [margin + coreW, H], [margin, H]]);
  return warpBilinear(img, M, W, Math.round(H));
}

/**
 * 列ごとの「すき間らしさ」（縦に続く暗い線ほど高い）。
 * ink（図柄のマスク）を渡すと、図柄の画素の応答を除く。索子の竹のような縦の線が
 * すき間より強く出て、牌の境目が埋もれてしまうのを防ぐ（ぴったり並んだ牌ほど境目は薄い）
 */
function gapScore(strip, ink = null) {
  const { w, h } = strip;
  const g = grayOf(strip).data;
  const tmp = new Float64Array(w * h);
  const blur = new Float64Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const l = g[y * w + (x > 0 ? x - 1 : Math.min(1, w - 1))];
      const r = g[y * w + (x < w - 1 ? x + 1 : Math.max(w - 2, 0))];
      tmp[y * w + x] = 0.25 * l + 0.5 * g[y * w + x] + 0.25 * r;
    }
  }
  for (let y = 0; y < h; y++) {
    const up = y > 0 ? y - 1 : Math.min(1, h - 1);
    const dn = y < h - 1 ? y + 1 : Math.max(h - 2, 0);
    for (let x = 0; x < w; x++) blur[y * w + x] = 0.25 * tmp[up * w + x] + 0.5 * tmp[y * w + x] + 0.25 * tmp[dn * w + x];
  }
  const k = Math.max(2, Math.round((5 * h) / TH));
  const y0 = Math.trunc(h * 0.12);
  const y1 = Math.trunc(h * 0.88);
  const out = new Float64Array(w);
  const col = new Float64Array(y1 - y0);
  for (let x = 0; x < w; x++) {
    if (x < k || x >= w - k) {
      out[x] = 0;
      continue;
    }
    let n = 0;
    for (let y = y0; y < y1; y++) {
      if (ink && (ink[y * w + x] || ink[y * w + Math.max(0, x - 2)] || ink[y * w + Math.min(w - 1, x + 2)])) continue;
      const c = blur[y * w + x];
      const l = blur[y * w + (x - k)];
      const r = blur[y * w + (x + k)];
      col[n++] = Math.min(l, r) - c;
    }
    // 図柄を除いた行が半分未満なら、その列はすき間ではない
    out[x] = n >= (y1 - y0) / 2 ? Math.max(medianOf(col.subarray(0, n)), 0) : 0;
  }
  return out;
}

/** 図柄（インク）らしい画素 */
function inkMask(strip) {
  const { w, h } = strip;
  const g = grayOf(strip).data;
  const { H, S, V } = hsvOf(strip);
  const k = Math.max(5, 2 * Math.round((17 * h) / TH / 2) + 1);
  const bgD = ellipseFilter(g, w, h, k, true);
  const bg = ellipseFilter(bgD, w, h, k, false);
  const m = new Float64Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const dark = bg[i] - g[i] > 35;
    const table = H[i] >= 35 && H[i] <= 100 && S[i] > 50;
    const red = (H[i] <= 12 || H[i] >= 160) && S[i] > 70 && V[i] > 50;
    const blue = H[i] >= 100 && H[i] <= 135 && S[i] > 80 && V[i] < 200;
    m[i] = (dark && !table) || red || blue ? 1 : 0;
  }
  const ow = Math.max(2, Math.round((4 * h) / TH));
  const e = rectFilter(m, w, h, ow, 1, false);
  return rectFilter(e, w, h, ow, 1, true);
}

function inkProfile(strip, mask = null) {
  const { w, h } = strip;
  const m = mask || inkMask(strip);
  const y0 = Math.trunc(h * 0.1);
  const y1 = Math.trunc(h * 0.9);
  const out = new Float64Array(w);
  for (let x = 0; x < w; x++) {
    let s = 0;
    for (let y = y0; y < y1; y++) s += m[y * w + x];
    out[x] = s / (y1 - y0);
  }
  return out;
}

/** すき間らしさ − 図柄の上を切る罰。帯から1回だけ作って、枚数ごとの当てはめに使い回す */
function cutProfile(strip, snap = 3) {
  const W = strip.w;
  const mask = inkMask(strip);
  // すき間らしさは図柄の画素も含めて計る（除くと、竹の線が多い手牌で境目の当てはめが崩れた）。
  // 図柄の縦線が境目より強く出る写真は、あとで分類器の自信で区切りを微調整する（reader.js refineCuts）
  const gs = gapScore(strip);
  let mx = 0;
  for (let i = 0; i < W; i++) mx = Math.max(mx, gs[i]);
  const ink = inkProfile(strip, mask);
  const col = new Float64Array(W);
  for (let i = 0; i < W; i++) col[i] = gs[i] / (mx + 1e-6) - 2 * ink[i];
  const near = new Float64Array(W);
  for (let i = 0; i < W; i++) {
    let v = -Infinity;
    for (let d = -snap; d <= snap; d++) v = Math.max(v, col[Math.min(W - 1, Math.max(0, i + d))]);
    near[i] = v;
  }
  return { col, near, snap };
}

/**
 * n枚ぶんの区切り n+1 本を「1次元の射影変換」で当てはめる（同じ幅の牌が遠近で少しずつ細くなる形）
 * prof: cutProfile の結果、core: [左端, 右端]（帯の中での面の範囲）
 * 戻り値 { cuts, score }（score は区切り1本あたり）
 */
function fitCuts(prof, n, core, { reach = 0.35, prior = 3, rPen = 2 } = {}) {
  const { col, near, snap } = prof;
  const W = col.length;
  const [c0, c1] = core;
  const tw = (c1 - c0) / n;
  const lo = Math.max(0, Math.trunc(c0 - reach * tw));
  const hi = Math.min(W - 1, Math.trunc(c1 + reach * tw));
  const rs = [];
  for (let i = 0; i < 29; i++) rs.push(Math.exp(Math.log(0.5) + ((Math.log(2) - Math.log(0.5)) * i) / 28));
  const t = [];
  for (let i = 0; i <= n; i++) t.push(i / n);
  let best = { score: -Infinity, X: null };
  for (const r of rs) {
    const C = 1 / Math.sqrt(r) - 1;
    const u = t.map((tt) => (tt / (C * tt + 1)) * (C + 1));
    const rp = rPen * Math.abs(Math.log(r));
    for (let x0 = lo; x0 <= Math.trunc(c0 + reach * tw); x0++) {
      for (let xN = Math.max(x0 + n, Math.trunc(c1 - reach * tw)); xN <= hi; xN++) {
        const width = (xN - x0) / n;
        if (!(width > 0.6 * tw && width < 1.5 * tw)) continue;
        const drift = (Math.abs(x0 - c0) + Math.abs(xN - c1)) / tw;
        let s = 0;
        const X = new Array(n + 1);
        for (let i = 0; i <= n; i++) {
          const x = x0 + (xN - x0) * u[i];
          X[i] = x;
          s += near[Math.min(W - 1, Math.max(0, roundHalfEven(x)))];
        }
        s = s / (n + 1) - (rp + prior * drift) / (n + 1);
        if (s > best.score) best = { score: s, X };
      }
    }
  }
  if (!best.X) return { cuts: null, score: -Infinity };
  const cuts = best.X.map((x) => {
    const xi = roundHalfEven(x);
    const a = Math.max(0, xi - snap);
    const b = Math.min(W, xi + snap + 1);
    let bi = a;
    for (let i = a; i < b; i++) if (col[i] > col[bi]) bi = i;
    return bi;
  });
  return { cuts, score: best.score };
}


/**
 * 牌1枚の幅を、すき間の並びの周期（自己相関）から見積もる。
 * 面の縦横比は撮る角度で大きく変わる（低い角度ほど横長）が、同じ幅の牌が等間隔に並ぶことは変わらないので、
 * 縦横比の決め打ちより枚数の見積もりが安定する。戻り値 { width, strength }（strength は周期のはっきりさ 0〜1）
 */
function estimateTileWidth(prof, core, minW, maxW) {
  const { col } = prof;
  const [c0, c1] = core;
  const a = Math.max(0, Math.trunc(c0));
  const b = Math.min(col.length, Math.trunc(c1));
  const n = b - a;
  if (n < 3 * minW) return { width: 0, strength: 0 };
  // すき間らしさだけ（図柄の罰を除いた正の部分）を平均0にして相関をとる
  const g = new Float64Array(n);
  let mean = 0;
  for (let i = 0; i < n; i++) {
    g[i] = Math.max(col[a + i], 0);
    mean += g[i];
  }
  mean /= n;
  let var0 = 0;
  for (let i = 0; i < n; i++) {
    g[i] -= mean;
    var0 += g[i] * g[i];
  }
  if (var0 <= 0) return { width: 0, strength: 0 };
  const lo = Math.max(2, Math.trunc(minW));
  const hi = Math.min(Math.trunc(n / 2), Math.trunc(maxW));
  const ac = [];
  for (let lag = lo; lag <= hi; lag++) {
    let sum = 0;
    for (let i = 0; i + lag < n; i++) sum += g[i] * g[i + lag];
    ac.push(sum / var0);
  }
  if (!ac.length) return { width: 0, strength: 0 };
  let bi = 0;
  for (let i = 1; i < ac.length; i++) if (ac[i] > ac[bi]) bi = i;
  // 周期の半分（すき間を1つおきに数える）で同じくらい高いなら、はっきりしない
  const width = lo + bi;
  const half = Math.round(width / 2) - lo;
  const halfV = half >= 0 && half < ac.length ? ac[half] : -1;
  const sorted = ac.slice().sort((x, y) => x - y);
  const med = sorted[Math.trunc(sorted.length / 2)];
  const strength = Math.max(0, Math.min(1, (ac[bi] - Math.max(med, halfV)) / Math.max(ac[bi], 1e-6)));
  return { width, strength, peak: ac[bi] };
}

// ---- src/recognition/classifier.js ----
// 牌1枚の見分け（小さなニューラルネット: 1164 → 128 → 種類）。重みは ml/export_model.py が作る
//   入力: 特徴量（1164）→ 平均と幅でそろえる → 隠れ層（ReLU）→ 出力（softmax）
//   重みは1バイトに丸めて持つ（列ごとの倍率つき）


function b64ToBytes(b64) {
  if (typeof atob === 'function') {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  return new Uint8Array(Buffer.from(b64, 'base64'));
}

const f32 = (b64) => new Float32Array(b64ToBytes(b64).buffer);
const i8 = (b64) => new Int8Array(b64ToBytes(b64).buffer);

class TileModel {
  constructor(json) {
    const m = typeof json === 'string' ? JSON.parse(json) : json;
    this.dim = m.dim || FEATURE_DIM;
    this.hidden = m.hidden;
    this.classes = m.classes;
    this.mean = f32(m.mean);
    this.scale = f32(m.scale);
    this.w1 = i8(m.w1);
    this.s1 = f32(m.s1);
    this.b1 = f32(m.b1);
    this.w2 = i8(m.w2);
    this.s2 = f32(m.s2);
    this.b2 = f32(m.b2);
    this.note = m.note || '';
  }

  /** 特徴量 → それぞれの種類の確率 */
  probs(feat) {
    const { dim, hidden, classes } = this;
    const z = new Float32Array(dim);
    for (let i = 0; i < dim; i++) z[i] = (feat[i] - this.mean[i]) / this.scale[i];
    const hvec = new Float32Array(hidden);
    for (let j = 0; j < hidden; j++) {
      let s = 0;
      const off = j * dim;
      for (let i = 0; i < dim; i++) s += z[i] * this.w1[off + i];
      const v = s * this.s1[j] + this.b1[j];
      hvec[j] = v > 0 ? v : 0;
    }
    const out = new Float32Array(classes.length);
    let mx = -Infinity;
    for (let k = 0; k < classes.length; k++) {
      let s = 0;
      const off = k * hidden;
      for (let j = 0; j < hidden; j++) s += hvec[j] * this.w2[off + j];
      out[k] = s * this.s2[k] + this.b2[k];
      if (out[k] > mx) mx = out[k];
    }
    let sum = 0;
    for (let k = 0; k < out.length; k++) {
      out[k] = Math.exp(out[k] - mx);
      sum += out[k];
    }
    for (let k = 0; k < out.length; k++) out[k] /= sum;
    return out;
  }

  /** 牌の画像（40×56）→ { id, p, top: [{ id, p }×3] } */
  read(tileImg) {
    const p = this.probs(featuresV4(tileImg));
    const order = [...p.keys()].sort((a, b) => p[b] - p[a]);
    return {
      id: this.classes[order[0]],
      p: p[order[0]],
      top: order.slice(0, 3).map((k) => ({ id: this.classes[k], p: p[k] })),
    };
  }
}

// ---- src/recognition/reader.js ----
// 写真1枚 → 手牌の並び（端末内で完結する読み取り）
//   1. 手牌の列を見つける（rowfind） 2. 枚数ごとに区切って比べる（cuts） 3. 牌ごとに見分ける（classifier）





const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
// まっすぐにした帯での「牌1枚の幅 ÷ 面の高さ」。真上に近いほど小さく、低い角度ほど大きい（手元の写真で 0.74〜1.14）。
// 決め打ちの1点ではなく、この範囲の外に出たときだけ減点する（範囲の中は枚数を「すき間の並び」だけで決める）
const ASPECT_LO = 0.7;
const ASPECT_HI = 1.45;
const ASPECT_SEARCH = [0.5, 1.7]; // 枚数の候補を出す範囲
const MAX_TILES = 18; // 1列に並ぶ牌の上限（槓子を含む手牌でも18枚まで）
// 手牌の列としてありえない細長さ（行の長さ ÷ 面の高さ）。18枚を低い角度（1枚の幅＝面の高さ×1.7）で並べてもこれ以下。
// 牌の下の縁など、面ではない細い帯を拾ったときに、何十枚もの牌（白など）として読んでしまうのを防ぐ
const MAX_ROW_RATIO = MAX_TILES * ASPECT_SEARCH[1];
const SHAPE_PEN = 1.2; // 範囲の外に出たときの減点（log 距離の2乗に掛ける）
const SHAPE_PULL = 0.03; // 同点のときに普通の形（1.0）を選ぶための小さな傾き
const CONF_W = 1.5; // 読み取りの自信をどれだけ重く見るか
const FLOWER = 37; // 花牌
const FLOWER_MIN_P = 0.8; // 花牌と決めるのに必要な自信（手牌から外してしまうので高めにする）
// 縦方向の合わせ直し: 面の上端・下端の見積もりがずれると（明るい写真で起きやすい）図柄の上下が切れて読み違える。
// 帯を上下に EXT だけ広く作っておき、切り出す窓を上下にずらし・伸縮して、いちばん自信の高い位置を選ぶ
const EXT = 0.3;
const V_OFFSETS = [-0.16, -0.08, 0, 0.08, 0.16];
const V_SCALES = [0.85, 1, 1.15];
const V_PRIOR = 0.04; // 窓を動かすことへの小さな減点（自信が同じなら元の位置）
// 枚数の違う次点が、面の窓（nominal）での質でこの差より近いときは、次点も窓の合わせ直し・区切りの微調整まで
// してから比べる（いちばん良い枚数に合わせた窓だけで読み比べると、次点の枚数が不利になる。
// v0.31 の学習の候補で、ネットの小さな写真の14枚を、2枚ずつまとめた7枚と読んだ: 面の窓では 7枚 -0.125・14枚 -0.270、
// 窓を合わせ直すと 7枚 0.027・14枚 0.042）
const RUNNER_MARGIN = 0.2;
// 区切りの中点（＝牌の真ん中）が「すき間らしい」ときの減点。2枚を1枚として区切る（14枚を7枚と数える）間違いを防ぐ。
// 牌の真ん中には図柄があるので、すき間らしさは低い（手元の141枚で、正しい枚数なら中点の平均が -0.08 以下・ふつうは -0.3 以下）。
// 半分の枚数で区切ると、中点が本当のすき間に来る（中央値 +0.06）。真上から撮った小さな写真では、半分の枚数のほうが
// 区切りのすき間らしさ（score）が高くなることがあり、分類器も2枚まとめた切り出しに自信を持つことがあった
const MID_T = -0.3;
const MID_PEN = 0.6;

/**
 * 花牌の扱い。opts.flowers === false（花牌を使わない設定）なら候補から丸ごと外す。
 * 使う設定でも、自信のない花牌は次の候補（花牌でない牌）として読む
 */
function flowerGuard(r, opts) {
  const off = opts.flowers === false;
  const top = off ? r.top.filter((c) => c.id !== FLOWER) : r.top;
  const minP = off ? Infinity : opts.flowerMinP != null ? opts.flowerMinP : FLOWER_MIN_P;
  if (r.id !== FLOWER || r.p >= minP) return off ? { ...r, top } : r;
  const alt = top.find((c) => c.id !== FLOWER);
  return alt ? { ...r, id: alt.id, p: alt.p, top } : { ...r, top };
}

/** 見つけた列が、読み取り枠とだいたい重なっているか */
function nearRoi(corners, roi) {
  const ys = corners.map((p) => p[1]);
  const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const h = Math.max(1, roi.y1 - roi.y0);
  if (cy < roi.y0 - 0.5 * h || cy > roi.y1 + 0.5 * h) return false;
  if (roi.x1 != null) {
    const xs = corners.map((p) => p[0]);
    const width = Math.max(...xs) - Math.min(...xs);
    if (width < 0.4 * (roi.x1 - roi.x0)) return false;
  }
  return true;
}

/**
 * 読み取った並びが「手牌」としてありえるか。
 * 手牌でない写真（風景・人物など）でも分類器は必ず何かの牌を答えてしまうため、
 * 並びの構造（列が見つかったか・区切りのはっきりさ）と、牌の組み合わせの可否で判断する。
 *   返り値 { ok, reason }  reason: noRow | tooFew | impossible | unsure
 */
function checkHand(r, opts = {}) {
  if (!r || !r.ok) return { ok: false, reason: 'noRow' };
  const melds = opts.melds | 0;
  const minP = opts.minP != null ? opts.minP : 0.45;
  const tiles = r.tiles || [];
  const n = tiles.length;
  // 1) 牌の列を見つけられず、牌どうしの区切りもはっきりしない（＝並んだ牌が写っていない）
  if (r.source === 'fallback' && r.gap < (opts.minGap != null ? opts.minGap : 0)) return { ok: false, reason: 'noRow' };
  // 2) 手牌として少なすぎる（鳴きを入れても足りない）
  if (n < 7 - 3 * melds) return { ok: false, reason: 'tooFew' };
  // 3) 同じ牌が5枚以上（麻雀の牌としてありえない）。
  //    赤5は卓によって各色2枚・3枚・全部赤もあるので、同じ赤5が何枚あっても止めない（5枚以上だけ見る）
  const counts = new Map();
  for (const t of tiles) {
    if (t.p < minP || t.id == null || t.id === FLOWER) continue;
    const base = t.id >= 34 && t.id <= 36 ? [4, 13, 22][t.id - 34] : t.id;
    counts.set(base, (counts.get(base) || 0) + 1);
  }
  for (const [, v] of counts) if (v >= 5) return { ok: false, reason: 'impossible' };
  // 4) 自信のない牌が半分以上
  if (n && tiles.filter((t) => t.p < minP).length >= n / 2) return { ok: false, reason: 'unsure' };
  return { ok: true };
}

/** 四隅から、行の長さと面の高さ（元画像の画素） */
function rowSize(corners) {
  const len = (dist(corners[0], corners[1]) + dist(corners[3], corners[2])) / 2;
  const height = (dist(corners[0], corners[3]) + dist(corners[1], corners[2])) / 2;
  return { len, height };
}

/** 四隅が手牌の列としてありえる形か（面の高さに対して長すぎる細い帯ではないか） */
function plausibleRow(corners) {
  const { len, height } = rowSize(corners);
  return height > 4 && len / height <= MAX_ROW_RATIO;
}

/** 帯（大きめ）から、区切りごとの牌の画像（40×56）を切り出す。y0/h で縦の窓を指定できる */
function cropFrom(strip, cuts, y0 = 0, h = strip.h) {
  const out = [];
  const yy = Math.max(0, Math.min(strip.h - 1, Math.round(y0)));
  const hh = Math.max(1, Math.min(strip.h - yy, Math.round(h)));
  for (let i = 0; i < cuts.length - 1; i++) {
    const a = Math.max(0, Math.min(strip.w - 1, Math.round(cuts[i])));
    const b = Math.max(a + 1, Math.min(strip.w, Math.round(cuts[i + 1])));
    out.push(toU8(areaResize(strip, TILE_W, TILE_H, { x: a, y: yy, w: b - a, h: hh })));
  }
  return out;
}

/** 四隅を上下に ext（面の高さに対する割合）だけ広げる */
function extendCorners(c, ext) {
  const [tl, tr, br, bl] = c;
  const up = (a, b) => [a[0] + (a[0] - b[0]) * ext, a[1] + (a[1] - b[1]) * ext];
  return [up(tl, bl), up(tr, br), up(br, tr), up(bl, tl)];
}

/**
 * 区切りの位置を分類器の自信で微調整する（左端 x0・右端 xN・遠近の比 r の座標降下）。
 * 牌どうしがぴったり並んで境目が薄い写真（黄色い背のセットなど）では、すき間の見え方だけだと
 * 区切りが少しずつずれて、図柄の半分だけの切り出しになってしまう。牌は同じ幅で等間隔に並ぶので、
 * 3つの数だけを動かして「全部の牌がいちばん牌らしく見える」位置を探す
 */
function refineCuts(model, strip, cuts, scale, y0, h) {
  const n = cuts.length - 1;
  if (n < 2 || !model) return null;
  const w0 = cuts[1] - cuts[0];
  const wN = cuts[n] - cuts[n - 1];
  const mk = (x0, xN, r) => {
    const C = 1 / Math.sqrt(r) - 1;
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      out.push(x0 + (xN - x0) * ((t / (C * t + 1)) * (C + 1)));
    }
    return out;
  };
  const evalC = (cs) => readCrops(model, strip, cs.map((v) => v * scale), y0, h).conf;
  let best = { x0: cuts[0], xN: cuts[n], r: Math.min(2, Math.max(0.5, wN / Math.max(1, w0))) };
  best.conf = evalC(mk(best.x0, best.xN, best.r));
  const tw = (best.xN - best.x0) / n;
  // 粗く → 細かく。1段あたり 6回の読み比べ（x0・xN・r をそれぞれ ±）
  for (const step of [0.06, 0.03]) {
    for (const [key, deltas] of [['x0', [-step * tw, step * tw]], ['xN', [-step * tw, step * tw]], ['r', [-step, step]]]) {
      for (const d of deltas) {
        const cand = { ...best };
        cand[key] += d;
        if (cand.r < 0.5 || cand.r > 2 || cand.xN - cand.x0 < n * 4) continue;
        cand.conf = evalC(mk(cand.x0, cand.xN, cand.r));
        if (cand.conf > best.conf + 0.003) best = cand;
      }
    }
  }
  return { cuts: mk(best.x0, best.xN, best.r), conf: best.conf };
}

/** 区切りの中点での「すき間らしさ」（cutProfile の near）の平均 */
function midGap(prof, cuts) {
  const W = prof.near.length;
  let s = 0;
  for (let i = 0; i + 1 < cuts.length; i++) {
    const x = Math.round((cuts[i] + cuts[i + 1]) / 2);
    s += prof.near[Math.min(W - 1, Math.max(0, x))];
  }
  return cuts.length > 1 ? s / (cuts.length - 1) : 0;
}

/** 切り出し → 読み取り → 平均の自信（log p の平均） */
function readCrops(model, strip, cuts, y0, h) {
  const crops = cropFrom(strip, cuts, y0, h);
  const reads = model ? crops.map((t) => model.read(t)) : crops.map(() => ({ id: null, p: 0, top: [] }));
  const conf = reads.length ? reads.reduce((s, r) => s + Math.log(Math.max(r.p, 1e-6)), 0) / reads.length : -10;
  return { crops, reads, conf };
}

/**
 * img: { w, h, c: 3, data }（RGB、写真そのまま）
 * opts.model: TileModel、opts.roi: { y0, y1 }、opts.corners: 四隅を指定するとき、opts.fallback: 見つからないときの四隅
 * 戻り値: { ok, tiles: [{ id, p, top }], corners, n, source, confidence }
 */
function readHand(img, opts = {}) {
  const cands = [];
  if (opts.corners) cands.push({ corners: opts.corners, source: 'corners' });
  else {
    let found = findRow(img, opts.roi || null);
    // 牌の下の縁のような細い帯を拾ったとき（手牌の列としてありえない細長さ）は、見つからなかったものとして扱い、
    // 枠の中の候補で読む（切り抜いた写真で、面の下の縁を「牌の背の帯」と取り違えることがある）
    if (found && !plausibleRow(found.corners)) found = null;
    // 枠から離れていても、見つかった手牌の列は候補にする（枠は「だいたいこのあたり」の目安）
    const far = found && opts.roi && !nearRoi(found.corners, opts.roi);
    if (found) cands.push({ corners: found.corners, source: far ? 'auto-far' : 'auto' });
    if (opts.roi && (!found || far)) {
      // 枠の中で「白い牌が並ぶ帯」を探して使う（平置きの牌など、背の色が見えないとき）。
      // 自動検出が枠から遠いときは、別の物を拾った可能性があるので、枠の中の候補とも読み比べる
      const rr = refineRoi(img, opts.roi);
      if (rr) cands.push({ corners: rr, source: 'roi' });
      else if (opts.fallback) cands.push({ corners: opts.fallback, source: 'fallback' });
    }
    if (!cands.length && opts.fallback) cands.push({ corners: opts.fallback, source: 'fallback' });
  }
  if (!cands.length) return { ok: false, reason: 'row-not-found' };
  let best = null;
  for (const c of cands) {
    const r = readWithCorners(img, c.corners, c.source, opts);
    if (!best || (r.ok && (!best.ok || r.quality > best.quality))) best = r;
  }
  return best;
}

function readWithCorners(img, corners, source, opts) {
  const model = opts.model;
  const { len, height } = rowSize(corners);
  if (!(len > 10) || !(height > 4)) return { ok: false, reason: 'row-too-small' };
  // 解析用の帯（高さ TH、行の長さはそのままの比率）
  const coreW = Math.max(TW, Math.round((len * TH) / height));
  const margin = Math.round(TH * 0.5);
  const strip = rectifyTo(img, corners, coreW, TH, margin);
  const prof = cutProfile(strip);
  const core = [margin, margin + coreW];
  // 枚数の候補: 牌1枚の幅÷面の高さ が ASPECT_SEARCH に入る範囲をすべて試す
  // （以前は縦横比の決め打ち ±数枚だったため、低い角度の写真で正しい枚数が候補から外れていた）
  const nEst = Math.max(1, Math.round(coreW / TH));
  const nLo = Math.max(1, Math.ceil(coreW / (TH * ASPECT_SEARCH[1])));
  const nHi = Math.min(MAX_TILES, Math.floor(coreW / (TH * ASPECT_SEARCH[0])));
  // 18枚を超える細長さの帯は手牌の列ではない（候補を出すと、何十枚もの牌として読んでしまう）
  if (!opts.nOnly && nLo > MAX_TILES) return { ok: false, reason: 'row-shape' };
  const per = opts.period === false ? null : estimateTileWidth(prof, core, TH * 0.45, TH * 1.8);
  const fits = [];
  for (let n = opts.nOnly || nLo; n <= (opts.nOnly || Math.max(nLo, nHi)); n++) {
    const f = fitCuts(prof, n, core);
    if (!f.cuts) continue;
    const a = coreW / n / TH;
    const la = Math.log(a);
    // 普通の形の範囲の外に出たときだけ減点。中では「普通の形」へのごく小さな傾きだけ
    const outside = la < Math.log(ASPECT_LO) ? Math.log(ASPECT_LO) - la : la > Math.log(ASPECT_HI) ? la - Math.log(ASPECT_HI) : 0;
    const mid = midGap(prof, f.cuts);
    fits.push({ n, ...f, mid, adj: f.score - SHAPE_PEN * outside * outside - SHAPE_PULL * Math.abs(la) - MID_PEN * Math.max(0, mid - MID_T) });
  }
  if (!fits.length) return { ok: false, reason: 'no-cuts' };
  fits.sort((a, b) => b.adj - a.adj);
  // 上位の候補だけ、実際に牌を読んで自信の高いほうを選ぶ。
  // 帯は上下に EXT だけ広く作り（bigH = TH×(1+2EXT)）、面の位置は窓 [y0, y0+h) で切り出す
  const scale = Math.min(3, Math.max(1, len / Math.max(nEst, 1) / TW));
  const ext = opts.vsearch === false ? 0 : EXT;
  const bigH = Math.round(TH * scale * (1 + 2 * ext));
  const big = rectifyTo(img, extendCorners(corners, ext), Math.round(coreW * scale), bigH, Math.round(margin * scale));
  const faceH = TH * scale;
  const y0Base = ext * faceH;
  const evalFit = (f, y0, h) => {
    const r = readCrops(model, big, f.cuts.map((c) => c * scale), y0, h);
    return { ...f, ...r, quality: f.adj + CONF_W * r.conf, y0, h };
  };
  const top = fits.slice(0, opts.tryTop || 12);
  // 上位の候補を、面の窓（nominal）で読む
  const evals = top.map((f) => evalFit(f, y0Base, faceH));
  /** start から、窓の合わせ直しと区切りの微調整をして、いちばん良い読み方を返す */
  const settle = (start) => {
    let best = start;
    if (ext > 0 && model) {
      // 縦の合わせ直し: いちばん良い区切りで窓をずらし・伸縮して、自信がはっきり上がる位置があれば採用
      let win = { y0: y0Base, h: faceH, conf: best.conf };
      for (const sy of V_SCALES) {
        for (const dy of V_OFFSETS) {
          if (sy === 1 && dy === 0) continue;
          const h = faceH * sy;
          const y0 = y0Base + dy * faceH - (h - faceH) / 2;
          if (y0 < 0 || y0 + h > bigH) continue;
          const r = readCrops(model, big, best.cuts.map((c) => c * scale), y0, h);
          const conf = r.conf - V_PRIOR * (Math.abs(dy) / 0.16 + Math.abs(sy - 1) / 0.15);
          if (conf > win.conf) win = { y0, h, conf };
        }
      }
      if (win.y0 !== y0Base || win.h !== faceH) {
        // 見つかった窓で上位の区切りを読み直す（枚数の候補も変わりうる）
        const valign = { dy: (win.y0 - y0Base) / faceH, sy: win.h / faceH };
        const ranked = evals.slice().sort((a, b) => b.quality - a.quality).slice(0, 5);
        for (const e of ranked) {
          const r = evalFit(e, win.y0, win.h);
          if (r.quality > best.quality) best = { ...r, valign };
        }
      }
    }
    // 区切りの微調整（自信が十分に高ければ省く）。自信の近い候補（枚数違い）があれば、そちらも微調整してから比べる
    const second = evals.filter((e) => e.n !== best.n).sort((a, b) => b.quality - a.quality)[0];
    const needRefine = Math.exp(best.conf) < 0.97 || (second && second.quality > best.quality - 0.15);
    if (model && opts.refine !== false && needRefine) {
      const winY0 = best.y0;
      const winH = best.h;
      const ranked = [best];
      if (second && second.quality > best.quality - 0.3) ranked.push(second);
      let pick = null;
      for (const e of ranked) {
        const cutsE = e.n === best.n ? best.cuts : e.cuts;
        const rf = refineCuts(model, big, cutsE, scale, winY0, winH);
        if (!rf) continue;
        const r = readCrops(model, big, rf.cuts.map((c) => c * scale), winY0, winH);
        const cand = { ...e, ...r, cuts: rf.cuts, quality: e.adj + CONF_W * r.conf, y0: winY0, h: winH, valign: best.valign, refined: true };
        if (!pick || cand.quality > pick.quality) pick = cand;
      }
      if (pick && pick.quality >= best.quality) best = pick;
    }
    return best;
  };
  const first = evals.reduce((a, b) => (b.quality > a.quality ? b : a));
  let best = settle(first);
  const runnerUp = evals.filter((e) => e.n !== first.n).sort((a, b) => b.quality - a.quality)[0];
  if (model && runnerUp && runnerUp.quality > first.quality - RUNNER_MARGIN) {
    const alt = settle(runnerUp);

// ---- src/ui/tile-svg.js ----
// 牌の絵柄（SVGシンボル）。伝統的な配置をもとにした簡略デザイン。


const INK = '#1E232B';
const RED = '#C4302B';
const BLUE = '#1F4E98';
const GREEN = '#167A4C';
const IVORY = '#FBF8EE';
const GOLD = '#C98A1B';
const MINCHO = "'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif";
const KANJI_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];

const r1 = (v) => Math.round(v * 100) / 100;

function text(ch, x, y, size, fill) {
  return `<text x="${x}" y="${y}" font-size="${size}" font-family="${MINCHO}" font-weight="800" fill="${fill}" text-anchor="middle" dominant-baseline="central">${ch}</text>`;
}

function manGlyph(n, red) {
  return text(KANJI_NUM[n - 1], 15, 11.5, 13, red ? RED : INK) + text('萬', 15, 29, 15.5, RED);
}

function pip(cx, cy, r, c) {
  return (
    `<circle cx="${cx}" cy="${cy}" r="${r1(r * 0.86)}" fill="none" stroke="${c}" stroke-width="${r1(r * 0.28)}"/>` +
    `<circle cx="${cx}" cy="${cy}" r="${r1(r * 0.4)}" fill="${c}"/>` +
    `<circle cx="${cx}" cy="${cy}" r="${r1(r * 0.14)}" fill="${IVORY}"/>`
  );
}

function pinGlyph(n, red) {
  const R = red ? RED : null;
  const P = (x, y, r, c) => pip(x, y, r, R || c);
  switch (n) {
    case 1:
      return (
        `<circle cx="15" cy="20" r="11.6" fill="none" stroke="${R || GREEN}" stroke-width="1.5"/>` +
        `<circle cx="15" cy="20" r="9.3" fill="none" stroke="${R || BLUE}" stroke-width="1.6" stroke-dasharray="1.5 1.05"/>` +
        `<circle cx="15" cy="20" r="6.6" fill="${RED}"/>` +
        `<circle cx="15" cy="20" r="4.4" fill="none" stroke="${IVORY}" stroke-width="0.9"/>` +
        `<circle cx="15" cy="20" r="2.1" fill="${R || GREEN}"/>`
      );
    case 2:
      return P(15, 10.5, 6.6, GREEN) + P(15, 29.5, 6.6, BLUE);
    case 3:
      return P(7.8, 8.4, 5, BLUE) + P(15, 20, 5, RED) + P(22.2, 31.6, 5, GREEN);
    case 4:
      return P(8.8, 11, 5.4, BLUE) + P(21.2, 11, 5.4, GREEN) + P(8.8, 29, 5.4, GREEN) + P(21.2, 29, 5.4, BLUE);
    case 5:
      return P(8.2, 9, 4.9, BLUE) + P(21.8, 9, 4.9, GREEN) + P(15, 20, 4.9, RED) + P(8.2, 31, 4.9, GREEN) + P(21.8, 31, 4.9, BLUE);
    case 6:
      return (
        P(9, 7.6, 4.3, GREEN) + P(21, 7.6, 4.3, GREEN) +
        P(9, 21, 4.3, RED) + P(21, 21, 4.3, RED) + P(9, 32, 4.3, RED) + P(21, 32, 4.3, RED)
      );
    case 7:
      return (
        P(6.8, 5.8, 3.7, GREEN) + P(15, 9, 3.7, GREEN) + P(23.2, 12.2, 3.7, GREEN) +
        P(9, 23.2, 4, RED) + P(21, 23.2, 4, RED) + P(9, 33, 4, RED) + P(21, 33, 4, RED)
      );
    case 8:
      return [6.2, 15.4, 24.6, 33.8].map((y) => P(9, y, 4, BLUE) + P(21, y, 4, BLUE)).join('');
    case 9:
      return [[7.6, BLUE], [20, RED], [32.4, GREEN]]
        .map(([y, c]) => P(6.4, y, 3.8, c) + P(15, y, 3.8, c) + P(23.6, y, 3.8, c))
        .join('');
    default:
      return '';
  }
}

function stick(cx, cy, h, c, rot = 0) {
  const w = 3.3;
  const x = r1(cx - w / 2);
  const y = r1(cy - h / 2);
  const body =
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.4" fill="${c}"/>` +
    `<rect x="${r1(x - 0.45)}" y="${r1(y - 0.2)}" width="${r1(w + 0.9)}" height="1" rx="0.5" fill="${c}"/>` +
    `<rect x="${r1(x - 0.45)}" y="${r1(cy - 0.5)}" width="${r1(w + 0.9)}" height="1" rx="0.5" fill="${c}"/>` +
    `<rect x="${r1(x - 0.45)}" y="${r1(y + h - 0.8)}" width="${r1(w + 0.9)}" height="1" rx="0.5" fill="${c}"/>` +
    `<line x1="${cx}" y1="${r1(y + 1.3)}" x2="${cx}" y2="${r1(cy - 1)}" stroke="${IVORY}" stroke-width="0.55" opacity="0.8"/>` +
    `<line x1="${cx}" y1="${r1(cy + 1)}" x2="${cx}" y2="${r1(y + h - 1.3)}" stroke="${IVORY}" stroke-width="0.55" opacity="0.8"/>`;
  return rot ? `<g transform="rotate(${rot} ${cx} ${cy})">${body}</g>` : body;
}

function bird() {
  return (
    `<path d="M15 21.5 L7.2 35.5 L11.4 36.2 Z" fill="${GREEN}"/>` +
    `<path d="M15 21.5 L13.6 37 L16.8 37 Z" fill="${BLUE}"/>` +
    `<path d="M15 21.5 L22.8 35.5 L18.6 36.2 Z" fill="${GREEN}"/>` +
    `<ellipse cx="15" cy="19.5" rx="5.4" ry="6.8" fill="${GREEN}"/>` +
    `<path d="M11.2 16.5 C6.5 18.8 7.2 24.5 9.6 26.6 C11.4 23.6 13.2 21 12.9 17.6 Z" fill="${BLUE}"/>` +
    `<path d="M14.6 13.5 C15.2 11.5 16 10.4 16.4 9.2" stroke="${GREEN}" stroke-width="3" fill="none" stroke-linecap="round"/>` +
    `<circle cx="16.8" cy="8.4" r="3.3" fill="${RED}"/>` +
    `<path d="M19.8 7.7 L23.4 8.9 L19.8 9.9 Z" fill="${GOLD}"/>` +
    `<circle cx="17.6" cy="7.8" r="0.75" fill="${IVORY}"/>` +
    `<path d="M16.2 5.2 L15.2 2.6 M17.4 5 L17.6 2.4" stroke="${RED}" stroke-width="0.8" stroke-linecap="round"/>`
  );
}

function souGlyph(n, red) {
  const R = red ? RED : null;
  const S = (x, y, h, c, rot) => stick(x, y, h, R || c, rot);
  switch (n) {
    case 1:
      return bird();
    case 2:
      return S(15, 11, 14, GREEN) + S(15, 29, 14, BLUE);
    case 3:
      return S(15, 11, 13.5, BLUE) + S(9, 29, 13.5, GREEN) + S(21, 29, 13.5, GREEN);
    case 4:
      return S(9, 11, 13.5, GREEN) + S(21, 11, 13.5, BLUE) + S(9, 29, 13.5, BLUE) + S(21, 29, 13.5, GREEN);
    case 5:
      return (
        S(7.6, 11, 13, GREEN) + S(22.4, 11, 13, BLUE) + S(15, 20, 13, RED) +
        S(7.6, 29, 13, BLUE) + S(22.4, 29, 13, GREEN)
      );
    case 6:
      return [11, 29].map((y) => S(7.2, y, 13.5, GREEN) + S(15, y, 13.5, BLUE) + S(22.8, y, 13.5, GREEN)).join('');
    case 7:
      return (
        S(15, 7.2, 9.4, RED) +
        [21.2, 32.6].map((y) => S(7.2, y, 9.4, GREEN) + S(15, y, 9.4, BLUE) + S(22.8, y, 9.4, GREEN)).join('')
      );
    case 8:
      return (
        S(5.6, 11, 13.5, GREEN) + S(11.6, 11, 13.8, BLUE, 22) + S(18.4, 11, 13.8, BLUE, -22) + S(24.4, 11, 13.5, GREEN) +
        S(5.6, 29, 13.5, GREEN) + S(11.6, 29, 13.8, BLUE, -22) + S(18.4, 29, 13.8, BLUE, 22) + S(24.4, 29, 13.5, GREEN)
      );
    case 9:
      return [8, 20, 32]
        .map((y) => S(7.2, y, 9.6, GREEN) + S(15, y, 9.6, RED) + S(22.8, y, 9.6, BLUE))
        .join('');
    default:
      return '';
  }
}

function honorGlyph(n) {
  switch (n) {
    case 1: return text('東', 15, 20.5, 21, INK);
    case 2: return text('南', 15, 20.5, 21, INK);
    case 3: return text('西', 15, 20.5, 21, INK);
    case 4: return text('北', 15, 20.5, 21, INK);
    case 5:
      return (
        `<rect x="6.2" y="6.8" width="17.6" height="26.4" rx="2.2" fill="none" stroke="#3E73BD" stroke-width="1.5"/>` +
        `<rect x="8.4" y="9" width="13.2" height="22" rx="1.2" fill="none" stroke="#3E73BD" stroke-width="0.6"/>`
      );
    case 6: return text('發', 15, 20.5, 21, GREEN);
    case 7: return text('中', 15, 20.5, 23, RED);
    default: return '';
  }
}

function tileGlyph(id) {
  const b = tileBase(id);
  const red = isRed(id);
  if (b >= 27) return honorGlyph(b - 26);
  const n = (b % 9) + 1;
  const suit = (b / 9) | 0;
  if (suit === 0) return manGlyph(n, red);
  if (suit === 1) return pinGlyph(n, red);
  return souGlyph(n, red);
}

/** ページに1度だけ置くSVGスプライト */
function tileSprite() {
  const symbols = [];
  for (let id = 0; id < 37; id++) {
    symbols.push(`<symbol id="tg-${id}" viewBox="0 0 30 40">${tileGlyph(id)}</symbol>`);
  }
  return `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">${symbols.join('')}</svg>`;
}

/**
 * 牌1枚のHTML
 * opts: { size: 'hand'|'key'|'sm'|'xs', side: 横向き, back: 裏向き, extra: 追加クラス }
 */
function tileHTML(id, opts = {}) {
  const cls = ['tile', `t-${opts.size || 'sm'}`];
  if (opts.side) cls.push('side');
  if (opts.back) cls.push('back');
  if (isRed(id)) cls.push('aka');
  if (opts.extra) cls.push(opts.extra);
  if (opts.back) return `<span class="${cls.join(' ')}" aria-label="裏向きの牌"></span>`;
  return `<span class="${cls.join(' ')}" role="img" aria-label="${tileLabel(id)}"><svg viewBox="0 0 30 40" aria-hidden="true"><use href="#tg-${id}"/></svg></span>`;
}

const fmt = (n) => Number(n).toLocaleString('ja-JP');

/** ロン「8,000」／親ツモ「4,000オール」／子ツモ「2,000-4,000」 */

function hanFuText(r) {

function waitText(r) {

}

function yakuRows(r) {

function tilesInline(ids, size = 'xs') {
  return ids.map((id) => tileHTML(id, { size })).join('');
}

/** 見出し「何待ち？」の横に付ける牌のアイコン（中を少し傾けて） */
function brandTileHTML() {
  return tileHTML(33, { size: 'xxs', extra: 'brand-mark' });
}

function blockTiles(b) {
  if (b.kind === 'shuntsu') return [b.tile, b.tile + 1, b.tile + 2];
  return new Array(b.kan ? 4 : 3).fill(b.tile);
}

/** アガリ形の「面子の分け方」。アガリ牌が入ったブロックを強調する */
function shapeHTML(r, size = 'xs') {
  if (!r || r.form !== 'standard' || !r.blocks) return '';
  const winIdx = r.wait === 'tanki' ? -1 : r.waitIndex;
  const groups = [
    `<div class="shape-group${r.wait === 'tanki' ? ' win' : ''}"><div class="row-tiles">${tilesInline([r.pair, r.pair], size)}</div><small>雀頭${r.wait === 'tanki' ? '・単騎' : ''}</small></div>`,
  ];
  r.blocks.forEach((b, i) => {
    let label;
    if (b.kind === 'shuntsu') label = b.open ? 'チー' : '順子';
    else if (b.kan) label = b.open ? '明槓' : '暗槓';
    else if (b.open) label = 'ポン';
    else label = b.ronOpen ? '明刻' : '暗刻';
    const isWin = i === winIdx;
    groups.push(
      `<div class="shape-group${isWin ? ' win' : ''}"><div class="row-tiles">${tilesInline(blockTiles(b), size)}</div><small>${label}${isWin ? '・' + (WAIT_LABELS[r.wait] || '') : ''}</small></div>`,
    );
  });
  return `<div class="shape">${groups.join('')}</div>`;
}

/**
 * 待ち牌 winBase でアガリしたとき、手牌のどの牌とつながるか（牌の種類の配列）
 * r は evaluateWin の結果（役なしでも形の情報を持つ）
 */
function waitBlockBases(r, winBase) {
  if (!r || (!r.ok && r.reason !== 'noYaku' && r.reason !== 'hidden')) return [];
  if (r.form === 'chiitoitsu') return [winBase];
  if (r.form !== 'standard' || !r.blocks) return [];
  if (r.wait === 'tanki') return [r.pair];
  const b = r.blocks[r.waitIndex];
  if (!b) return [];
  if (b.kind === 'koutsu') return [b.tile, b.tile];
  const tiles = [b.tile, b.tile + 1, b.tile + 2];
  tiles.splice(tiles.indexOf(winBase), 1);
  return tiles;
}

/** 牌の種類の配列 → 手牌配列の位置（同じ牌は左から順に割り当て） */
function indicesForBases(bases, ids) {
  const used = new Set();
  const out = [];
  for (const b of bases) {
    const i = ids.findIndex((id, k) => !used.has(k) && id != null && tileBase(id) === b);
    if (i >= 0) {
      used.add(i);
      out.push(i);
    }
  }
  return out;
}

function situationText(s) {

    `${windLabel(s.roundWind)}場`,

  ];
  if (s.riichi && s.ippatsu) parts.push('一発');
  if (s.riichi && s.uraDora) parts.push(`裏ドラ${s.uraDora}`);
  if (s.nuki) parts.push(`抜きドラ${s.nuki}`);
  if (s.honba) parts.push(`${s.honba}本場`);
  return parts.join('・');
}

/** 牌キーボードの並び（萬・筒・索は右端に赤5） */
const KEY_ROWS = [
  [0, 1, 2, 3, 4, 5, 6, 7, 8, 34],
  [9, 10, 11, 12, 13, 14, 15, 16, 17, 35],
  [18, 19, 20, 21, 22, 23, 24, 25, 26, 36],

];

/** 牌キーボード（ポップアップ用）。isDisabled(id) で押せない牌を指定 */
/** 上の「カメラ・写真・手入力」の選択を今の状態に合わせる（カメラ画面を描き直すたびに呼ぶ） */
function syncViewTabs(mode, source) {

  document.querySelectorAll('[data-action="view"]').forEach((b) => {
    b.setAttribute('aria-selected', String(b.dataset.view === now));
