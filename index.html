// 起動と画面の切り替え








/** 見出し横の「4人／3人」を今の設定に合わせる */
function syncPlayers() {
  document.querySelectorAll('[data-action="players"]').forEach((b) => {
    b.setAttribute('aria-pressed', String((b.dataset.value === '1') === !!state.rules.sanma));
  });
}

/**
 * 「条件/ルール 設定」のヘッダー。枠をたたんでも、今の状態（未設定・未確定・設定済）は見えるようにする
 */
function syncSetupHead() {
  const table = setupStatus('table');
  const agari = setupStatus('agari');
  // 2段のうち「いちばん進んでいない状態」をヘッダーに出す
  //   両方 設定済 → 設定済 ／ どちらかが 未設定 → 未設定 ／ それ以外（触ったあと）→ 未確定
  const st = table === 'ok' && agari === 'ok' ? 'ok' : table === 'none' || agari === 'none' ? 'none' : 'edit';
  const badge = $('setup-st');
  if (badge) {
    badge.dataset.st = st;
    badge.textContent = SETUP_LABELS[st];
  }
  const open = state.setupOpen !== false;
  const head = $('setup-head');
  if (head) head.dataset.open = String(open);
  const btn = head && head.querySelector('.area-toggle');
  if (btn) btn.setAttribute('aria-expanded', String(open));
  const bar = $('rules-bar');
  if (bar) bar.hidden = !open;
}

let lastMode = null;
function render(a) {
  const camera = state.mode === 'camera';
  $('app').dataset.mode = state.mode;
  document.documentElement.dataset.mode = state.mode; // 手入力はページごとスクロールする（CSS）
  $('cam-view').hidden = !camera;
  $('manual-view').hidden = camera;
  syncViewTabs(state.mode, state.cam.source);
  syncPlayers();
  syncSetupHead();
  if (camera) renderCamera(a);
  else renderManual(a);
  if (camera) syncKbSpace(); // 手入力のキーボードの余白を消す
  // 手入力に入ったとき（タブ・スタート画面・前回の続き）は、手牌がキーボードの下に隠れないようにする
  else if (lastMode !== 'manual') revealTable();
  // 利用状況: 手入力を開いた（起動したときに前回の続きで手入力だった場合は数えない）
  if (lastMode && lastMode !== 'manual' && state.mode === 'manual') track('manual_open');
  lastMode = state.mode;
  renderGuide();
}

function setMode(mode) {
  if (mode === state.mode) return;
  if (mode === 'manual') leaveCamera();
  state.mode = mode;
  update();
}

/** カメラ・写真・手入力を1つの切り替えにまとめた（下の入力元タブは廃止） */
function setView(v) {
  if (v === 'manual') return setMode('manual');
  if (state.mode !== 'camera') {
    state.mode = 'camera';
    update();
  }
  setCameraSource(v);
}

function onClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const action = el.dataset.action;
  if (action === 'view') setView(el.dataset.view);
  else if (action === 'bar-step') step(el.dataset.key, +el.dataset.delta);
  else if (action === 'cycle') cycleSituation(el.dataset.key);
  else if (action === 'setup-ok') {
    if (scoreReady()) toast('すでにOK済みです（点数を表示しています）');
    else {
      confirmSetup();
      toast('条件をOKしました。点数を表示します');
    }
  } else if (action === 'setup-reset') resetSetup();
  else if (action === 'setup-toggle') {
    state.setupOpen = state.setupOpen === false;
    update();
  }
  else if (action === 'players') setRule('sanma', el.dataset.value === '1');
  else if (action.startsWith('guide-')) handleGuide(el);
  else if (action.startsWith('cam-')) handleCamera(el);
  else handleManual(el);
}

function init() {
  document.body.insertAdjacentHTML('afterbegin', tileSprite());
  const brandTile = $('brand-tile');
  if (brandTile) brandTile.innerHTML = brandTileHTML();
  load();
  setRenderer(render);
  document.addEventListener('click', onClick);
  // 画面の向きが変わったら作り直す（写真の枠と表示がずれないように）
  let resizeTimer = null;
  const onResize = () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => (state.mode === 'camera' ? onViewportChange() : render(view.analysis)), 150);
  };
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  initCamera();
  update();
  // 利用状況: ホーム画面のアプリとして開いたか、Safari などのブラウザで開いたか
  track(isStandalone() ? 'launch_home' : 'launch_browser');
  // 外部（今後の端末内認識モデルなど）からの入力口
  window.haiyomi = {
    setHand: (hand) => setHand(hand),
    setHandFromString: (str, winStr) => setHand({ concealed: parseTiles(str), win: winStr ? parseTiles(winStr)[0] : null }),
    getAnalysis: () => view.analysis,
    // バナー広告のスペース: 差し替え用。setAds(false) で枠ごと消える
    setAds: (on) => {
      const el = $('ad-slot');
      if (el) el.hidden = !on;
    },
    setAdHTML: (html) => {
      const el = $('ad-inner');
      if (el) el.innerHTML = html;
    },
  };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();

<div class="sw-bar" id="sw-update" hidden role="status"><span>新しい版があります</span><button type="button" id="sw-reload">更新</button></div>
<script>
(() => {
  if (!('serviceWorker' in navigator)) return;
  const bar = document.getElementById('sw-update');
  const show = (reg) => {
    if (!bar) return;
    bar.hidden = false;
    document.getElementById('sw-reload').onclick = () => {
      bar.hidden = true;
      if (reg.waiting) reg.waiting.postMessage('skip-waiting');
      else location.reload();
    };
  };
  // 初回は clients.claim() で担当が決まるだけなので読み込み直さない（更新のときだけ）
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
      if (reg.waiting && navigator.serviceWorker.controller) show(reg);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller) show(reg);
        });
      });
      // スマホは、ほかのアプリから戻ってきたときにページを読み込み直さない（新しい版の確認が走らない）。
      // 画面に戻るたび・「戻る」で表示し直したときにも sw.js を確かめる（新しければ上の「更新」の帯が出る）
      const check = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') check();
      });
      addEventListener('pageshow', (e) => {
        if (e.persisted) check();
      });
    }).catch(() => {});
  });
})();
</script>
