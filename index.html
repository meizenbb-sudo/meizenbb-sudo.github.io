  );
}

function hanFuText(r) {
  if (r.yakuman) return r.limit;
  const hf = `${r.han}翻${r.fu}符`;
  return r.limit ? `${hf}・${r.limit}` : hf;
}

function waitText(r) {
  return r && WAIT_LABELS[r.wait] ? `${WAIT_LABELS[r.wait]}待ち` : '';
}

function yakuRows(r) {
  const rows = r.yaku.map((y) => {
    const v = y.yakuman ? (y.yakuman === 2 ? 'ダブル役満' : '役満') : `${y.han}翻`;
    return `<tr><td>${y.name}</td><td>${v}</td></tr>`;
  });
  for (const d of r.doraList || []) rows.push(`<tr class="dora"><td>${d.name}</td><td>${d.han}翻</td></tr>`);
  const total = r.yakuman ? r.limit : `${r.han}翻`;
  rows.push(`<tr class="total"><td>合計</td><td>${total}</td></tr>`);
  return `<table class="yaku-table"><tbody>${rows.join('')}</tbody></table>`;
}

function scoreCell(label, r) {
  if (!r.ok) {
    return `<span class="score-cell"><span class="k">${label}</span><span class="v none">役なし</span><span class="s">&nbsp;</span></span>`;
  }
  return `<span class="score-cell"><span class="k">${label}</span><span class="v">${paymentShort(r)}</span><span class="s">${hanFuText(r)}</span></span>`;
}

function tilesInline(ids, size = 'xs') {
  return ids.map((id) => tileHTML(id, { size })).join('');
}

/** 見出し「何待ち？」の横に付ける牌のアイコン（中を少し傾けて） */
function brandTileHTML() {
  return tileHTML(33, { size: 'xxs', extra: 'brand-mark' });
}

function blockTiles(b) {
  if (b.kind === 'shuntsu') return [b.tile, b.tile + 1, b.tile + 2];
  return new Array(b.kan ? 4 : 3).fill(b.tile);
}

/** アガリ形の「面子の分け方」。アガリ牌が入ったブロックを強調する */
function shapeHTML(r, size = 'xs') {
  if (!r || r.form !== 'standard' || !r.blocks) return '';
  const winIdx = r.wait === 'tanki' ? -1 : r.waitIndex;
  const groups = [
    `<div class="shape-group${r.wait === 'tanki' ? ' win' : ''}"><div class="row-tiles">${tilesInline([r.pair, r.pair], size)}</div><small>雀頭${r.wait === 'tanki' ? '・単騎' : ''}</small></div>`,
  ];
  r.blocks.forEach((b, i) => {
    let label;
    if (b.kind === 'shuntsu') label = b.open ? 'チー' : '順子';
    else if (b.kan) label = b.open ? '明槓' : '暗槓';
    else if (b.open) label = 'ポン';
    else label = b.ronOpen ? '明刻' : '暗刻';
    const isWin = i === winIdx;
    groups.push(
      `<div class="shape-group${isWin ? ' win' : ''}"><div class="row-tiles">${tilesInline(blockTiles(b), size)}</div><small>${label}${isWin ? '・' + (WAIT_LABELS[r.wait] || '') : ''}</small></div>`,
    );
  });
  return `<div class="shape">${groups.join('')}</div>`;
}

/**
 * 待ち牌 winBase でアガリしたとき、手牌のどの牌とつながるか（牌の種類の配列）
 * r は evaluateWin の結果（役なしでも形の情報を持つ）
 */
function waitBlockBases(r, winBase) {
  if (!r || (!r.ok && r.reason !== 'noYaku' && r.reason !== 'hidden')) return [];
  if (r.form === 'chiitoitsu') return [winBase];
  if (r.form !== 'standard' || !r.blocks) return [];
  if (r.wait === 'tanki') return [r.pair];
  const b = r.blocks[r.waitIndex];
  if (!b) return [];
  if (b.kind === 'koutsu') return [b.tile, b.tile];
  const tiles = [b.tile, b.tile + 1, b.tile + 2];
  tiles.splice(tiles.indexOf(winBase), 1);
  return tiles;
}

/** 牌の種類の配列 → 手牌配列の位置（同じ牌は左から順に割り当て） */
function indicesForBases(bases, ids) {
  const used = new Set();
  const out = [];
  for (const b of bases) {
    const i = ids.findIndex((id, k) => !used.has(k) && id != null && tileBase(id) === b);
    if (i >= 0) {
      used.add(i);
      out.push(i);
    }
  }
  return out;
}

function situationText(s) {
  const dealer = s.seatWind === 27;
  const parts = [
    `${windLabel(s.roundWind)}場`,
    `${windLabel(s.seatWind)}家（${dealer ? '親' : '子'}）`,
    s.riichi === 2 ? 'ダブルリーチ' : s.riichi ? 'リーチ' : 'リーチなし',
  ];
  if (s.riichi && s.ippatsu) parts.push('一発');
  if (s.riichi && s.uraDora) parts.push(`裏ドラ${s.uraDora}`);
  if (s.nuki) parts.push(`抜きドラ${s.nuki}`);
  if (s.honba) parts.push(`${s.honba}本場`);
  return parts.join('・');
}

/** 牌キーボードの並び（萬・筒・索は右端に赤5） */
const KEY_ROWS = [
  [0, 1, 2, 3, 4, 5, 6, 7, 8, 34],
  [9, 10, 11, 12, 13, 14, 15, 16, 17, 35],
  [18, 19, 20, 21, 22, 23, 24, 25, 26, 36],
  [27, 28, 29, 30, 31, 32, 33],
];

/** 牌キーボード（ポップアップ用）。isDisabled(id) で押せない牌を指定 */
/** 上の「カメラ・写真・手入力」の選択を今の状態に合わせる（カメラ画面を描き直すたびに呼ぶ） */
function syncViewTabs(mode, source) {
  const now = mode === 'manual' ? 'manual' : source === 'live' ? 'live' : source === 'photo' ? 'photo' : '';
  document.querySelectorAll('[data-action="view"]').forEach((b) => {
    b.setAttribute('aria-selected', String(b.dataset.view === now));
  });
}

const RIICHI_LABELS = ['リーチなし', 'リーチ', 'ダブリー'];

/** 数を −[数字]＋ で入れる（本場・供託・裏ドラ・抜きドラ）。dim=true は今は点数に入らない印 */
function stepperHTML(s, key, label, dim = false) {
  return (
    `<span class="bstep" data-key="${key}" data-on="${(s[key] | 0) > 0}"${dim ? ' data-dim="true"' : ''}><b>${label}</b>` +
    `<button type="button" data-action="bar-step" data-key="${key}" data-delta="-1" aria-label="${label}を減らす">−</button>` +
    `<output>${s[key] | 0}</output>` +
    `<button type="button" data-action="bar-step" data-key="${key}" data-delta="1" aria-label="${label}を増やす">＋</button></span>`
  );
}

/** 「その他」に、既定と違うルールがあるか（あれば点を付けて知らせる） */
/** 「その他」のルールを1つでも既定から変えているか（「その他」に印を付ける） */
function rulesChanged(r) {
  return Object.keys(DEFAULT_RULES).some((k) => r[k] !== undefined && r[k] !== DEFAULT_RULES[k]);
}

/** 条件の段のステータス札（未設定／未確定／設定済） */
const SETUP_LABELS = { none: '未設定', edit: '未確定', ok: '設定済' };
function statusHTML(st) {
  return `<em class="st" data-st="${st}">${SETUP_LABELS[st] || SETUP_LABELS.none}</em>`;
}

/** 点数を出す前の案内（条件をOKしてもらう） */
function pendingScoreHTML(compact = false) {
  if (compact) return '<small class="pending">点数はOK後に表示</small>';
  return (
    '<div class="score-wait"><b>点数は条件設定のOK後に表示します</b>' +
    '<span>上の「条件/ルール 設定」を確かめて「OK」を押してください。待ちとシャンテン数は設定に関係なく表示しています</span></div>'
  );
}

/**
 * 状況の帯（カメラ・手入力で共通）。鎖線で2段に分ける:
 *   場の設定:   場風 → 家 → 本場 → 供託 → ドラ
 *   アガリ想定: リーチ → ロン/ツモ → 一発 → 裏ドラ → 抜きドラ
 *   右の縦の列: その他（人数・符などの設定シート）・リセット・OK（両方の段にかかる）
 * タップで切り替えるチップは幅を固定して、文字が変わっても押す場所が動かないようにする。
 * ドラと「その他」のチップは画面ごとに行き先が違うので link(kind) で属性をもらう。
 * status = { table, agari: 'none'|'edit'|'ok', ready } は見出し下の札と右の「リセット」「OK」に使う
 */
function situationBarHTML(state, link, status = { table: 'none', agari: 'none', ready: false }) {
  const s = state.situation;
  const r = state.rules;
  const open = state.melds.some((m) => m.type !== 'ankan');
  const riichi = open ? 0 : s.riichi | 0;
  const fixed = (key, label, extra = '') =>
    `<button type="button" class="gchip fixed" data-action="cycle" data-key="${key}"${extra}>${label}</button>`;
  const doraTiles = state.dora.length ? tilesInline(state.dora.map(doraFromIndicator), 'xxs') : '<span class="none">なし</span>';
  // 親はオレンジ（リーチと同じ）、子は緑の札
  const seatBadge = s.seatWind === 27 ? '<em class="oya">親</em>' : '<em class="ko">子</em>';
  const table =
    fixed('roundWind', `${windLabel(s.roundWind)}場`) +
    fixed('seatWind', `${windLabel(s.seatWind)}家${seatBadge}`) +
    stepperHTML(s, 'honba', '本場') +
    stepperHTML(s, 'kyotaku', '供託') +
    `<button type="button" class="gchip dora" ${link('dora')}><span>ドラ</span>${doraTiles}</button>`;
  // ロン/ツモは両方の文字を出して、選んでいる側を塗る（押す前にどちらが選ばれているか分かる）
  const tsumo = `<button type="button" class="gchip fixed seg2" data-action="cycle" data-key="tsumo" aria-pressed="${!!s.tsumo}" aria-label="ロンとツモの切り替え">` +
    `<span class="seg-a">ロン</span><span class="seg-b">ツモ</span></button>`;
  const agari =
    fixed('riichi', RIICHI_LABELS[riichi] || RIICHI_LABELS[0], ` data-riichi="${riichi}"${open ? ' disabled' : ''}`) +
    tsumo +
    fixed('ippatsu', '一発', ` aria-pressed="${!!(riichi && s.ippatsu)}"${riichi ? '' : ' data-off="true"'}`) +
    `<span class="sit-br" aria-hidden="true"></span>` + // 縦向きでは ここで2行目（裏ドラ・抜きドラ）
    stepperHTML(s, 'uraDora', '裏ドラ', !riichi) +
    stepperHTML(s, 'nuki', '抜きドラ');
  // 右の縦の列: その他（設定シート）・リセット・OK。2段の右に縦線で区切って置き、両方の段にかかることを示す
  const side =
    `<div class="sit-side">` +
    `<button type="button" class="gchip more" ${link('rules')}${rulesChanged(r) ? ' data-changed="true"' : ''}>その他</button>` +
    `<button type="button" class="sbtn reset" data-action="setup-reset">リセット</button>` +
    `<button type="button" class="sbtn ok" data-action="setup-ok" data-done="${!!status.ready}" aria-label="条件をOKして点数を表示">${status.ready ? '✓ OK' : 'OK'}</button></div>`;
  return (
    `<b class="sit-head"><span>場の設定</span>${statusHTML(status.table)}</b><div class="sit-chips">${table}</div>` +
    side +
    `<div class="sit-sep" role="separator"></div>` +
    `<b class="sit-head"><span>アガリ想定</span>${statusHTML(status.agari)}</b><div class="sit-chips">${agari}</div>`
  );
}

function paletteHTML(action, isDisabled = () => false, extra = '') {
  const keys = KEY_ROWS.flat().map(
    (id) =>
      `<button type="button" class="key" data-action="${action}" data-id="${id}" aria-label="${tileLabel(id)}"${isDisabled(id) ? ' disabled' : ''}>${tileHTML(id, { size: 'key' })}</button>`,
  );
  return `<div class="palette">${keys.join('')}${extra}</div>`;
}

/**
 * 七対子・国士は、実戦で狙い始める形のときだけ出す（情報を増やしすぎない）
 *   七対子: 対子が5個以上／国士: 么九牌が8種類以上
 *   ただし一般手より近いときは、そのシャンテン数の理由になるので必ず出す
 */
function formsHTML(sh) {
  let items = [['一般手', sh.normal]];
  if (sh.chiitoi !== Infinity && (sh.chiitoi < sh.normal || sh.pairs >= 5)) items.push(['七対子', sh.chiitoi]);
  if (sh.kokushi !== Infinity && (sh.kokushi < sh.normal || sh.yaochu >= 8)) items.push(['国士', sh.kokushi]);
  items = items.filter(([, v]) => v !== Infinity);
  // テンパイ・アガリのときは、その形だけ
  if (sh.min <= 0) items = items.filter(([, v]) => v === sh.min);
  if (items.length < 2) return '';
  return `<div class="forms">${items
    .map(([k, v]) => `<span class="form-pill${v === sh.min ? ' best' : ''}">${k} ${shantenText(v)}</span>`)
    .join('')}</div>`;
}

/**
 * 本場・供託をふくめた「実際に動く点数」。基本の点数と分けて出す
 *   例: 基本 8,000 ＋ 2本場 600 ＝ 8,600点
 * 本場のぶんは r.total から逆算する（ツモは1人100点ずつ・三人麻雀では人数が違うため）
 */
function moveLineHTML(r, situation) {
  const honba = situation.honba | 0;
  const kyotaku = situation.kyotaku | 0;
  if (!r || !r.ok || (!honba && !kyotaku)) return '';
  const kyotakuPt = 1000 * kyotaku;
  const honbaPt = Math.max(0, (r.total | 0) - (r.points | 0) - kyotakuPt);
  const parts = [`<span class="mv"><small>基本</small><b>${fmt(r.points)}</b></span>`];
  if (honbaPt) parts.push(`<span class="mv add"><small>${honba}本場</small><b>+${fmt(honbaPt)}</b></span>`);
  if (kyotakuPt) parts.push(`<span class="mv add"><small>供託${kyotaku}本</small><b>+${fmt(kyotakuPt)}</b></span>`);
  return (
    `<p class="move-line">${parts.join('<i>＋</i>')}<i>＝</i>` +
    `<span class="mv total"><small>受け取り</small><b>${fmt(r.total)}<em>点</em></b></span></p>`
  );
}

/** アガリ時の支払い内訳 */
function paymentList(r, situation) {
  const p = r.payment;
  const rows = [];
  const honba = situation.honba | 0;
  const kyotaku = situation.kyotaku | 0;
  if (p.type === 'ron') {
    rows.push(['放銃者から', fmt(p.ron)]);
    if (honba) rows.push([`${honba}本場`, `+${fmt(300 * honba)}`]);
  } else if (p.type === 'tsumoDealer') {
    const n = p.payers || 3;
    rows.push([`子${n}人から${n > 1 ? '各' : ''}`, fmt(p.each) + (honba ? ` +${fmt(100 * honba)}` : '')]);
  } else {
    const n = p.payers != null ? p.payers : 2;
    rows.push(['親から', fmt(p.parent) + (honba ? ` +${fmt(100 * honba)}` : '')]);
    rows.push([`子${n}人から${n > 1 ? '各' : ''}`, fmt(p.child) + (honba ? ` +${fmt(100 * honba)}` : '')]);
  }
  if (kyotaku) rows.push([`供託 ${kyotaku}本`, `+${fmt(1000 * kyotaku)}`]);
  rows.push(['合計の収入', `${fmt(r.total)}点`]);
  return `<dl class="pay-list">${rows
    .map(([k, v], i) => {
      const c = i === rows.length - 1 ? ' class="sum"' : '';
      return `<dt${c}>${k}</dt><dd${c}>${v}</dd>`;
    })
    .join('')}</dl>`;
}

/** 符の内訳（折りたたみ） */
function fuDetailsHTML(r) {
  if (r.yakuman || !r.fuParts || !r.fuParts.length) return '';
  const title = r.form === 'chiitoitsu' ? '七対子は25符固定' : `${r.fuRaw}符 → ${r.fu}符`;
  return `<details class="more"><summary>符の内訳（${title}）</summary><ul class="fu-list">${r.fuParts
    .map((p) => `<li><span>${p.label}</span><b>${p.fu}符</b></li>`)
    .join('')}</ul></details>`;
}

/**
 * 利用状況の計測（Google アナリティクス）。公開用のページにだけ計測のタグ（window.gtag）が入る。
 * タグがないとき（手元の確認用のページなど）は何もしない。送るのは操作の名前だけで、写真や手牌の中身は送らない
 */
function track(name) {
  try {
    if (typeof window !== 'undefined' && typeof window.gtag === 'function') window.gtag('event', name);
  } catch (e) {
    // 計測の失敗でアプリを止めない
  }
}

/** ホーム画面に追加したアプリとして開いているか（Safari のタブで開いているのではなく） */
function isStandalone() {
  try {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  } catch (e) {
    return false;
  }
}

// ---- src/ui/store.js ----
// 状態・保存・操作（カメラ画面と手入力画面で共通）





const STORE_KEY = 'haiyomi:v2';
const MELD_TYPES = new Set(['chi', 'pon', 'minkan', 'ankan']);
const TSUMO_ONLY = new Set(['rinshan', 'haitei', 'tenhou', 'chiihou']);
const RON_ONLY = new Set(['houtei', 'chankan']);
const DEFAULT_SITUATION = Object.freeze({
  roundWind: 27, seatWind: 28, tsumo: false, riichi: 0, ippatsu: false, special: '', honba: 0, kyotaku: 0, nuki: 0,
  uraDora: 0, // 帯の「裏ドラ」±で入れる枚数（リーチ時だけ点数に入る）
});
/**
 * 条件の確認状態。ok = 「OK」を押した／table・agari = そのあと（またはリセット後）に「場の設定」「アガリ想定」を触った。
 * 点数は ok かつ どちらも触っていないときだけ出す（待ち・シャンテン数は関係なく出す）
 */
const DEFAULT_SETUP = Object.freeze({ ok: false, table: false, agari: false });
/** 条件の項目がどちらの段に属するか */
const SETUP_SECTION = {
  roundWind: 'table', seatWind: 'table', honba: 'table', kyotaku: 'table', dora: 'table',
  tsumo: 'agari', riichi: 'agari', ippatsu: 'agari', special: 'agari', uraDora: 'agari', nuki: 'agari', ura: 'agari',
};

/** デモ場面（写真の代わりに使う手牌） */
const DEMOS = [
  { id: 'chinitsu', title: '清一色の7面待ち', note: '待ちが見えにくい代表例', tiles: '1114445678999m' },
  { id: 'honitsu1', title: '混一色の1シャンテン', note: '何を引けばテンパイか', tiles: '1234567789p344z' },
  { id: 'honitsu', title: '混一色・字牌待ちあり', note: '4種の待ち', tiles: '11123456789s77z' },
  { id: 'agari', title: 'ロンアガリ（赤ドラ）', note: '14枚で点数計算', tiles: '234m067m34p666p88s', win: '2p' },
];

const state = {
  mode: 'camera',
  concealed: [],
  win: null,
  melds: [],
  dora: [],
  ura: [],
  situation: { ...DEFAULT_SITUATION },
  situationTouched: false,
  setup: { ...DEFAULT_SETUP },
  rules: { ...DEFAULT_RULES },
  sample: false,
  setupOpen: true, // 「条件/ルール 設定」の枠を開いているか（ヘッダーはいつも出す）
  seenStart: false, // スタート画面を見たか（初回だけ出す）
  overlay: null, // 重ねて出す画面: 'start' | 'help' | null
  // 手入力画面
  target: 'hand',
  meldRed: false,
  kbFolded: false,
  lastAdded: null,

  // カメラ画面

    source: 'photo', // photo | live | demo（デモは使い方画面から）
    demo: 'chinitsu',
    live: 'off', // off | starting | on | frozen | failed
    draft: null, // 読み取れない牌（null）を含む並び { tiles: (id|null)[] }
    sel: null, // { kind: 'wait'|'draw'|'discard', tile }
    pop: null, // settings | dora | add | edit | meld | demo | photo
    editIndex: null,
    busy: false,
    note: '',
    recog: null,
    cands: null,
    photoUrl: null,
    photoSize: null,
    zoom: 1,
    panX: 0,
    panY: 0,

    sorted: false, // 配牌整理（理牌）ON/OFF。既定は OFF＝写真と同じ並び
    sortPerm: null, // 整理前の並びへ戻すための順番
  },
};

const view = { analysis: null };
let renderer = () => {};
function setRenderer(fn) {
  renderer = fn;
}

const isTileId = (v) => Number.isInteger(v) && v >= 0 && v <= 36;

function persisted() {
  return {
    mode: state.mode,
    concealed: state.concealed,
    win: state.win,
    melds: state.melds,
    dora: state.dora,
    ura: state.ura,
    situation: state.situation,
    situationTouched: state.situationTouched,
    setup: state.setup,
    rules: state.rules,
    sample: state.sample,
    setupOpen: state.setupOpen,
    seenStart: state.seenStart,
    cam: { source: state.cam.source === 'live' ? 'live' : state.cam.source, demo: state.cam.demo, sorted: !!state.cam.sorted },
  };
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(persisted()));
  } catch (e) {
    /* 保存できない環境でも動作を続ける */
  }
}

function applyDemo(id) {
  const d = DEMOS.find((x) => x.id === id) || DEMOS[0];
  state.concealed = parseTiles(d.tiles);
  state.win = d.win ? parseTiles(d.win)[0] : null;
  state.melds = [];
  state.sample = true;
  Object.assign(state.cam, { source: 'demo', demo: d.id, draft: null, sel: null, recog: null, cands: null, note: '' });
}

function load() {
  let s = null;
  try {
    s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  } catch (e) {
    s = null;
  }
  const ok =
    s && Array.isArray(s.concealed) && s.concealed.every(isTileId) &&
    (s.win === null || isTileId(s.win)) &&
    Array.isArray(s.melds) && s.melds.every((m) => m && MELD_TYPES.has(m.type) && Array.isArray(m.tiles) && m.tiles.every(isTileId)) &&
    Array.isArray(s.dora) && s.dora.every(isTileId) && Array.isArray(s.ura) && s.ura.every(isTileId);
  if (!ok) {
    state.overlay = 'start';
    return;
  }
  Object.assign(state, {
    mode: s.mode === 'manual' ? 'manual' : 'camera',
    concealed: s.concealed,
    win: s.win,
    melds: s.melds,
    dora: s.dora,
    // 裏ドラは「裏ドラ」の枚数（帯の±）だけにした。以前の版で表示牌として入れたものは、見えないまま数えないよう消す
    ura: [],
    situation: { ...DEFAULT_SITUATION, ...(s.situation || {}) },
    situationTouched: !!s.situationTouched,
    setup: { ...DEFAULT_SETUP, ...(s.setup || {}) },
    rules: { ...DEFAULT_RULES, ...(s.rules || {}) },
    sample: !!s.sample,
    setupOpen: s.setupOpen !== false,
    seenStart: !!s.seenStart,
  });
  if (!state.seenStart) state.overlay = 'start';
  const c = s.cam || {};
  // デモは使い方画面から入るものなので、次に開いたときは写真の画面から始める
  state.cam.source = c.source === 'live' ? 'live' : 'photo';
  state.cam.demo = DEMOS.some((d) => d.id === c.demo) ? c.demo : 'chinitsu';
  state.cam.sorted = !!c.sorted;
}

function update() {
  view.analysis = analyze({
    concealed: state.concealed,
    win: state.win,
    melds: state.melds,
    dora: state.dora,
    ura: state.ura,
    situation: state.situation,
    rules: state.rules,
  });
  renderer(view.analysis);
  save();
}

// ---------- 元に戻す ----------
const undoStack = [];
// 戻す履歴が動いた回数（snapshot・undo のたびに増える）。
// 「元に戻す」を押したときに、そのあと別の操作がされていないかを確かめるのに使う
let histSeq = 0;
const historySeq = () => histSeq;
// ボタン付きのお知らせ（「元に戻す」など）を出しているか。手牌が動いたら古いボタンは片付ける
let toastAct = false;
function snapshot() {
  undoStack.push(
    JSON.stringify({
      concealed: state.concealed,
      win: state.win,
      melds: state.melds,
      dora: state.dora,
      ura: state.ura,
      draft: state.cam.draft,
    }),
  );
  if (undoStack.length > 80) undoStack.shift();
  histSeq++;
  if (toastAct) hideToast();
}
function undo() {
  const raw = undoStack.pop();
  if (!raw) {
    toast('戻せる操作はありません');
    return;
  }
  histSeq++;
  if (toastAct) hideToast();
  const s = JSON.parse(raw);
  Object.assign(state, { concealed: s.concealed, win: s.win, melds: s.melds, dora: s.dora, ura: s.ura, lastAdded: null, cursor: null });
  state.cam.draft = s.draft;
  state.cam.sel = null;
  update();
}

// ---------- 参照 ----------
const need = () => 13 - 3 * state.melds.length;
/** 条件の段のステータス: 'ok'（設定済）| 'edit'（触ったがOK前）| 'none'（未設定） */
function setupStatus(section) {
  const st = state.setup;
  if (st[section]) return 'edit';
  return st.ok ? 'ok' : 'none';
}
/** 点数を出してよいか（OK済みで、そのあと条件を触っていない） */
const scoreReady = () => !!(state.setup.ok && !state.setup.table && !state.setup.agari);
/** 条件を触ったしるし（key は条件の項目名か 'table' / 'agari'） */
function markSetup(key) {
  const section = SETUP_SECTION[key] || key;
  if (section === 'table' || section === 'agari') state.setup[section] = true;
}
const hasOpenMeld = () => state.melds.some((m) => m.type !== 'ankan');
const hasKan = () => state.melds.some((m) => m.type === 'minkan' || m.type === 'ankan');
function allInputTiles() {
  return [
    ...state.concealed,
    ...(state.win != null ? [state.win] : []),
    ...state.melds.flatMap((m) => m.tiles),
    ...state.dora,
    ...state.ura,
  ];
}
/** 同じ牌4枚までの制限に引っかからないか。問題があればメッセージを返す
 *  （赤5は卓によって各色2枚・3枚・全部赤もあるので、赤どうしの枚数は制限しない） */
function tileLimitMessage(id, extraUsed = []) {
  const used = countsOf(allInputTiles().concat(extraUsed));
  if (used[tileBase(id)] >= 4) return `${tileLabel(tileBase(id))}はすでに4枚使われています（赤5をふくめて4枚まで）`;
  return '';
}

// ---------- 操作 ----------
function setHand({ concealed = [], win = null, melds = [] } = {}, { sample = false } = {}) {
  snapshot();
  concealed = concealed.slice();
  // 13枚＋1枚（鳴き後は10枚＋1枚など）で渡されたときは、右端をアガリ牌として扱う
  if (win == null && concealed.length === 13 - 3 * melds.length + 1) win = concealed.pop();
  Object.assign(state, {
    concealed,
    win,
    melds: melds.map((m) => ({ type: m.type, tiles: m.tiles.slice() })),
    sample,
    lastAdded: null,
    cursor: null,
  });
  state.cam.draft = null;
  state.cam.sel = null;
  // 外から手牌を渡されたときは「読み取り済み」として扱う（牌チップと配牌整理の表示条件をそろえる）
  state.cam.read = concealed.length > 0 || win != null || state.melds.length > 0;
  update();
}

function removeAt(where, index) {
  snapshot();
  if (where === 'hand') state.concealed.splice(index, 1);
  else if (where === 'win') state.win = null;
  else if (where === 'meld') state.melds.splice(index, 1);
  else if (where === 'dora' || where === 'ura') {
    state[where].splice(index, 1);
    markSetup(where);
  }
  state.sample = false;
  state.lastAdded = null;
  state.cursor = null;
  state.cam.sel = null;
  update();
}

function clearHand() {
  if (!allInputTiles().length && !state.cam.draft) return;
  snapshot();
  Object.assign(state, { concealed: [], win: null, melds: [], dora: [], ura: [], sample: false, target: 'hand', lastAdded: null, cursor: null });
  state.cam.draft = null;
  state.cam.sel = null;
  // 1局ごとの条件は初期化（場風・自風・積み棒は残す）。アガリ想定はもう一度OKしてもらう
  Object.assign(state.situation, { tsumo: false, riichi: 0, ippatsu: false, special: '', uraDora: 0, nuki: 0 });
  markSetup('agari');
  update();
  toast('全消去しました（「戻す」で元に戻せます）');
}

/** 「OK」: 今の条件で点数を出す */
function confirmSetup() {
  state.setup = { ok: true, table: false, agari: false };
  state.situationTouched = true;
  update();
}

/** 「リセット」: 場の設定・アガリ想定・ドラを初期値に戻す（人数や符などのルールは残す） */
function resetSetup() {
  state.situation = { ...DEFAULT_SITUATION };
  state.dora = [];
  state.ura = [];
  state.setup = { ...DEFAULT_SETUP };
  state.situationTouched = false;
  state.cam.sel = null;
  update();
  toast('条件をリセットしました（東場・南家・ドラなし・リーチなし・ロン）');
}

function setSituation(key, value) {
  const s = state.situation;
  s[key] = value;
  state.situationTouched = true;
  markSetup(key);
  if (key === 'tsumo') {
    if (value && RON_ONLY.has(s.special)) s.special = '';
    if (!value && TSUMO_ONLY.has(s.special)) s.special = '';
  }
  if (key === 'riichi') {
    if (!value) s.ippatsu = false;
    if (value && (s.special === 'tenhou' || s.special === 'chiihou')) s.special = '';
  }
  if (key === 'seatWind') {
    if (s.special === 'tenhou' && value !== 27) s.special = '';
    if (s.special === 'chiihou' && value === 27) s.special = '';
  }
  update();
}

/** 状況の帯のチップをタップしたときの切り替え（場・家・リーチ・ロン/ツモ） */
function cycleSituation(key) {
  const s = state.situation;
  const sanma = !!state.rules.sanma;
  switch (key) {
    case 'roundWind': // 東場 → 南場 → 西場 → 東場
      return setSituation('roundWind', s.roundWind >= 29 ? 27 : s.roundWind + 1);
    case 'seatWind': // 東家 → 南家 → 西家 → 北家 → 東家（三人麻雀は北家なし）
      return setSituation('seatWind', s.seatWind >= (sanma ? 29 : 30) ? 27 : s.seatWind + 1);
    case 'riichi': // なし → リーチ → ダブル → なし
      if (hasOpenMeld()) return toast('鳴きがあるのでリーチは付けられません');
      return setSituation('riichi', ((s.riichi | 0) + 1) % 3);
    case 'tsumo':
      return setSituation('tsumo', !s.tsumo);
    case 'ippatsu': // リーチ・ダブリーのときだけ
      return toggleSpecial('ippatsu');
    default:
      return undefined;
  }
}

function toggleSpecial(sp) {
  const s = state.situation;
  state.situationTouched = true;
  markSetup('agari');
  if (sp === 'ippatsu') {
    if (!s.riichi) {
      toast('一発はリーチ中のみ選べます');
      return;
    }
    s.ippatsu = !s.ippatsu;
    update();
    return;
  }
  if (s.special === sp) {
    s.special = '';
    update();
    return;
  }
  s.special = sp;
  if (TSUMO_ONLY.has(sp)) s.tsumo = true;
  if (RON_ONLY.has(sp)) s.tsumo = false;
  if (sp === 'tenhou' || sp === 'chiihou') {
    s.riichi = 0;
    s.ippatsu = false;
    if (sp === 'tenhou' && s.seatWind !== 27) {
      s.seatWind = 27;
      toast('天和は親の役なので、自風を東にしました');
    }
    if (sp === 'chiihou' && s.seatWind === 27) {
      s.seatWind = 28;
      toast('地和は子の役なので、自風を南にしました');
    }
  }
  if (sp === 'rinshan' && !hasKan()) toast('嶺上開花はカンしているときに付きます');
  update();
}

const STEP_MAX = { honba: 20, kyotaku: 10, nuki: 8, uraDora: 12 };
function step(key, delta) {
  if (!(key in STEP_MAX)) return;
  const s = state.situation;
  s[key] = Math.max(0, Math.min(STEP_MAX[key], (s[key] | 0) + delta));
  state.situationTouched = true;
  markSetup(key);
  if (key === 'uraDora' && delta > 0 && !s.riichi) toast('裏ドラはリーチしているときだけ数えます');
  update();
}

function setRule(key, value) {
  if (state.rules[key] === value) return;
  state.rules[key] = value;
  markSetup(key === 'sanma' ? 'table' : 'agari'); // 人数は場の設定、符などは「その他」（アガリ想定）の扱い
  // 三人麻雀にしたら、あり得ないものは外す（2〜8萬・赤5萬のドラ表示牌、北家）
  if (key === 'sanma' && value) {
    const bad = (id) => isSanmaMissing(tileBase(id)) || id === 34;
    const removed = state.dora.filter(bad).length + state.ura.filter(bad).length;
    if (removed) {
      snapshot();
      state.dora = state.dora.filter((id) => !bad(id));
      state.ura = state.ura.filter((id) => !bad(id));
    }
    const notes = [];
    if (removed) notes.push(`2〜8萬のドラ表示牌${removed}枚を外しました`);
    if (state.situation.seatWind === 30) {
      state.situation.seatWind = 27;
      notes.push('北家はないので東家にしました');
    }
    if (notes.length) toast(`三人麻雀にしたので、${notes.join('。')}`);
  }
  update();
}

let toastTimer = 0;
/**
 * 画面の上に短いお知らせを出す。action を渡すと右にボタンを付ける（例: { label: '元に戻す', run }）。
 * ボタンを押すとお知らせを閉じてから run を呼ぶ
 */
function toast(msg, ms = 2800, action = null) {
  const el = $('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle('has-act', !!action);
  toastAct = !!action;
  if (action) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'toast-act';
    b.textContent = action.label;
    b.addEventListener('click', () => {
      hideToast();
      action.run();
    });
    el.append(b);
  }
  el.hidden = false;
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, ms);
}

function hideToast() {
  clearTimeout(toastTimer);
  toastAct = false;
  const el = $('toast');
  if (el) el.hidden = true;
}

// ---- src/ui/manual.js ----
// 手入力画面（縦向き）: 牌キーボードで入力 → シャンテン・待ち・点数






// キーボードで入れるのは手牌と鳴きだけ。ドラは上の「条件/ルール 設定」のドラ（写真の画面と同じシート）、
// 裏ドラは同じ帯の「裏ドラ」で枚数を入れる（表示牌でも入れられると二重に数えてしまうため一本化）
const TARGETS = [
  ['hand', '手牌'],
  ['chi', 'チー'],
  ['pon', 'ポン'],
  ['minkan', '明槓'],
  ['ankan', '暗槓'],
];

const scopeFor = () => allInputTiles();

/** 今どの位置に入れようとしているか（0..need()。need() はアガリ牌） */
function cursorIndex() {
  const n = need();
  const c = state.cursor == null ? state.concealed.length : state.cursor;
  return Math.max(0, Math.min(c, n));
}

/** その位置にすでに牌があるなら、入れ直しになる牌（追加のときは null） */
function replacingTile() {
  if (state.target !== 'hand') return null;
  const c = cursorIndex();
  if (c < state.concealed.length) return state.concealed[c];
  if (state.concealed.length >= need()) return state.win;
  return null;
}

function withoutOne(list, id) {
  const out = list.slice();
  const i = out.indexOf(id);
  if (i >= 0) out.splice(i, 1);
  return out;
}

function keyAvailable(id, used, redsUsed) {
  const b = tileBase(id);
  const t = state.target;
  if (state.rules.sanma && (isSanmaMissing(b) || id === 34)) return false; // 三人麻雀にない牌
  // 赤5は卓によって各色2枚・3枚・全部赤もあるので、ノーマルの5と合わせて4枚までだけ見る
  if (isRed(id) && MELD_TYPES.has(t)) return false;
  switch (t) {
    case 'pon': return used[b] <= 1;
    case 'minkan':
    case 'ankan': return used[b] === 0;
    case 'chi': return b < 27 && b % 9 <= 6 && used[b] < 4 && used[b + 1] < 4 && used[b + 2] < 4;
    default: return used[b] < 4;
  }
}

function addTile(id) {
  const t = state.target;
  const rep = replacingTile();
  const all = rep == null ? scopeFor(t) : withoutOne(scopeFor(t), rep);
  const used = countsOf(all);
  const b = tileBase(id);
  if (MELD_TYPES.has(t)) {
    if (state.melds.length >= 4) return toast('鳴きは4組までです');
    const redBase = b < 27 ? Math.floor(b / 9) * 9 + 4 : -1;
    const redAvailable = countsOf(all)[redBase] < 4;
    const meld = makeMeld(t, id, state.meldRed && redAvailable);
    if (!meld) return toast('チーは順子の一番小さい牌をタップします（例: 3萬 → 345萬）');
    const add = countsOf(meld.tiles);
    for (let i = 0; i < 34; i++) {
      if (add[i] && used[i] + add[i] > 4) return toast(`${tileLabel(i)}が足りません（同じ牌は4枚まで）`);
    }
    const newNeed = need() - 3;
    if (state.concealed.length > newNeed) {
      return toast(`鳴き${state.melds.length + 1}組なら手牌は${newNeed}枚です。先に手牌を減らしてください`);
    }
    snapshot();
    state.melds.push(meld);
    if (meld.type !== 'ankan' && state.situation.riichi) toast('鳴きがあるためリーチは計算に含めません');
    state.lastAdded = { where: 'meld', index: state.melds.length - 1 };
  } else {
    if (used[b] >= 4) return toast(`${tileLabel(b)}はすでに4枚使われています（赤5をふくめて4枚まで）`);
    if (t === 'hand') {
      // 左から順に入れる。赤い枠の位置に入り、入れたら1つ右へ進む
      const c = cursorIndex();
      snapshot();
      if (c < state.concealed.length) {
        state.concealed[c] = id;
        state.lastAdded = { where: 'hand', index: c };
      } else if (state.concealed.length < need()) {
        state.concealed.push(id);
        state.lastAdded = { where: 'hand', index: state.concealed.length - 1 };
      } else {
        state.win = id;
        state.lastAdded = { where: 'win' };
      }
      state.cursor = null;
      // 手牌とアガリ牌がそろったら、キーボードを閉じて結果を広く見せる（牌をタップすればまた開く）
      if (state.concealed.length === need() && state.win != null) state.kbFolded = true;
    }
  }
  state.sample = false;
  state.cam.sel = null;
  update();
  // 鳴きを入れて卓の段が増えたときなども、手牌がキーボードに隠れないように
  if (!state.kbFolded) revealTable();
  return undefined;
}

// ---------- 描画 ----------
/** 画面上部の「条件/ルール 設定」。写真の画面と同じもの（ドラ・その他は同じシートを開く） */
function renderRulesBar() {
  $('rules-bar').innerHTML = chipsHTML();
}

/**
 * スマホではキーボードを画面の下に重ねて出すので、その高さぶんページの下に余白を足す
 * （結果をキーボードより上までスクロールできるように）。閉じているときは「牌を入力」ボタンのぶん
 */
function syncKbSpace() {
  const root = document.documentElement;
  const kb = $('keyboard');
  const btn = $('kb-open');
  let h = 0;
  if (state.mode === 'manual' && kb) {
    if (!kb.hidden) h = getComputedStyle(kb).position === 'fixed' ? kb.getBoundingClientRect().height : 0;
    else if (btn && !btn.hidden) h = btn.getBoundingClientRect().height + 24;
  }
  root.style.setProperty('--kb-space', `${Math.ceil(h)}px`);
}

/** キーボードを開いたとき、手牌がキーボードの下に隠れていたら見える位置までスクロールする */
function revealTable() {
  requestAnimationFrame(() => {
    const t = $('table');
    const kb = $('keyboard');
    if (!t || !kb || kb.hidden || state.mode !== 'manual' || getComputedStyle(kb).position !== 'fixed') return;
    const r = t.getBoundingClientRect();
    const limit = kb.getBoundingClientRect().top - 8;
    if (r.bottom > limit) window.scrollBy({ top: r.bottom - limit, behavior: 'smooth' });
  });
}

function renderTable() {
  const s = state.situation;
  renderRulesBar();
  const n = need();
  $('count-label').innerHTML =
    `手牌 <strong>${state.concealed.length}/${n}</strong>` +
    (state.win != null ? ' ＋アガリ牌' : '') +
    (state.melds.length ? `　鳴き <strong>${state.melds.length}</strong>` : '');
  $('sample-tag').hidden = !state.sample;

  const la = state.lastAdded;
  // 手元を見ながら入れるので並べ替えはしない（実物と同じ並びのまま）
  const cur = cursorIndex();
  const parts = [];
  for (let i = 0; i < n; i++) {
    const id = state.concealed[i];
    const on = i === cur ? ' active' : '';
    if (id == null) {
      parts.push(`<button type="button" class="slot${on}" data-action="hand-sel" data-index="${i}" aria-label="左から${i + 1}枚目を入れる"></button>`);
    } else {
      const extra = la && la.where === 'hand' && la.index === i ? 'just-in' : '';
      parts.push(
        `<button type="button" class="hand-tile${on}" data-action="hand-sel" data-index="${i}" aria-label="左から${i + 1}枚目 ${tileLabel(id)}（タップで入れ直す）">${tileHTML(id, { size: 'hand', extra })}</button>`,
      );
    }
  }
  // アガリ形のときだけ ロン/ツモ。それ以外（1シャンテンなど）は「来た牌」
  const winLabel = view.analysis && view.analysis.agari ? (state.situation.tsumo ? 'ツモ' : 'ロン') : '来た牌';
  const winOn = cur >= n ? ' active' : '';
  const winTile =
    state.win != null
      ? `<button type="button" class="hand-tile${winOn}" data-action="hand-sel" data-index="win" aria-label="アガリ牌 ${tileLabel(state.win)}（タップで入れ直す）">${tileHTML(state.win, { size: 'hand', extra: la && la.where === 'win' ? 'just-in' : '' })}</button>`
      : `<button type="button" class="slot${winOn}" data-action="hand-sel" data-index="win" aria-label="アガリ牌を入れる"></button>`;
  parts.push(
    `<span class="win-slot">${winTile}<span class="win-caption${state.win != null ? ' on' : ''}">${state.win != null ? winLabel : 'アガリ牌'}</span></span>`,
  );
  $('hand').innerHTML = parts.join('');

  $('melds').innerHTML = state.melds
    .map((m, i) => {
      const tiles =
        m.type === 'ankan'
          ? [
              tileHTML(m.tiles[0], { size: 'hand', back: true }),
              tileHTML(m.tiles[1], { size: 'hand' }),
              tileHTML(m.tiles[2], { size: 'hand' }),
              tileHTML(m.tiles[3], { size: 'hand', back: true }),
            ]
          : m.tiles.map((id, k) => tileHTML(id, { size: 'hand', side: k === 0 }));
      const pop = la && la.where === 'meld' && la.index === i ? ' just-in' : '';
      return `<button type="button" class="meld${pop}" data-action="remove" data-where="meld" data-index="${i}" aria-label="${MELD_LABELS[m.type]}を削除"><span class="meld-tiles">${tiles.join('')}</span><span class="meld-label">${MELD_LABELS[m.type]}</span></button>`;
    })
    .join('');
}

function renderKeyboard() {
  const targets = state.rules.sanma ? TARGETS.filter(([k]) => k !== 'chi') : TARGETS;
  if (!targets.some(([k]) => k === state.target)) state.target = 'hand';
  const open = !state.kbFolded;
  $('keyboard').hidden = !open;
  $('kb-open').hidden = open;
  $('manual-view').dataset.kb = open ? 'open' : 'closed';
  $('kb-tabs').innerHTML = targets
    .map(
      ([key, label]) =>
        `<button type="button" class="kb-tab" role="tab" aria-selected="${state.target === key}" data-action="target" data-target="${key}">${label}</button>`,
    )
    .join('');

  const t = state.target;
  let hint;
  if (t === 'hand') {
    const c = cursorIndex();
    if (c < state.concealed.length) hint = `赤い枠（左から${c + 1}枚目）を入れ直します`;
    else if (state.concealed.length < need()) hint = `左から${c + 1}枚目。実際の並びのまま入れてOK`;
    else if (state.win == null) hint = '次にタップした牌がアガリ牌になります';
    else hint = 'アガリ牌を入れ直します（赤い枠）';
  } else if (t === 'chi') hint = '順子の一番小さい牌をタップ（3萬 → 345萬）';
  else hint = `${MELD_LABELS[t]}した牌をタップ`;
  const redBtn = MELD_TYPES.has(t)
    ? `<button type="button" class="red-toggle" data-action="meld-red" aria-pressed="${state.meldRed}">赤5入り</button>`
    : replacingTile() != null
      ? '<button type="button" class="del-btn" data-action="hand-del">この牌を消す</button>'
      : '';
  $('kb-hint').innerHTML = `<span>${hint}</span>${redBtn}`;

  const rep = replacingTile();
  const all = rep == null ? scopeFor(t) : withoutOne(scopeFor(t), rep);
  const used = countsOf(all);
  const redsUsed = new Set(all.filter(isRed));
  const keys = KEY_ROWS.flatMap((row) =>
    row.map((id) => {
      const ok = keyAvailable(id, used, redsUsed);
      return `<button type="button" class="key" data-action="key" data-id="${id}" aria-label="${tileLabel(id)}"${ok ? '' : ' disabled'}>${tileHTML(id, { size: 'key' })}</button>`;
    }),
  );
  keys.push(
    `<button type="button" class="key act" data-action="undo" aria-label="1つ戻す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>戻す</button>`,
    `<button type="button" class="key act wide" data-action="clear">全消去</button>`,
  );
  $('kb-grid').innerHTML = keys.join('');
  syncKbSpace();
}

/** 1シャンテン: 引く牌 → 切る牌 → 待ち */
function drawListHTML(draws, limitOptions = 2) {
  return `<ul class="draw-list">${draws
    .map((d) => {
      const opts = d.options
        .slice(0, limitOptions)
        .map(
          (o) =>

}

function renderVerdict(a) {

      `<div class="notice err"><ul>${a.errors.map((e) => `<li>${e}</li>`).join('')}</ul></div>`;
  } else if (a.phase === 'incomplete') {

    html =
      `<div class="eyebrow">入力中</div><div class="big">あと<span class="num">${a.missing}</span><span class="unit">枚</span></div>` +
      `<p class="sub">手牌 <b>${state.concealed.length}/${a.need}</b> 枚${k ? `（鳴き${k}組）` : ''}。${a.need}枚でシャンテン数と待ち、アガリ牌まで入れると点数を出します。</p>` +
      (allInputTiles().length === 0 ? '<button type="button" class="start-btn" data-action="sample">サンプル手牌を読み込む</button>' : '');
    if (a.hidden) {
      const h = a.hidden;
      html +=
        `<div class="section-title">${a.count}枚の問題として見ると<span>鳴き${h.k}組を省略</span></div>` +
        `<p class="sub"><b>テンパイ</b>・待ち <b>${h.waits.length}種</b>（点数は${a.need}枚そろえるか鳴きを入れると表示）</p>` +
        `<div class="uke-grid">${h.waits
          .map((w) => `<span class="uke">${tileHTML(w.tile, { size: 'sm' })}</span>`)
          .join('')}</div>`;
    }
  } else {
    const r = a.phase === 'hand13' ? verdict13(a) : verdict14(a);
    cls += r.cls;
    html = r.html;
  }
  if (a.warnings && a.warnings.length) html += `<div class="notice">${a.warnings.join('<br>')}</div>`;
  el.className = cls;
  el.innerHTML = html;
}

function renderManual(a) {

}

// ---------- 操作 ----------
function handleManual(el) {
  const d = el.dataset;
  switch (d.action) {
    case 'key': return addTile(+d.id);
    case 'undo': return undo();
    case 'clear': return clearHand();
    case 'target':
      state.target = d.target;
      state.kbFolded = false;
      return renderKeyboard();
    case 'remove': return removeAt(d.where, +d.index);
    case 'hand-sel': {
      // 手牌の牌・空きをタップ → その位置に入れる（閉じていたらキーボードを開く）
      const wasFolded = state.kbFolded;
      state.cursor = d.index === 'win' ? need() : Math.min(+d.index, state.concealed.length);
      state.target = 'hand';
      state.lastAdded = null;
      state.kbFolded = false;
      update();
      if (wasFolded) revealTable();
      return undefined;
    }
    case 'hand-del': {
      const c = cursorIndex();
      if (c < state.concealed.length) return removeAt('hand', c);
      if (state.win != null) return removeAt('win', 0);
      return undefined;
    }
    case 'sample':
      snapshot();
      applyDemo('agari');
      return update();
    case 'meld-red':
      state.meldRed = !state.meldRed;
      return renderKeyboard();
    case 'fold':
      state.kbFolded = true;
      return renderKeyboard();
    case 'kb-open':
      state.kbFolded = false;
      renderKeyboard();
      revealTable();
      return undefined;
    default:
      return undefined;
  }
}

let sampleFn = null;

async function initSample() {

// 新しく撮るときは、デモの手牌や前の手牌を片付ける（「戻す」で復元できる）
function clearForNewCapture() {
  if (!state.concealed.length && state.win == null && !state.melds.length && !cam.draft) return false;
  snapshot();
  state.concealed = [];
  state.win = null;
  state.melds = [];
