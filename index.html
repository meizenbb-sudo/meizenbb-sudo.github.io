// ---------- ライブカメラ ----------
let stream = null;
let liveError = '';

/** このページにカメラの利用が許可されているか（分からなければ null）。
 *  埋め込まれたページ（Claudeの画面の中など）では、埋め込み元が許可しないとカメラを使えない */
function cameraAllowedByPolicy() {
  const pp = document.permissionsPolicy || document.featurePolicy;
  if (!pp || typeof pp.allowsFeature !== 'function') return null;
  try {
    return pp.allowsFeature('camera');
  } catch (e) {
    return null;
  }
}

const inFrame = () => {
  try {
    return window.self !== window.top;
  } catch (e) {
    return true;
  }
};

async function startLive() {
  cam.source = 'live';
  cam.live = 'starting';
  cam.pop = null;
  liveError = '';
  if (state.sample && clearForNewCapture()) update();
  else renderCamera(view.analysis);
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('unsupported'), { name: 'Unsupported' });
    if (cameraAllowedByPolicy() === false) throw Object.assign(new Error('blocked'), { name: 'BlockedByPolicy' });
    let timer = 0;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(Object.assign(new Error('timeout'), { name: 'Timeout' })), 10000);
    });
    const request = navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
    try {
      stream = await Promise.race([request, timeout]);
    } finally {
      clearTimeout(timer);
    }
    if (cam.source !== 'live') {
      stopLive();
      return;
    }
    const v = $('cam-video');
    v.srcObject = stream;
    await v.play().catch(() => {});
    cam.live = 'on';
    track('camera_open');
  } catch (e) {
    stopLive();
    liveError = (e && e.name) || 'Error';
    cam.live = 'failed';
  }
  renderCamera(view.analysis);
}

function liveFailureText(reason) {
  const framed = inFrame();
  switch (reason) {
    case 'BlockedByPolicy':
      return 'Claudeの画面の中では、カメラの利用が許可されていません。';
    case 'NotAllowedError':
    case 'SecurityError':
      return framed
        ? 'カメラの利用が許可されませんでした（Claudeの画面の中では使えないことがあります）。'
        : 'カメラの利用が許可されませんでした。ブラウザの設定で許可すると使えます。';
    case 'NotFoundError':
    case 'OverconstrainedError':
      return '使えるカメラが見つかりませんでした。';
    case 'NotReadableError':
      return 'カメラをほかのアプリが使っているため起動できませんでした。';
    case 'Timeout':
      return 'カメラが起動しませんでした（許可の確認が表示されない画面の可能性があります）。';
    case 'Unsupported':
      return 'この画面ではカメラの機能が使えません。';
    default:
      return 'カメラを起動できませんでした。';
  }
}

function stopLive() {
  if (stream) {
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }
  const v = $('cam-video');
  if (v) v.srcObject = null;
  if (cam.live !== 'failed') cam.live = 'off';
}

function retake() {
  // 読み取りの計算中に重ねて押された分は、終わった直後に「撮り直す」に届く。読んだ画像をすぐ捨てないように受け付けない
  if (performance.now() - lastReadEnd < AFTER_READ_MS) return;
  cam.read = false;
  if (cam.source === 'live' && stream) {
    resumeLive();
    renderCamera(view.analysis);
  } else if (cam.source === 'photo') {
    renderCamera(view.analysis);
    openPicker();
  }
}

/** カメラの映像を押した瞬間の画像で止める（何を読んだか見えるように。シャッターを切った手ごたえにもなる） */
function freezeLive() {
  const v = $('cam-video');
  try {
    v.pause();
  } catch (e) {
    /* 止められなくても読み取りはできる */
  }
  cam.live = 'frozen';
}

// ---------- スマホを横にして撮る ----------
// 横にすると手牌の列が画面の長い辺に沿うので、縦のときの半分ほどの距離から撮れる。
// ブラウザでは画面の向きを勝手に変えられない（iPhone の Safari は未対応）ので、スマホを横にしたらカメラだけの画面にする
const landMQ = typeof matchMedia === 'function' ? matchMedia('(orientation: landscape) and (max-height: 560px)') : null;

function setLandCapture(on) {
  const root = document.documentElement;
  if (root.hasAttribute('data-cam-land') !== on) root.toggleAttribute('data-cam-land', on);
}

// Android のホーム画面のアプリ（画面の向きを固定できる環境）では、カメラで撮る間だけ横向きにし、読み取ったら縦に戻す
let lockedTo = null;
let lockUnsupported = false;
function lockOrientation(kind) {
  if (lockUnsupported || lockedTo === kind) return;
  const so = typeof screen !== 'undefined' ? screen.orientation : null;
  if (!so || typeof so.lock !== 'function' || !isStandalone()) {
    lockUnsupported = true;
    return;
  }
  lockedTo = kind;
  so.lock(kind).catch(() => {
    lockedTo = null;
    lockUnsupported = true;
  });
}
function unlockOrientation() {
  if (lockedTo == null) return;
  lockedTo = null;
  try {
    screen.orientation.unlock();
  } catch (e) {
    /* 戻せなくても使える */
  }
}

/** 止めたカメラの映像を動かし直す */
function resumeLive() {
  if (!stream) return;
  $('cam-video').play().catch(() => {});
  cam.live = 'on';
}

/** 撮った合図（枠が一瞬白く光る）。opacity のアニメーションなので、重い処理の間も止まらない */
function flashStage() {
  const f = $('cam-flash');
  if (!f) return;
  f.classList.remove('on');
  void f.offsetWidth; // アニメーションを最初からやり直す
  f.classList.add('on');
}

/**
 * 画面が描き直されるのを待つ。読み取りは重い計算を一気にするので、その前に「読み取り中」を確実に画面に出す
 * （setTimeout(0) だけだと、描き直す前に計算が始まって、押しても何も起きていないように見える）
 */
function nextPaint() {
  return new Promise((resolve) => {
    let done = false;
    const fin = () => {
      if (done) return;
      done = true;
      resolve();
    };
    requestAnimationFrame(() => requestAnimationFrame(fin));
    setTimeout(fin, 150); // 画面が隠れているなどで requestAnimationFrame が来ないとき
  });
}

/**
 * 「リセット」: 牌のチップと認識の結果を消して、「認識する」を押す前に戻す。
 * 写真の画面では写真とその位置を残す。カメラの画面では止めた映像を動かし直す（すぐ撮り直せるように）。
 * ドラ・リーチ・ツモなどの条件はそのまま（条件は「条件/ルール 設定」のリセットで別に消す）。
 * 確認は出さずにすぐ消し、数秒だけ「元に戻す」を出す
 */
function resetRead() {
  if (cam.busy) return;
  const prev = {
    photoUrl: cam.photoUrl,
    sample: state.sample,
    cam: { read: cam.read, recog: cam.recog, cands: cam.cands, sortPerm: cam.sortPerm, note: cam.note },
  };
  snapshot();
  const seq = historySeq();
  Object.assign(state, { concealed: [], win: null, melds: [], sample: false });
  Object.assign(cam, { draft: null, sel: null, recog: null, cands: null, sortPerm: null, pop: null, note: '', read: false });
  if (cam.source === 'live' && cam.live === 'frozen') resumeLive();
  update();
  toast('リセットしました', 5000, {
    label: '元に戻す',
    run: () => {
      // リセットのあとに別の操作（認識・牌の追加・別の写真など）をしていたら、その結果は消さない
      if (historySeq() !== seq || cam.photoUrl !== prev.photoUrl || cam.busy) {
        toast('リセットのあとに操作したため、元に戻せませんでした');
        return;
      }
      Object.assign(cam, prev.cam);
      state.sample = prev.sample;
      undo(); // 牌（手牌・アガリ牌・鳴き・読めなかった牌）を戻して描き直す
    },
  });
}

/** アルバムを開く（タップの中で呼ぶ。同じ写真をもう一度選べるように値は消す） */
function openPicker() {
  const el = $('file-pick');
  if (!el) return;
  el.value = '';
  el.click();
}

// ---------- 写真 ----------
function loadPhoto(file) {
  stopLive();
  // 公開ページでは blob: の画像が使えない場合があるため data: URL で表示する
  const reader = new FileReader();
  reader.onerror = () => toast('この画像は読み込めませんでした');
  reader.onload = () => {
    track('photo_select');
    Object.assign(cam, { source: 'photo', photoUrl: String(reader.result), photoSize: null, zoom: 1, panX: 0, panY: 0, angle: 0, pop: null, note: '', read: false });
    // 別の写真を選んだら前の手牌は消す（「認識済み」でないのに牌のチップだけ残っていると紛らわしい）
    clearForNewCapture();
    update();
    const img = $('cam-photo');
    img.onload = () => {
      cam.photoSize = { w: img.naturalWidth, h: img.naturalHeight };
      renderCamera(view.analysis);
    };
    img.onerror = () => {
      cam.photoUrl = null;
      cam.photoSize = null;
      toast('この画像は開けませんでした');
      renderCamera(view.analysis);
    };
    img.src = cam.photoUrl;
    renderCamera(view.analysis);
  };
  reader.readAsDataURL(file);
}

/**
 * 写真を時計回りに90度回す（縦に撮った手牌を横一列に）。
 * 回した画像を data: URL に作り直すので、表示・枠の位置・読み取りは同じ仕組みのまま使える。
 * canvas の画素数の上限（iOS は約1670万）を超える写真は半分に縮めて回す
 */
function rotatePhoto() {
  if (cam.source !== 'photo' || !cam.photoSize || cam.busy) return;
  const img = $('cam-photo');
  const { w, h } = cam.photoSize;
  let s = 1;
  while (w * s * (h * s) > 16000000) s /= 2;
  const cw = Math.round(h * s);
  const ch = Math.round(w * s);
  let url = null;
  try {
    const canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.translate(cw, 0);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(img, 0, 0, w * s, h * s);
    url = canvas.toDataURL('image/jpeg', 0.95);
    canvas.width = 0;
    canvas.height = 0;
  } catch (e) {
    url = null;
  }
  if (!url || url.length < 64) return toast('この写真は回転できませんでした');
  cam.rotation = ((cam.rotation | 0) + 90) % 360;
  Object.assign(cam, { photoUrl: url, photoSize: null, zoom: 1, panX: 0, panY: 0, angle: 0, read: false, note: '' });
  img.onload = () => {
    cam.photoSize = { w: img.naturalWidth, h: img.naturalHeight };
    renderCamera(view.analysis);
  };
  img.src = url;
  renderCamera(view.analysis);
  return undefined;
}

function photoRect() {
  const st = $('cam-stage');
  if (!cam.photoSize || !st) return null;
  const W = st.clientWidth;
  const H = st.clientHeight;
  const w = W * cam.zoom;
  const h = ((W * cam.photoSize.h) / cam.photoSize.w) * cam.zoom;
  return { left: (W - w) / 2 + cam.panX, top: H - h + cam.panY, w, h };
}

function applyPhotoTransform() {
  const r = photoRect();
  if (!r) return;
  // 2本指で回した角度（cam.angle 度・時計回りが正）。写真の真ん中を軸に回して見せ、読み取りも見えているとおりに回して読む
  Object.assign($('cam-photo').style, {
    width: `${r.w}px`,
    height: `${r.h}px`,
    left: `${r.left}px`,
    top: `${r.top}px`,
    transform: cam.angle ? `rotate(${cam.angle}deg)` : '',
  });
  const lv = $('cam-level');
  if (lv) {
    const on = cam.source === 'photo' && !!cam.photoSize && !cam.busy && !!cam.angle;
    const was = !lv.hidden;
    lv.hidden = !on;
    if (on) lv.querySelector('b').textContent = `${cam.angle > 0 ? '+' : '−'}${Math.abs(Math.round(cam.angle))}°`;
    // 角度が 0 ⇔ 0 以外に変わったときは、枠の案内の文も切り替える
    if (was !== on && !cam.read) {
      const lb = $('roi-label');
      lb.innerHTML = on ? '' : '指で動かして枠の中へ<small>・2本指で拡大・回転</small>';
      lb.classList.toggle('photo-hint', !on);
    }
  }
}

// 写真の角度: -180〜180 度に収める。指で回すときは 0度の近くを 0 に吸い付ける（まっすぐに戻しやすいように）
const ANGLE_SNAP = 1.5;
function normAngle(a, snap = true) {
  let v = ((((a + 180) % 360) + 360) % 360) - 180;
  if (snap && Math.abs(v) < ANGLE_SNAP) v = 0;
  return Math.round(v * 10) / 10;
}

const pointers = new Map();
let gesture = null;
function gestureBaseline() {
  const pts = [...pointers.values()];
  const mid = pts.reduce((m, p) => ({ x: m.x + p.x / pts.length, y: m.y + p.y / pts.length }), { x: 0, y: 0 });
  const dist = pts.length > 1 ? Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) : 0;
  const ang = pts.length > 1 ? Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x) : 0;
  gesture = { mid, dist, ang, angle: cam.angle || 0, panX: cam.panX, panY: cam.panY, zoom: cam.zoom };
}
function onPointerDown(e) {
  if (cam.source !== 'photo' || !cam.photoSize || cam.busy || cam.pop) return;
  if (e.target.closest('button, label, input, .pop, .cam-overlay, .cam-top')) return;
  try {
    e.currentTarget.setPointerCapture(e.pointerId);
  } catch (err) {
    /* 取り込めなくても動かせる */
  }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  gestureBaseline();
}
function onPointerMove(e) {
  if (!pointers.has(e.pointerId) || !gesture) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const pts = [...pointers.values()];
  const mid = pts.reduce((m, p) => ({ x: m.x + p.x / pts.length, y: m.y + p.y / pts.length }), { x: 0, y: 0 });
  if (pts.length > 1 && gesture.dist > 0) {
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    cam.zoom = Math.max(1, Math.min(5, (gesture.zoom * dist) / gesture.dist));
    // 2本の指を結ぶ線が回った分だけ写真を回す（テレビ中継の画面など、手牌が斜めに写った写真を枠と平行に）
    const ang = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
    let d = ((ang - gesture.ang) * 180) / Math.PI;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    const next = normAngle(gesture.angle + d);
    if (next && !cam.angle) cam.tilted = true;
    cam.angle = next;
  }
  cam.panX = gesture.panX + (mid.x - gesture.mid.x);
  cam.panY = gesture.panY + (mid.y - gesture.mid.y);
  applyPhotoTransform();
}
function onPointerUp(e) {
  if (!pointers.delete(e.pointerId)) return;
  if (pointers.size) gestureBaseline();
  else {
    gesture = null;
    // 回したことを数える（回す操作が使われているか。角度そのものは送らない）
    if (cam.tilted) {
      cam.tilted = false;
      track('photo_tilt');
    }
  }
}
function onWheel(e) {
  if (cam.source !== 'photo' || !cam.photoSize) return;
  e.preventDefault();
  if (e.shiftKey || e.altKey) {
    // パソコン: Shift（または Alt）を押しながらホイールで1度ずつ回す
    const d = e.deltaY || e.deltaX;
    if (d) cam.angle = normAngle((cam.angle || 0) + (d < 0 ? -1 : 1), false);
    applyPhotoTransform();
    return;
  }
  cam.zoom = Math.max(1, Math.min(5, cam.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  applyPhotoTransform();
}

// ---------- 読み取り ----------
function roiRect() {
  const st = $('cam-stage').getBoundingClientRect();
  const r = $('roi').getBoundingClientRect();
  return { x: r.left - st.left, y: r.top - st.top, w: r.width, h: r.height };
}

async function captureRoi() {
  const roi = roiRect();
  let src;
  let natW;
  let natH;
  let sx;
  let sy;
  let sw;
  let sh;
  if (cam.source === 'live') {
    src = $('cam-video');
    natW = src.videoWidth;
    natH = src.videoHeight;
    if (!natW || !natH) throw new Error('no-frame');
    const st = $('cam-stage');
    const scale = Math.max(st.clientWidth / natW, st.clientHeight / natH);
    const ox = (st.clientWidth - natW * scale) / 2;
    const oy = (st.clientHeight - natH * scale) / 2;
    [sx, sy, sw, sh] = [(roi.x - ox) / scale, (roi.y - oy) / scale, roi.w / scale, roi.h / scale];
  } else {
    src = $('cam-photo');
    const pr = photoRect();
    if (!pr) throw new Error('no-photo');
    natW = cam.photoSize.w;
    natH = cam.photoSize.h;
    const k = natW / pr.w;
    [sx, sy, sw, sh] = [(roi.x - pr.left) * k, (roi.y - pr.top) * k, roi.w * k, roi.h * k];
  }
  const x0 = Math.max(0, sx);
  const y0 = Math.max(0, sy);
  const x1 = Math.min(natW, sx + sw);
  const y1 = Math.min(natH, sy + sh);
  if (x1 - x0 < 16 || y1 - y0 < 8) throw new Error('outside');
  const outW = Math.min(1600, Math.round(x1 - x0));
  const outH = Math.max(1, Math.round((outW * (y1 - y0)) / (x1 - x0)));
  const canvas = document.createElement('canvas');
  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext('2d');
  if (cam.source === 'photo' && cam.angle) {
    // 2本指で回した写真: 画面に見えているとおり（回したまま）に枠の中を描く
    const pr = photoRect();
    const k = natW / pr.w;
    const sc = outW / roi.w;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, outW, outH);
    ctx.scale(sc, sc);
    ctx.translate(pr.left + pr.w / 2 - roi.x, pr.top + pr.h / 2 - roi.y);
    ctx.rotate((cam.angle * Math.PI) / 180);
    ctx.scale(1 / k, 1 / k);
    ctx.drawImage(src, -natW / 2, -natH / 2, natW, natH);
  } else ctx.drawImage(src, x0, y0, x1 - x0, y1 - y0, 0, 0, outW, outH);
  return new Promise((resolve, reject) => {
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('blob'))), 'image/jpeg', 0.92);
  });
}

const DENIED = new Set(['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'images_unavailable']);

// ---------- 端末内の読み取り（通信なし） ----------
const FLOWER_ID = 37; // 花牌（抜きドラ）。手牌からは外す
// 手牌として読めなかったときの案内（写真が手牌でない・小さすぎる・暗いなど）
const REJECT_TEXT = {
  noRow: '手牌が見つかりませんでした。枠の中に手牌を横一列に入れて撮り直してください（「＋」から手で入力もできます）',
  tooFew: '手牌として読める牌が足りませんでした。手牌が枠いっぱいに入るように撮り直してください',
  impossible: '同じ牌が5枚以上になりました。手牌の写真か確認して、はっきり写るように撮り直してください',
  unsure: '牌をはっきり読み取れませんでした。明るい場所で、手牌を枠いっぱいに入れて撮り直してください',
};
const MIN_P = 0.45; // これより自信がなければ「？」にして直してもらう
const MAX_W = 2600; // 読み取りに使う画像の最大の幅
let tileModel = null;
let modelBroken = false;

function getTileModel() {
  if (!tileModel && !modelBroken) {
    try {
      tileModel = new TileModel(MODEL_DATA);
    } catch (e) {
      modelBroken = true;
    }
  }
  return tileModel;
}

/** 映っている画像そのものの画素と、読み取り枠の位置（画素の座標）を返す */
function sourcePixels() {
  const roi = roiRect();
  let src;
  let natW;
  let natH;
  let sx;
  let sy;
  let sw;
  let sh;
  if (cam.source === 'live') {
    src = $('cam-video');
    natW = src.videoWidth;
    natH = src.videoHeight;
    if (!natW || !natH) throw new Error('no-frame');
    const st = $('cam-stage');
    const scale = Math.max(st.clientWidth / natW, st.clientHeight / natH);
    const ox = (st.clientWidth - natW * scale) / 2;
    const oy = (st.clientHeight - natH * scale) / 2;
    [sx, sy, sw, sh] = [(roi.x - ox) / scale, (roi.y - oy) / scale, roi.w / scale, roi.h / scale];
  } else {
    src = $('cam-photo');
    const pr = photoRect();
    if (!pr) throw new Error('no-photo');
    natW = cam.photoSize.w;
    natH = cam.photoSize.h;
    const k = natW / pr.w;
    if (cam.angle) return rotatedPixels(src, natW, natH, pr, roi, k);
    [sx, sy, sw, sh] = [(roi.x - pr.left) * k, (roi.y - pr.top) * k, roi.w * k, roi.h * k];
  }
  const f = Math.min(1, MAX_W / natW);
  const cw = Math.max(1, Math.round(natW * f));
  const ch = Math.max(1, Math.round(natH * f));
  // 縮小は canvas に任せず（細い線が飛ぶ）、元の大きさで取り出してから自前の面積平均で縮める。
  // 元の大きさの canvas が作れない環境（画素数の上限）では、従来どおり canvas で縮小する
  let img = null;
  if (f < 1) {
    try {
      // canvas の画素数の上限（iOS は約1670万）に収まる大きさで取り出す。
      // 4800万画素などの写真は、まず半分（滑らかな縮小）にしてから自前の面積平均で縮める
      const LIMIT = 16000000;
      let pw = natW;
      let ph = natH;
      while (pw * ph > LIMIT) {
        pw = Math.round(pw / 2);
        ph = Math.round(ph / 2);
      }
      const full = document.createElement('canvas');
      full.width = pw;
      full.height = ph;
      const fctx = full.getContext('2d', { willReadFrequently: true });
      fctx.imageSmoothingEnabled = true;
      fctx.imageSmoothingQuality = 'high';
      fctx.drawImage(src, 0, 0, pw, ph);
      // 半分にした結果が目標より小さくなったときは、その大きさのまま使う（枠の倍率は下で実寸から計算）
      img = pw > cw ? fromRGBAScaled(fctx.getImageData(0, 0, pw, ph), cw, ch) : fromRGBA(fctx.getImageData(0, 0, pw, ph));
      full.width = 0;
      full.height = 0;
    } catch (e) {
      img = null;
    }
  }
  if (!img) {
    const canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, 0, 0, cw, ch);
    img = fromRGBA(ctx.getImageData(0, 0, cw, ch));
  }
  const fx = img.w / natW;
  const fy = img.h / natH;
  const clampX = (v) => Math.min(img.w - 1, Math.max(0, v * fx));
  const clampY = (v) => Math.min(img.h - 1, Math.max(0, v * fy));
  return {
    img,
    roi: { x0: clampX(sx), x1: clampX(sx + sw), y0: clampY(sy), y1: clampY(sy + sh) },
  };
}

/**
 * 2本指で回した写真を、画面に見えているとおりに回して描いた画像と、その中での読み取り枠の位置。
 * 画像の大きさは回した写真の外接長方形（はみ出した所は黒）。縮小は回さない写真と同じく、なるべく大きく描いてから
 * 自前の面積平均で縮める（canvas の縮小に任せると細い線が飛ぶ）
 */
function rotatedPixels(src, natW, natH, pr, roi, k) {
  const rad = (cam.angle * Math.PI) / 180;
  const c = Math.abs(Math.cos(rad));
  const s = Math.abs(Math.sin(rad));
  const RW = natW * c + natH * s;
  const RH = natW * s + natH * c;
  const LIMIT = 16000000; // canvas の画素数の上限（iOS は約1670万）
  let d = 1;
  while (RW * d * (RH * d) > LIMIT) d /= 2;
  const pw = Math.max(1, Math.round(RW * d));
  const ph = Math.max(1, Math.round(RH * d));
  const canvas = document.createElement('canvas');
  canvas.width = pw;
  canvas.height = ph;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, pw, ph);
  ctx.translate(pw / 2, ph / 2);
  ctx.rotate(rad);
  ctx.drawImage(src, (-natW * d) / 2, (-natH * d) / 2, natW * d, natH * d);
  const f = Math.min(1, MAX_W / RW);
  const cw = Math.max(1, Math.round(RW * f));
  const ch = Math.max(1, Math.round(RH * f));
  const data = ctx.getImageData(0, 0, pw, ph);
  const img = pw > cw ? fromRGBAScaled(data, cw, ch) : fromRGBA(data);
  canvas.width = 0;
  canvas.height = 0;
  // 画面の点 → 写真の真ん中からのずれ（画面の1画素 = 元の写真の k 画素）→ 回した画像の中の位置
  const fx = img.w / RW;
  const fy = img.h / RH;
  const cx = pr.left + pr.w / 2;
  const cy = pr.top + pr.h / 2;
  const toX = (x) => Math.min(img.w - 1, Math.max(0, ((x - cx) * k + RW / 2) * fx));
  const toY = (y) => Math.min(img.h - 1, Math.max(0, ((y - cy) * k + RH / 2) * fy));
  return { img, roi: { x0: toX(roi.x), x1: toX(roi.x + roi.w), y0: toY(roi.y), y1: toY(roi.y + roi.h) } };
}

async function readOnDevice() {
  const model = getTileModel();
  if (!model) return false;
  const live = cam.source === 'live';
  if (live && cam.live === 'on') freezeLive();
  // 'device' = 端末内の計算中（途中で止められないので「中止」は出さない）
  cam.busy = 'device';
  cam.pop = null;
  cam.note = '牌を読み取っています';
  flashStage();
  renderCamera(view.analysis);
  await nextPaint();
  const t0 = Date.now();
  let r = null;
  let srcW = 0; // 写真の横幅（牌が小さく写っていないかの判定に使う）
  let lastRoi = null;
  try {
    const px = sourcePixels();
    srcW = px.img.w;
    lastRoi = px.roi;
    const { x0, x1, y0, y1 } = px.roi;
    r = readHand(px.img, {
      model,
      roi: px.roi,
      fallback: [[x0, y0], [x1, y0], [x1, y1], [x0, y1]],
      flowers: !!state.rules.flowers,
    });
  } catch (e) {
    r = null;
  }
  cam.busy = false;
  if (!r || !r.ok) {
    track('read_ng');
    cam.note = '手牌の列を見つけられませんでした。枠に手牌を合わせて撮り直すか、「＋」から入力してください';
    toast(cam.note);
    if (live) resumeLive(); // 読めなかったときは、すぐ撮り直せるように映像を動かし直す
    renderCamera(view.analysis);
    return true;
  }
  // 手牌でない写真に無理やり牌を当てはめない（風景・人物など）
  const check = checkHand(r, { melds: state.melds.length, minP: MIN_P, flowers: !!state.rules.flowers });
  if (!check.ok) {
    track('read_ng');
    cam.note = REJECT_TEXT[check.reason] || REJECT_TEXT.noRow;
    cam.cands = null;
    toast(cam.note);
    if (live) resumeLive();
    renderCamera(view.analysis);
    return true;
  }
  const flowers = r.tiles.filter((t) => t.id === FLOWER_ID && t.p >= MIN_P).length;
  const tiles = r.tiles.filter((t) => !(t.id === FLOWER_ID && t.p >= MIN_P)).map((t) => (t.p >= MIN_P ? t.id : null));
  const warnings = [];
  if (flowers) {
    if (state.rules.sanma) {
      state.situation.nuki = flowers;
      state.situationTouched = true;
      markSetup('nuki');
      warnings.push(`花牌${flowers}枚を抜きドラとして数えました（手牌からは外しています）`);
    } else {
      warnings.push(`花牌${flowers}枚は手牌から外しました（三人麻雀にすると抜きドラとして数えます）`);
    }
  }
  // 牌が小さく写っていると読み間違えやすいので知らせる
  const tileW = rowSize(r.corners).len / Math.max(1, r.tiles.length);
  if (srcW && tileW < 0.04 * srcW) warnings.push('牌が小さく写っています。手牌が枠いっぱいに入るように撮ると読み取りやすくなります');
  if (r.source === 'fallback') warnings.push('牌の列を自動で見つけられなかったので、枠の位置で読みました');
  if (r.source === 'auto-far') warnings.push('枠から離れた位置にあった手牌を読みました');
  if (r.source === 'roi') warnings.push('枠の中の牌の並びを読みました（牌の背の色が見えないとき）');
  const unsure = tiles.filter((x) => x == null).length;
  if (unsure) warnings.push(`${unsure}枚は自信がないので「？」にしました。タップして選べます`);
  if (tiles.length !== 13 && tiles.length !== 14) {
    const melded = Number.isInteger((13 - tiles.length) / 3) && tiles.length < 13;
    warnings.push(`${tiles.length}枚として読みました。${melded ? '鳴いているときは「鳴きを入れる」から面子を足してください' : '多い・少ないときは牌をタップして直せます'}`);
  }
  // 三人麻雀の設定で 2〜8萬 を読んだら、設定の見直しを促す（三人麻雀にはない牌なので、まず設定違いを疑う）
  const manzu = tiles.filter((id) => id != null && (isSanmaMissing(tileBase(id)) || id === 34)).length;
  if (state.rules.sanma && manzu) {
    warnings.push(`三人麻雀の設定で2〜8萬を${manzu}枚認識しました。見出し横の「四人麻雀」に切り替えると正しく計算できます`);
    setTimeout(() => toast(`三人麻雀の設定で2〜8萬を${manzu}枚認識しました。設定（四人麻雀／三人麻雀）を見直しますか？`, 6000), 50);
  }
  cam.cands = r.tiles.map((t) => t.top);
  track('read_ok');
  cam.note = `端末内のAIで読み取りました（${((Date.now() - t0) / 1000).toFixed(1)}秒）`;
  cam.read = true; // 読み取り後は枠の外を暗くする
  // 確認用（ブラウザでの自動テストが読み取りの内訳を見る）
  if (window.haiyomi) window.haiyomi.lastRead = { source: r.source, n: r.n, corners: r.corners, trimmed: r.trimmed, valign: r.valign, gap: r.gap, confidence: r.confidence, srcW, roi: lastRoi };
  applyRecognition({ tiles, melds: [], win: null, confidence: r.confidence, warnings });
  suggestMeld(tiles.length);
  // 終わったことをはっきり知らせる（三人麻雀の2〜8萬など、ほかのお知らせがあるときはそちらを優先）
  if (!(state.rules.sanma && manzu)) toast(`${tiles.length}枚を読み取りました${unsure ? `（「？」が${unsure}枚）` : ''}`, 1800);
  return true;
}

/** 10枚・7枚・4枚で読めたときは「鳴き」の入力に誘導する（そのままだと枚数が足りない） */
function suggestMeld(n) {
  const k = (13 - n) / 3;
  if (!Number.isInteger(k) || k < 1 || k > 3 || state.melds.length) return;
  cam.pop = 'addmeld';
  renderCamera(view.analysis);
}

// 読み取りが終わった時刻。計算で画面が止まっている間に押された分が、終わったあとで「もう一度認識する」や
// 「撮り直す」にならないように、終わった直後の押し直しは受け付けない（readTiles・retake）
let lastReadEnd = 0;
const AFTER_READ_MS = 600;

async function readTiles() {
  if (cam.busy) return;
  if (performance.now() - lastReadEnd < AFTER_READ_MS) return;
  try {
    if (await readOnDevice()) return;
    return await readCloud();
  } finally {
    lastReadEnd = performance.now();
  }
}

/** クラウドAI（β）で読む。端末内のモデルで読めない絵柄のときの逃げ道 */
async function readCloud() {
  if (cam.busy) return;
  let blob;
  try {
    blob = await captureRoi();
  } catch (e) {
    toast(e.message === 'outside' ? '枠が写真の外にあります。写真をドラッグして手牌を枠に合わせてください' : '画像を取り込めませんでした');
    return;
  }
  if (cam.source === 'live') {
    $('cam-video').pause();
    cam.live = 'frozen';
  }
  if (!sampleFn || !sampleImages) {
    cam.note = '';
    cam.pop = 'add';
    const cleared = clearForNewCapture();
    toast(`この画面では自動読み取りを使えません。写真を見ながら牌をタップしてください${cleared ? '（「戻す」で前の手牌に戻せます）' : ''}`);
    if (cleared) update();
    else renderCamera(view.analysis);
    return;
  }
  cam.busy = true;
  cam.pop = null;
  cam.note = 'AIが牌を読み取っています（数秒〜数十秒）';
  renderCamera(view.analysis);
  readCtl = new AbortController();
  try {
    const out = await sampleFn.json(RECOGNITION_PROMPT, { images: [blob], signal: readCtl.signal, cache: false });
    applyRecognition(parseRecognition(out));
    cam.note = '';
  } catch (e) {
    const code = e && e.code;
    if (code === 'cancelled') cam.note = '読み取りを中止しました';
    else if (DENIED.has(code)) {
      sampleImages = false;
      cam.note = '自動読み取りが許可されていません。牌をタップして入力してください';
    } else if (code === 'rate_limited') cam.note = '読み取りが混み合っています。少し待ってからもう一度お試しください';
    else if (code === 'image_rejected') cam.note = 'この画像は使えませんでした。別の写真でお試しください';
    else if (code === 'invalid_json' || code === 'refused' || code === 'empty_completion') {
      cam.note = '牌を読み取れませんでした。枠に手牌だけが入るように撮り直してください';
    } else cam.note = '読み取りに失敗しました。もう一度お試しください';
    toast(cam.note);
  } finally {
    cam.busy = false;
    readCtl = null;
    renderCamera(view.analysis);
  }
}

function applyRecognition(r) {
  snapshot();
  state.melds = r.melds;
  state.win = r.win;
  cam.draft = r.tiles.some((x) => x == null) ? { tiles: r.tiles.slice() } : null;
  state.concealed = r.tiles.filter((x) => x != null);
  // ツモってきた14枚（鳴き後は11枚など）は、右端の牌をアガリ牌として見る（アガリ形なら点数、違えば切る牌）
  if (!cam.draft && state.win == null && state.concealed.length === need() + 1) state.win = state.concealed.pop();
  markSetup('agari'); // 新しい手牌なので、リーチ・ロン/ツモなどはもう一度OKしてもらう
  state.sample = false;
  cam.sel = null;
  cam.recog = { confidence: r.confidence, warnings: r.warnings };
  cam.sortPerm = null;
  if (cam.sorted) sortNow();
  if (!r.tiles.length && r.win == null) toast('牌が見つかりませんでした。枠に手牌を合わせて撮り直してください');
  update();
}

/**
 * 配牌整理（理牌）。並べ替えた「順番」を覚えておき、OFF にしたら写真と同じ並びへ戻す。
 * 読み取りの候補（cam.cands）も一緒に入れ替えるので、並べ替えても候補は出せる。
 */
function sortPermOf(ids) {
  const order = ids.map((_, i) => i);
  order.sort((a, b) => {
    const x = ids[a];
    const y = ids[b];
    if (x == null && y == null) return a - b;
    if (x == null) return 1;
    if (y == null) return -1;
    return sortKey(x) - sortKey(y) || a - b;
  });
  return order;
}

function applyPerm(perm) {
  if (cam.draft) {
    cam.draft.tiles = perm.map((i) => cam.draft.tiles[i]);
    state.concealed = cam.draft.tiles.filter((x) => x != null);
  } else {
    state.concealed = perm.map((i) => state.concealed[i]);
  }
  if (cam.cands) cam.cands = perm.map((i) => cam.cands[i]);
}

function sortNow() {
  const perm = sortPermOf(handIds());
  applyPerm(perm);
  cam.sortPerm = perm;
}

function unsortNow() {
  const perm = cam.sortPerm;
  cam.sortPerm = null;
  if (!perm || perm.length !== handIds().length) return;
  const back = new Array(perm.length);
  perm.forEach((from, to) => {
    back[from] = to;
  });
  if (back.some((v) => v == null)) return;
  applyPerm(back);
}

function toggleSort() {
  if (!cam.read || handIds().length < 2) {
    return toast('先に「認識する」を押して、手牌を読み取ってください');
  }
  snapshot();
  if (cam.sorted) {
    unsortNow();
    cam.sorted = false;
  } else {
    sortNow();
    cam.sorted = true;
  }
  cam.sel = null;
  return update();
}

// ---------- 手牌の修正 ----------
const handIds = () => (cam.draft ? cam.draft.tiles : state.concealed);

function commitDraft() {
  const d = cam.draft;
  if (!d) return;
  state.concealed = d.tiles.filter((x) => x != null);
  if (d.tiles.every((x) => x != null)) {
    cam.draft = null;
    if (state.win == null && state.concealed.length === need() + 1) state.win = state.concealed.pop();
  }
}

/** 置き換え時は元の牌を除いて4枚制限を確認 */
function limitMessage(id, replacing = null) {
  if (state.rules.sanma && (isSanmaMissing(tileBase(id)) || id === 34)) return '三人麻雀では使わない牌です';
  const all = allInputTiles();
  if (replacing != null) {
    const i = all.indexOf(replacing);
    if (i >= 0) all.splice(i, 1);
  }
  const used = countsOf(all);
  if (used[tileBase(id)] >= 4) return `${tileLabel(tileBase(id))}はすでに4枚使われています`;
  return '';
}

/**
 * ドラ表示牌は王牌からめくるので、手牌に同じ牌があっても選べる。
 * カンをすると同じ表示牌が2枚以上出ることもあるため、表示牌どうしで4枚までだけを見る。
 */
function doraLimitMessage(id) {
  if (state.rules.sanma && (isSanmaMissing(tileBase(id)) || id === 34)) return '三人麻雀では使わない牌です';
  const inds = state.dora.concat(state.ura);
  // ノーマルの5と赤5は同じ牌なので、合わせて4枚まで
  if (countsOf(inds)[tileBase(id)] >= 4) return `${tileLabel(tileBase(id))}は表示牌としてすでに4枚です（赤5をふくめて4枚まで）`;
  return '';
}

function currentEditTile() {
  if (cam.editIndex === 'win') return state.win;
  const ids = handIds();
  return cam.editIndex != null && cam.editIndex < ids.length ? ids[cam.editIndex] : null;
}

function onKey(id) {
  if (cam.pop === 'edit') {
    const cur = currentEditTile();
    const msg = limitMessage(id, cur);
    if (msg) return toast(msg);
    // 利用状況: 読み取った牌を別の牌に直した（読み取りの間違いの目安）
    if (cam.read && id !== cur) track('tile_fix');
    snapshot();
    if (cam.editIndex === 'win') state.win = id;
    else if (cam.draft) {
      cam.draft.tiles[cam.editIndex] = id;
      commitDraft();
    } else state.concealed[cam.editIndex] = id;
    cam.pop = null;
  } else {
    const msg = limitMessage(id);
    if (msg) return toast(msg);
    const before = handIds().length;
    if (before < need()) {
      snapshot();
      if (cam.draft) {
        cam.draft.tiles.push(id);
        commitDraft();
      } else state.concealed.push(id);
      // 手牌がそろった時点で閉じて、待ちを見せる（アガリ牌は「＋」から追加）
      if (before + 1 === need()) cam.pop = null;
    } else if (state.win == null && !cam.draft) {
      snapshot();
      state.win = id;
      cam.pop = null;
    } else {
      return toast('手牌がそろっています。変えたい牌をタップしてください');
    }
  }
  state.sample = false;
  cam.sel = null;
  return update();
}

function deleteEditTile() {
  snapshot();
  if (cam.editIndex === 'win') state.win = null;
  else if (cam.draft) {
    cam.draft.tiles.splice(cam.editIndex, 1);
    commitDraft();
  } else state.concealed.splice(cam.editIndex, 1);
  cam.pop = null;
  cam.sel = null;
  state.sample = false;
  update();
}

function addDora(id) {
  const msg = doraLimitMessage(id);
  if (msg) return toast(msg);
  if (state.dora.length >= 5) return toast('ドラ表示牌は5枚までです');
  snapshot();
  state.dora.push(id);
  state.situationTouched = true;
  markSetup('dora');
  return update();
}

// ---------- デモ ----------
let demoShown = '';
function renderDemoScene() {
  const d = DEMOS.find((x) => x.id === cam.demo) || DEMOS[0];
  if (demoShown === d.id) return;
  demoShown = d.id;
  const tiles = parseTiles(d.tiles).map((id) => tileHTML(id, { size: 'photo' })).join('');
  const win = d.win ? `<span class="demo-gap"></span>${tileHTML(parseTiles(d.win)[0], { size: 'photo' })}` : '';
  $('demo-scene').innerHTML = `<div class="demo-row">${tiles}${win}</div>`;
}

function pickDemo(id) {
  stopLive();
  snapshot();
  cam.pop = null;
  cam.source = 'demo';
  cam.demo = id;
  cam.scanning = true;
  renderCamera(view.analysis);
  setTimeout(
    () => {
      applyDemo(id);
      cam.scanning = false;
      update();
    },
    reduceMotion() ? 0 : 700,
  );
}

/** 上の「カメラ／写真」タブから呼ぶ（入力元の切り替え） */
function setCameraSource(src) {
  if (cam.busy) return;
  if (src === 'live') {
    if (cam.source === 'live' && (cam.live === 'on' || cam.live === 'frozen')) return;
    startLive();
    return;
  }
  const again = src === 'photo' && cam.source === 'photo';
  stopLive();
  unlockOrientation();
  cam.source = src;
  cam.pop = src === 'demo' ? 'demo' : null;
  renderCamera(view.analysis);
  // 写真はアルバムから選ぶ。まだ写真がないとき、または写真タブをもう一度押したときはすぐ開く
  if (src === 'photo' && (!cam.photoUrl || again)) openPicker();
}

// ---------- 表示: 上部の設定 ----------
/** 上の「条件/ルール 設定」の帯（写真の画面・手入力の画面で共通。ドラ・その他は同じシートを開く） */
function chipsHTML() {
  // ドラは表示牌のポップアップ、ルールは計算条件のポップアップへ
  const link = (kind) =>
    kind === 'dora'
      ? `data-action="cam-pop" data-pop="dora" aria-pressed="${cam.pop === 'dora'}"`
      : `data-action="cam-pop" data-pop="settings" aria-pressed="${cam.pop === 'settings'}"`;
  return situationBarHTML(state, link, { table: setupStatus('table'), agari: setupStatus('agari'), ready: scoreReady() });
}

// ---------- 表示: 手牌の上（待ち・テンパイになる牌） ----------
function chipsFor(a) {
  if (!a || cam.draft) return null;
  if (a.phase === 'hand13') {
    const s = a.shanten.min;
    if (s === 0) return { kind: 'wait', items: a.waits, key: (w) => w.tile };
    if (s === 1 && a.tenpaiDraws && a.tenpaiDraws.length) return { kind: 'draw', items: a.tenpaiDraws, key: (d) => d.draw };
    return null;
  }
  if (a.phase === 'hand14' && !a.agari && a.shanten.min <= 1) return { kind: 'discard', items: a.discards, key: (d) => d.discard };
  return null;
}

function ensureSelection(a) {
  const c = chipsFor(a);
  if (!c || !c.items.length) {
    cam.sel = null;
    return;
  }
  if (cam.sel && cam.sel.kind === c.kind && c.items.some((it) => c.key(it) === cam.sel.tile)) return;
  let first = c.items[0];
  if (c.kind === 'draw') {
    const score = (it) => (it.best ? it.best.kinds * 100 + it.best.total : 0); // 待ちの種類が多いものを先に
    first = c.items.reduce((m, it) => (score(it) > score(m) ? it : m), c.items[0]);
  }
  cam.sel = { kind: c.kind, tile: c.key(first) };
}

function chipRow(kind, items) {
  return `<div class="chip-row">${items
    .map((it) => {
      const extra = `${it.rem != null ? `<span class="wc-rem">残${it.rem}</span>` : ''}${it.pt ? `<span class="wc-pt${it.dim ? ' none' : ''}">${it.pt}</span>` : ''}`;
      if (kind === 'uke') return `<span class="wchip static">${tileHTML(it.tile, { size: 'chip' })}${extra}</span>`;
      const on = !!cam.sel && cam.sel.kind === kind && cam.sel.tile === it.tile;
      const label = kind === 'wait' ? `${tileLabel(it.tile)}待ち` : kind === 'draw' ? `${tileLabel(it.tile)}を引いたら` : `${tileLabel(it.tile)}を切ったら`;
      return `<button type="button" class="wchip${kind === 'discard' ? ' cutchip' : ''}" data-action="cam-sel" data-kind="${kind}" data-tile="${it.tile}" aria-pressed="${on}" aria-label="${label}">${tileHTML(it.tile, { size: 'chip' })}${extra}</button>`;
    })
    .join('')}</div>`;
}

function bandHead(title, sub, tone = '') {
  return `<div class="band-head${tone ? ' ' + tone : ''}"><b>${title}</b><span>${sub}</span></div>`;
}

function bandHTML(a) {
  if (cam.busy) return bandHead('読み取り中', cam.note);
  if (cam.scanning) return bandHead('読み取り中', 'デモ画像を読み取っています');
  const ids = handIds();
  if (!ids.length && state.win == null && !state.melds.length) {
    if (mediaMessage()) return '';
    return bandHead('手牌なし', '下の枠に手牌を横一列に入れて読み取ります');
  }
  if (cam.draft) {
    const q = cam.draft.tiles.filter((x) => x == null).length;
    return bandHead('確認', `読み取れなかった牌が${q}枚あります。「？」をタップして直してください`, 'warn');
  }
  if (!a) return '';
  if (a.phase === 'error') return bandHead('入力を確認', a.errors[0], 'err');
  if (a.phase === 'incomplete') return bandHead(`あと${a.missing}枚`, `手牌が${need()}枚そろうとシャンテン数と待ちを表示します`);
  if (a.phase === 'hand13') {
    const s = a.shanten.min;
    if (s === 0) {
      if (!a.waits.length) return bandHead('テンパイ形', '待ち牌を自分で4枚使っているためアガれません', 'warn');
      if (a.hiddenMelds) {
        return (
          bandHead('テンパイ', `待ち ${a.waits.length}種・${a.count}枚（鳴き${a.hiddenMelds}組は省略）として計算`, 'ok') +
          chipRow('wait', a.waits.map((w) => ({ tile: w.tile })))
        );
      }
      const ready = scoreReady();
      // 点数は「アガリ想定」のロン／ツモに合わせる（ツモを選んでいるのにロンの点数を出さない）
      const tsumo = !!state.situation.tsumo;
      return (
        bandHead('テンパイ', ready ? `待ち ${a.waits.length}種・タップで役と点数` : `待ち ${a.waits.length}種・点数は条件のOK後`, 'ok') +
        chipRow(
          'wait',
          a.waits.map((w) => {
            if (!ready) return { tile: w.tile };
            const r = tsumo ? w.tsumo : w.ron;
            if (r.ok) return { tile: w.tile, pt: paymentChipHTML(r) };
            // ロンでは役がないがツモならアガれる
            if (!tsumo && w.tsumo.ok) return { tile: w.tile, pt: 'ツモのみ', dim: true };
            return { tile: w.tile, pt: '役なし', dim: true };
          }),
        )
      );
    }
    if (s === 1 && a.tenpaiDraws && a.tenpaiDraws.length) {
      return (
        bandHead('1シャンテン', `この牌が来ればテンパイ ${a.tenpaiDraws.length}種`) +
        chipRow('draw', a.tenpaiDraws.map((d) => ({ tile: d.draw, pt: d.best ? `${d.best.kinds}種待ち` : '' })))
      );
    }
    // 2シャンテン以上は牌を並べても見づらいので、シャンテン数だけ出す
    if (s >= 2) return bandHead(`${s}シャンテン`, `受け入れ ${a.ukeire.length}種（あと${s}回の入れ替えでテンパイ）`);
    return bandHead(`${s}シャンテン`, `受け入れ ${a.ukeire.length}種`) + chipRow('uke', a.ukeire.map((u) => ({ tile: u.tile })));
  }
  if (a.agari) {
    const r = a.agari;
    if (!scoreReady()) return bandHead('アガリ形', '点数と役は条件のOK後に表示します', 'win');
    if (r.ok) {
      // 本場・供託があるときは「実際に動く点数」も帯に出す（基本の点数と区別できるように）
      const extra = (r.total | 0) - (r.points | 0);
      const move = extra > 0 ? `・受け取り ${fmt(r.total)}点` : '';
      // ツモは支払いの形も添える（子のツモ 2,000-4,000／親のツモ 4,000オール）
      const how = `${r.dealer ? '親' : '子'}の${r.tsumo ? `ツモ ${paymentShort(r)}` : 'ロン'}`;
      return bandHead('アガリ', `${fmt(r.points)}点${r.limit ? '・' + r.limit : ''}（${how}）${move}`, 'win');
    }
    return bandHead('アガリ形・役なし', 'ドラだけではアガれません', 'warn');
  }
  const s = a.shanten.min;
  if (s >= 2) return bandHead(`${s}シャンテン`, '切る牌の候補は「手入力」画面で見られます');
  return (
    bandHead(s === 0 ? 'テンパイ<em>（1枚切れば）</em>' : `${s}シャンテン`, s === 0 ? '切る牌をタップすると待ちを表示' : '切る牌の候補（受け入れの種類が多い順）', s === 0 ? 'ok' : '') +
    chipRow(
      'discard',
      // 枚数は手牌からしか数えられない（河や自分の捨て牌は見えない）ので、種類の数だけ出す
      a.discards.slice(0, 9).map((d) => ({ tile: d.discard, pt: d.waits ? `${d.kinds}種待ち` : `受入${d.kinds}種` })),
    )
  );
}

// ---------- 表示: 認識した手牌 ----------
/**
 * 並んだ牌を横幅いっぱいまで大きくする。
 * すき間・「＋」ボタン・「来た牌」などの札は牌の大きさで変わらないので、その合計を引いてから枚数で割る
 */
function fitTwin() {
  const tw = $('twin');
  if (!tw) return;
  const cells = tw.querySelectorAll('.tw, .tw-meld');
  const first = tw.querySelector('.twin-hand .tw') || cells[0];
  if (!cells.length || !first) {
    tw.style.removeProperty('--tw-w');
    return;
  }
  const w0 = first.getBoundingClientRect().width;
  const box = tw.clientWidth;
  if (!w0 || !box) return;
  const cs = getComputedStyle(tw);
  const gap = parseFloat(cs.columnGap) || 0;
  const pad = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  const kids = [...tw.children];
  const content = kids.reduce((sum, e) => sum + e.getBoundingClientRect().width, 0) + gap * Math.max(0, kids.length - 1) + pad;
  const fixed = content - cells.length * w0; // 牌以外に使っている幅
  const want = (box - fixed - 3) / cells.length;
  tw.style.setProperty('--tw-w', `${Math.min(36, Math.max(16, Math.floor(want * 10) / 10))}px`);
}

function twinMarks(a) {
  const marks = { hl: new Set(), cut: null };
  const sel = cam.sel;
  if (!sel || !a) return marks;
  const ids = handIds();
  if (sel.kind === 'wait') {
    const w = a.waits && a.waits.find((x) => x.tile === sel.tile);
    if (w) indicesForBases(waitBlockBases(w.ron, sel.tile), ids).forEach((i) => marks.hl.add(i));
  } else if (sel.kind === 'draw') {
    const d = a.tenpaiDraws && a.tenpaiDraws.find((x) => x.draw === sel.tile);
    if (d && d.best) {
      const i = indicesForBases([d.best.discard], ids)[0];
      if (i != null) marks.cut = i;
    }
  } else if (sel.kind === 'discard') {
    const i = indicesForBases([tileBase(sel.tile)], ids)[0];
    if (i != null) marks.cut = i;
    else if (state.win != null && tileBase(state.win) === tileBase(sel.tile)) marks.cut = 'win';
  }
  return marks;
}

function twinHTML(a) {
  const ids = handIds();
  const m = twinMarks(a);
  const fade = m.hl.size > 0;
  const tiles = ids.map((id, i) => {
    if (id == null) {
      return `<button type="button" class="tw unk" data-action="cam-edit" data-index="${i}" aria-label="読み取れなかった牌を選ぶ"><span class="tile t-twin qm">？</span></button>`;
    }
    const cls = ['tw'];
    if (m.hl.has(i)) cls.push('hl');
    else if (fade) cls.push('fade');
    if (m.cut === i) cls.push('cut');
    return `<button type="button" class="${cls.join(' ')}" data-action="cam-edit" data-index="${i}" aria-label="${tileLabel(id)}（タップで修正）">${tileHTML(id, { size: 'twin' })}</button>`;
  });
  let tail = '';
  if (state.win != null) {
    const cls = ['tw', 'win'];
    if (m.cut === 'win') cls.push('cut');
    if (fade) cls.push('fade');
    // アガリ形のときだけ ロン/ツモ。1シャンテンなどで「ロン」とは言わないので、それ以外は「来た牌」
    const tailLabel = a && a.agari ? (state.situation.tsumo ? 'ツモ' : 'ロン') : '来た牌';
    tail = `<button type="button" class="${cls.join(' ')}" data-action="cam-edit" data-index="win" aria-label="${tailLabel} ${tileLabel(state.win)}（タップで修正）">${tileHTML(state.win, { size: 'twin' })}<small>${tailLabel}</small></button>`;
  } else if (cam.sel && (cam.sel.kind === 'wait' || cam.sel.kind === 'draw')) {
    tail = `<span class="tw ghost" aria-hidden="true">${tileHTML(cam.sel.tile, { size: 'twin' })}<small>${cam.sel.kind === 'wait' ? 'アガリ' : 'ツモ'}</small></span>`;
  }
  const melds = state.melds
    .map((mm, i) => {
      const t = mm.tiles
        .map((id, k) =>
          mm.type === 'ankan' && (k === 0 || k === 3)
            ? tileHTML(id, { size: 'twin', back: true })
            : tileHTML(id, { size: 'twin', side: mm.type !== 'ankan' && k === 0 }),
        )
        .join('');
      return `<button type="button" class="tw-meld" data-action="cam-meld" data-index="${i}" aria-label="${MELD_LABELS[mm.type]}">${t}</button>`;
    })
    .join('');
  const n = need();
  const canAdd = ids.length < n || (state.win == null && !cam.draft && ids.length === n);
  const missing = Math.max(0, n - ids.length);
  const add = canAdd
    ? `<button type="button" class="tw-add" data-action="cam-pop" data-pop="add" aria-pressed="${cam.pop === 'add'}" aria-label="牌を追加">＋${missing ? `<small>あと${missing}</small>` : '<small>アガリ</small>'}</button>`
    : '';
  // 鳴いているときは、枚数を合わせるために面子を入れてもらう
  const meldAdd =
    state.melds.length < 4 && ids.length > 0 && ids.length < 13
      ? `<button type="button" class="tw-add" data-action="cam-pop" data-pop="addmeld" aria-pressed="${cam.pop === 'addmeld'}" aria-label="鳴きを入れる">鳴<small>チー/ポン</small></button>`
      : '';
  if (!ids.length && !tail && !melds) return add + meldAdd;
  return `<div class="twin-hand">${tiles.join('')}</div>${tail}${melds ? `<div class="twin-melds">${melds}</div>` : ''}${add}${meldAdd}`;
}

// ---------- 表示: 右の枠 ----------
function removeOneBase(list, base) {
  const out = list.slice();
  let i = out.findIndex((id) => id === base);
  if (i < 0) i = out.findIndex((id) => tileBase(id) === base);
  if (i >= 0) out.splice(i, 1);
  return out;
}

function selHead(tile, title, sub) {
  return `<div class="sel-head">${tileHTML(tile, { size: 'md' })}<div><b>${title}</b><span>${sub}</span></div></div>`;
}

function resultBlock(r) {
  return (
    `<div class="pt-big"><span class="num">${fmt(r.points)}</span><span class="unit">点</span>${r.limit ? `<span class="limit">${r.limit}</span>` : ''}</div>` +
    `<p class="sub">${r.yakuman ? '役満' : `${r.han}翻${r.fu}符`}${r.tsumo ? `・${paymentShort(r)}` : ''}${waitText(r) ? '・' + waitText(r) : ''}</p>` +
    moveLineHTML(r, state.situation) +
    yakuRows(r)
  );
}

function waitDetail(a) {
  const w = a.waits.find((x) => x.tile === cam.sel.tile);
  if (!w) return '';
  if (a.hiddenMelds) {
    const shape = shapeHTML(w.ron);
    return (
      selHead(w.tile, `${tileLabel(w.tile)}でアガリ`, waitText(w.ron) || 'アガリ牌') +
      `<div class="notice">鳴き${a.hiddenMelds}組を省いた${a.count}枚の形として、待ちだけを計算しています。点数を出すには、手牌の右の「鳴」から鳴いた面子（チー・ポン・カン）を入れてください。</div>` +
      (shape ? `<div class="section-title">面子の分け方（省いた鳴きを除く）</div>${shape}` : '')
    );
  }
  const tsumo = !!state.situation.tsumo;
  const r = tsumo ? w.tsumo : w.ron;
  if (!scoreReady()) {
    const shape0 = shapeHTML(r);
    return (
      selHead(w.tile, `${tileLabel(w.tile)}でアガリ`, waitText(w.ron) || 'アガリ牌') +
      pendingScoreHTML() +
      (shape0 ? `<div class="section-title">面子の分け方</div>${shape0}` : '')
    );
  }
  const seg =
    `<div class="seg rt">` +
    `<button type="button" data-action="cam-set" data-key="tsumo" data-value="0" aria-pressed="${!tsumo}">ロン ${w.ron.ok ? fmt(w.ron.points) : '役なし'}</button>` +
    `<button type="button" data-action="cam-set" data-key="tsumo" data-value="1" aria-pressed="${tsumo}">ツモ ${w.tsumo.ok ? fmt(w.tsumo.points) : '役なし'}</button>` +
    `</div>`;
  let body;
  if (r.ok) {
    body = resultBlock(r);
  } else {
    let hint = '';
    const menzen = state.melds.every((m) => m.type === 'ankan');
    if (menzen && !state.situation.riichi) {
      const rr = evaluateWin({ ...scoringContext(state), concealed: state.concealed, winTile: w.tile, tsumo, riichi: 1 });
      if (rr.ok) hint = `リーチをかけていれば ${fmt(rr.points)}点でアガれます。`;
    }
    if (!tsumo && w.tsumo.ok) hint += 'ツモなら門前清自摸和でアガれます。';
    body = `<div class="notice">役がないため${tsumo ? 'ツモ' : 'ロン'}ではアガれません。${hint}</div>`;
  }
  const shape = shapeHTML(r);
  return (
    selHead(w.tile, `${tileLabel(w.tile)}でアガリ`, waitText(w.ron) || 'アガリ牌') +
    seg +
    body +
    (shape ? `<div class="section-title">面子の分け方</div>${shape}` : '') +
    (r.ok ? fuDetailsHTML(r) : '')
  );
}

function drawDetail(a) {
  const d = a.tenpaiDraws.find((x) => x.draw === cam.sel.tile);
  if (!d) return '';
  const ctx = scoringContext(state);
  const ready = scoreReady();
  const opts = d.options.slice(0, 5).map((o) => {
    const rest = removeOneBase([...state.concealed, d.draw], o.discard);
    let best = 0;
    for (const w of o.waits) {
      const r = evaluateWin({ ...ctx, concealed: rest, winTile: w.tile, tsumo: false });
      if (r.ok && r.points > best) best = r.points;
    }
    const waits = o.waits.map((w) => `<span class="uke">${tileHTML(w.tile, { size: 'xs' })}</span>`).join('');
    return (
      `<li class="opt"><div class="opt-top"><span class="cut-lbl">${tileHTML(o.discard, { size: 'xs' })}を切るとテンパイ</span><b>${o.kinds}種待ち</b></div>` +
      `<div class="tiles-inline">${waits}<span class="tail-lbl">でアガリ</span></div>` +
      (ready ? `<small>${best ? `ロン最高 ${fmt(best)}点` : 'ロンは役なし（リーチかツモが必要）'}</small>` : pendingScoreHTML(true)) +
      `</li>`
    );
  });
  return (
    selHead(d.draw, `${tileLabel(d.draw)}を引いたらテンパイ`, '切る牌と待ち') +
    `<ol class="opt-list">${opts.join('')}</ol>` +
    (d.options.length > 5 ? `<p class="muted">ほか${d.options.length - 5}通りの切り方があります</p>` : '')
  );
}

function discardDetail(a) {
  const d = a.discards.find((x) => x.discard === cam.sel.tile);
  if (!d) return '';
  if (d.waits) {
    const ready = scoreReady();
    // 待ち牌は横に並べる（点数はOK後に牌の下へ）
    const chips = d.waits
      .map((w) => {
        const r = state.situation.tsumo ? w.tsumo : w.ron;
        const pt = ready ? `<small${r.ok ? '' : ' class="none"'}>${r.ok ? paymentChipHTML(r) : '役なし'}</small>` : '';
        return `<span class="wait-chip">${tileHTML(w.tile, { size: 'xs' })}${pt}</span>`;
      })
      .join('');
    return (
      selHead(d.discard, `${tileLabel(d.discard)}を切るとテンパイ`, `待ち ${d.kinds}種`) +
      `<div class="next-row"><span class="arrow" aria-hidden="true">→</span><div class="tiles-inline wait-chips">${chips}<span class="tail-lbl">が来るとアガリ</span></div></div>` +
      (ready ? '' : pendingScoreHTML(true))
    );
  }
  const uke = d.ukeire.map((u) => `<span class="uke">${tileHTML(u.tile, { size: 'xs' })}</span>`).join('');
  const next = d.shanten - 1 <= 0 ? 'テンパイ' : `${d.shanten - 1}シャンテン`;
  return (
    selHead(d.discard, `${tileLabel(d.discard)}を切ると${d.shanten}シャンテン`, `受け入れ ${d.kinds}種`) +
    `<div class="next-row"><span class="arrow" aria-hidden="true">→</span><div class="tiles-inline">${uke}<span class="tail-lbl">が来ると${next}</span></div></div>`
  );
}

function agariDetail(a) {
  const r = a.agari;
  if (!scoreReady()) {
    const shape0 = shapeHTML(r);
    return (
      selHead(state.win, `${tileLabel(state.win)}で${r.tsumo ? 'ツモ' : 'ロン'}アガリの形`, waitText(r) || 'アガリ') +
      pendingScoreHTML() +
      (shape0 ? `<div class="section-title">面子の分け方</div>${shape0}` : '')
    );
  }
  if (!r.ok) {
    const hints = (a.hints || []).map((h) => `<li>${h}</li>`).join('');
    const shape = shapeHTML(r);
    return (
      `<div class="notice">アガリ形ですが役がありません。ドラ・赤ドラだけではアガれません。${hints ? `<ul>${hints}</ul>` : ''}</div>` +
      (shape ? `<div class="section-title">面子の分け方</div>${shape}` : '')
    );
  }
  const shape = shapeHTML(r);
  return (
    selHead(state.win, `${tileLabel(state.win)}で${r.tsumo ? 'ツモ' : 'ロン'}アガリ`, `${r.dealer ? '親' : '子'}・${waitText(r) || 'アガリ'}`) +
    resultBlock(r) +
    paymentList(r, state.situation) +
    (shape ? `<div class="section-title">面子の分け方</div>${shape}` : '') +
    fuDetailsHTML(r)
  );
}

/** テンパイのとき、見出しの横に出すアガリ牌 */
function waitTilesHTML(a) {
  if (!a || !a.waits || !a.waits.length) return '';
  return `<span class="s-waits"><small>アガリ牌</small>${tilesInline(a.waits.map((w) => w.tile), 'xs')}</span>`;
}

function summaryHTML(a) {
  if (cam.busy) {
    // 端末内の計算は途中で止められないので「中止」はクラウドAI（β）のときだけ
    const stop = cam.busy === 'device' ? '' : '<button type="button" class="btn ghost" data-action="cam-stop">中止</button>';
    return `<div class="s-sum"><span class="eyebrow">読み取り中</span><b class="s-big">…</b><p class="muted">${cam.note}</p>${stop}</div>`;
  }
  const k = state.melds.length;
  if (!a || cam.draft || a.phase === 'error' || a.phase === 'incomplete') {
    const lines = [
      'スマホは縦のままでOK。下の枠に手牌が横一列に入るように写します（カメラはスマホを横にすると近くから撮れます）',
      getTileModel() ? '「認識する」を押すと、端末内のAIが牌を読みます' : sampleImages ? '「認識する」でAIが牌を読みます（β）' : '読み取れない場合は「＋」から牌をタップで入力',
      '手牌の上に待ち牌が出ます。タップするとここに役と点数',
    ];
    return `<div class="s-sum"><span class="eyebrow">使い方</span><ol class="howto">${lines.map((l) => `<li>${l}</li>`).join('')}</ol></div>`;
  }
  if (a.phase === 'hand13') {
    const s = a.shanten.min;
    if (a.hiddenMelds) {
      return `<div class="s-sum"><span class="eyebrow">${a.count}枚（鳴き${a.hiddenMelds}組は省略）</span><div class="s-head"><b class="s-big ok">テンパイ</b>${waitTilesHTML(a)}</div></div>`;
    }
    return (
      `<div class="s-sum"><span class="eyebrow">${13 - 3 * k}枚${k ? `＋鳴き${k}組` : ''}</span>` +
      `<div class="s-head"><b class="s-big${s === 0 ? ' ok' : ''}">${shantenText(s)}</b>${waitTilesHTML(a)}</div>` +
      `${formsHTML(a.shanten)}</div>`
    );
  }
  if (a.agari) {
    const r = a.agari;
    const ready = scoreReady();
    let big = r.ok ? 'アガリ' : 'アガリ形・役なし';
    let sub = r.ok ? `${fmt(r.points)}点${r.limit ? '・' + r.limit : ''}` : 'ドラだけではアガれません';
    if (!ready) {
      big = 'アガリ形';
      sub = '点数はOK後に表示';
    }
    return `<div class="s-sum"><span class="eyebrow">${14 - 3 * k}枚${k ? `＋鳴き${k}組` : ''}・${r.tsumo ? 'ツモ' : 'ロン'}</span><div class="s-head"><b class="s-big${r.ok || !ready ? ' win' : ''}">${big}</b><span class="s-sub">${sub}</span></div></div>`;
  }
  return `<div class="s-sum"><span class="eyebrow">${14 - 3 * k}枚・切る前</span><b class="s-big${a.shanten.min === 0 ? ' ok' : ''}">${a.shanten.min === 0 ? '1枚切ればテンパイ' : shantenText(a.shanten.min)}</b></div>`;
}

function detailHTML(a) {
  if (!a || cam.busy || cam.draft) return '';
  if (a.phase === 'hand14' && a.agari) return agariDetail(a);
  if (!cam.sel) {
    if (a.phase === 'hand13' && a.shanten.min >= 2) {
      return `<p class="muted">受け入れを引くとシャンテン数が1つ進みます。1シャンテンになると「何が来ればテンパイか」を表示します。</p>`;
    }
    return '';
  }
  if (cam.sel.kind === 'wait') return waitDetail(a);
  if (cam.sel.kind === 'draw') return drawDetail(a);
  if (cam.sel.kind === 'discard') return discardDetail(a);
  return '';
}

function notesHTML() {
  const s = state.situation;
  const dora = state.dora.length ? tilesInline(state.dora.map(doraFromIndicator), 'xxs') : 'なし';
  const ready = scoreReady();
  const provisional = ready
    ? ''
    : '<p class="muted">条件を確かめて上の「OK」を押すと点数を表示します。待ちとシャンテン数は設定に関係なく表示しています。</p>';
  const local = !!getTileModel();
  let reader = '自動読み取りを確認しています…';
  if (local) reader = '端末内のAIで読み取ります（通信なし・1〜2秒）<br>オフライン環境でも使用可能';
  else if (sampleChecked) reader = sampleImages ? 'クラウドAI（β）で読み取ります。数秒〜数十秒かかります' : 'この画面では自動読み取りを使えません。「＋」から牌をタップで入力できます';
  const cloudAgain = local && sampleImages ? ' <button type="button" class="linkish" data-action="cam-read-ai">クラウドAI（β）で読み直す</button>' : '';
  const readNote = cam.note && !cam.busy ? `<p class="muted">${cam.note}</p>` : '';
  const warns = cam.recog && cam.recog.warnings.length ? `<ul class="warn-list">${cam.recog.warnings.map((w) => `<li>${w}</li>`).join('')}</ul>` : '';
  return (
    `<div class="s-note"><div class="s-note-head"><b>点数の計算条件</b><em class="tag${ready ? ' on' : ''}">${ready ? '設定済' : '未確定'}</em><button type="button" class="linkish" data-action="cam-pop" data-pop="settings">その他の設定</button></div>` +
    `<p>${situationText(s)}・${s.tsumo ? 'ツモ' : 'ロン'}・ドラ <span class="inline-tiles">${dora}</span></p>${provisional}</div>` +
    `<div class="s-note"><div class="s-note-head"><b>読み取り</b></div><p>${reader}${cloudAgain}</p>${readNote}${warns}` +
    `<p class="muted">${local ? '一般的な全自動卓の牌で学習しています。<br>実際の手牌と異なる場合は修正してください。' : '端末内AIは、実物の牌の写真を集めて学習させてから搭載します。'}</p></div>`
  );
}

// ---------- 表示: ポップアップ ----------
/** 鳴きの種類（既定はポン） */
function meldType() {
  const t = cam.meldType || 'pon';
  return state.rules.sanma && t === 'chi' ? 'pon' : t;
}

/** 鳴きに使えない牌（すでに4枚使っている・三人麻雀にない・赤5） */
function meldKeyDisabled(id, type) {
  if (isRed(id)) return true;
  const b = tileBase(id);
  if (state.rules.sanma && isSanmaMissing(b)) return true;
  const used = countsOf(allInputTiles());
  if (type === 'pon') return used[b] > 1;
  if (type === 'minkan' || type === 'ankan') return used[b] !== 0;
  if (type === 'chi') return !(b < 27 && b % 9 <= 6 && used[b] < 4 && used[b + 1] < 4 && used[b + 2] < 4);
  return false;
}

function popShell(title, body, headExtra = '', fixed = '') {
  return (
    `<div class="pop-head"><b>${title}</b>${headExtra}<button type="button" class="pop-x" data-action="cam-pop-close" aria-label="閉じる">×</button></div>` +
    (fixed ? `<div class="pop-fixed">${fixed}</div>` : '') +
    `<div class="pop-body">${body}</div>`
  );
}

  kuitan: '喰いタン<small>鳴いた断幺九</small>',
  kiriage: '切り上げ満貫<small>30符4翻・60符3翻</small>',

  doubleYakuman: 'ダブル役満<small>四暗刻単騎など</small>',
  ryuuiisouNeedsHatsu: '緑一色の發',
  doubleWindPairFu: '連風牌の雀頭<small>場風＝自風の対子</small>',
};
function ruleRow(label, key, options, current, cls = '') {
  const buttons = options
    .map(([v, l]) => `<button type="button" data-action="cam-rule" data-key="${key}" data-value="${v}" aria-pressed="${String(current) === String(v)}">${l}</button>`)
    .join('');
  return `<div class="prow"><span class="plabel">${label}</span><div class="seg${cls ? ' ' + cls : ''}">${buttons}</div></div>`;
}

function segRow(label, key, options, current, disabled = false) {
  const buttons = options
    .map(([v, l]) => `<button type="button" data-action="cam-set" data-key="${key}" data-value="${v}" aria-pressed="${current === v}"${disabled && v !== 0 ? ' disabled' : ''}>${l}</button>`)
    .join('');
  return `<div class="prow"><span class="plabel">${label}</span><div class="seg">${buttons}</div></div>`;
}

function popHTML() {
  const s = state.situation;
  switch (cam.pop) {
    case 'settings': {
      // 付加役とルールを全部ここにまとめる（写真の画面・手入力の画面で共通。手入力の下にあった「状況」「ルール」の欄はなくした）
      const specials = [['rinshan', '嶺上開花'], ['chankan', '槍槓'], ['haitei', '海底摸月'], ['houtei', '河底撈魚'], ['tenhou', '天和'], ['chiihou', '地和']];
      const r = state.rules;
      const yn = (key, on) => ruleRow(RULE_LABELS[key], key, [[1, 'あり'], [0, 'なし']], on ? 1 : 0);
      const melded = state.melds.length > 0;
      const body =
        `<div class="prow"><span class="plabel">付加役</span><div class="chips">` +
        specials
          .map(([v, l]) => {
            const off = (v === 'tenhou' || v === 'chiihou') && melded; // 鳴いていたら天和・地和はない
            return `<button type="button" class="chip" data-action="cam-special" data-value="${v}" aria-pressed="${s.special === v}"${off ? ' disabled' : ''}>${l}</button>`;
          })
          .join('') +
        `</div></div>` +
        `<div class="psep">ルール</div>` +
        ruleRow('人数', 'sanma', [[0, '四人麻雀'], [1, '三人麻雀']], r.sanma ? 1 : 0) +
        (r.sanma ? ruleRow('ツモ損', 'tsumoLoss', [[1, 'あり'], [0, 'なし（折半）']], r.tsumoLoss === false ? 0 : 1) : '') +
        ruleRow('符', 'fuMode', [['normal', '正規'], ['fix30', '30符'], ['fix40', '40符']], r.fuMode || 'normal') +
        (r.fuMode && r.fuMode !== 'normal'
          ? ruleRow('符の例外', 'fuExceptions', [[1, '七対子25・平和ツモ20'], [0, 'なし']], r.fuExceptions === false ? 0 : 1, 'auto')
          : '') +
        yn('kuitan', r.kuitan !== false) +
        yn('kiriage', !!r.kiriage) +
        ruleRow(RULE_LABELS.kazoe, 'kazoe', [[1, 'あり'], [0, '三倍満']], r.kazoe === false ? 0 : 1) +
        yn('multipleYakuman', r.multipleYakuman !== false) +
        yn('doubleYakuman', !!r.doubleYakuman) +
        ruleRow(RULE_LABELS.ryuuiisouNeedsHatsu, 'ryuuiisouNeedsHatsu', [[0, 'なくてよい'], [1, '必須']], r.ryuuiisouNeedsHatsu ? 1 : 0) +
        ruleRow(RULE_LABELS.doubleWindPairFu, 'doubleWindPairFu', [[2, '2符'], [4, '4符']], r.doubleWindPairFu === 2 ? 2 : 4) +
        ruleRow('花牌', 'flowers', [[0, '使わない'], [1, '使う']], r.flowers ? 1 : 0) +
        `<p class="muted">場風・家・本場・供託・ドラは上の「場の設定」、リーチ・ロン/ツモ・一発・裏ドラ（枚数）・抜きドラは「アガリ想定」でタップして変えられます。</p>`;
      return popShell('その他の設定', body);
    }
    case 'dora': {
      // 選んだ表示牌（タップでその1枚を外せる）
      const inds = state.dora
        .map((id, i) => `<button type="button" class="ind" data-action="cam-dora-del" data-index="${i}" aria-label="${tileLabel(id)}を外す">${tileHTML(id, { size: 'sm' })}</button>`)
        .join('');
      // 見出しの行に「→ ドラ ○○」。表示牌を選ぶとドラが決まる、という向きが分かるように
      const headExtra =
        `<span class="dora-arrow" aria-hidden="true">${ARROW_ICON}</span>` +
        `<span class="derived head-derived"><b>ドラ</b>${state.dora.length ? tilesInline(state.dora.map(doraFromIndicator)) : '<span class="muted">なし</span>'}</span>`;
      // 選んだ表示牌と「外す・決定」は、下までスクロールしても見えるように固定する
      const fixed =
        `<div class="ind-line">${inds || '<span class="muted">表示牌をまだ選んでいません</span>'}</div>` +
        `<div class="pop-buttons">` +
        `<button type="button" class="btn ghost lit" data-action="cam-dora-undo"${state.dora.length ? '' : ' disabled'}>外す</button>` +
        `<button type="button" class="btn go" data-action="cam-pop-close">決定</button></div>`;
      const body =
        `<p class="muted">ドラ表示牌（めくれている牌）をタップして追加します。ドラはその次の牌です。カンで同じ表示牌が出たときは同じ牌を2枚以上選べます。</p>` +
        paletteHTML('cam-dora-add', (id) => !!doraLimitMessage(id));
      return popShell('ドラ表示牌', body, headExtra, fixed);
    }
    case 'add': {
      const ids = handIds();
      const n = need();
      const title = ids.length < n ? `手牌を入力（${ids.length}/${n}）` : 'アガリ牌を入力（14枚目）';
      const extra =
        `<button type="button" class="key act" data-action="cam-undo">戻す</button>` +
        `<button type="button" class="key act wide" data-action="cam-clear">全消去</button>`;
      const preview = ids.length
        ? `<div class="pop-preview">${ids.map((id) => (id == null ? '<span class="tile t-xxs qm">？</span>' : tileHTML(id, { size: 'xxs' }))).join('')}</div>`
        : '';
      const body = `<p class="muted">左から順にタップ。${n}枚のあとにタップした牌はアガリ牌になります。</p>` + paletteHTML('cam-key', (id) => !!limitMessage(id), extra);
      return popShell(title, body, '', preview);
    }
    case 'edit': {
      const cur = currentEditTile();
      const title = cur == null ? '読み取れなかった牌を選ぶ' : `${tileLabel(cur)} を変更`;
      const del = `<button type="button" class="btn ghost small" data-action="cam-del">この牌を削除</button>`;
      const cands = typeof cam.editIndex === 'number' && cam.cands ? cam.cands[cam.editIndex] || [] : [];
      const chips = cands
        .filter((c) => c.id < 37)
        .map(
          (c) =>
            `<button type="button" class="key" data-action="cam-key" data-id="${c.id}" aria-label="${tileLabel(c.id)}"${limitMessage(c.id, cur) ? ' disabled' : ''}>${tileHTML(c.id, { size: 'key' })}<small>${Math.round(c.p * 100)}%</small></button>`,
        )
        .join('');
      const head = chips ? `<div class="prow"><span class="plabel">読み取りの候補</span><div class="palette cand">${chips}</div></div>` : '';
      return popShell(title, head + paletteHTML('cam-key', (id) => !!limitMessage(id, cur)), del);
    }
    case 'meld': {
      const mm = state.melds[cam.editIndex];
      if (!mm) return '';
      const body =
        `<div class="ind-line">${tilesInline(mm.tiles, 'sm')}</div>` +
        `<div class="btn-row" style="justify-content:flex-start">` +
        `<button type="button" class="btn ghost" data-action="cam-pop" data-pop="addmeld">鳴きを足す</button>` +
        `<button type="button" class="btn ghost" data-action="cam-meld-del">この${MELD_LABELS[mm.type]}を削除</button></div>`;
      return popShell(MELD_LABELS[mm.type], body);
    }
    case 'addmeld': {
      const t = meldType();
      const k = state.melds.length;
      const rest = need() - handIds().filter((x) => x != null).length;
      const lead =
        rest < 0
          ? `手牌が${-rest}枚多いので、鳴いた面子を入れると枚数が合います。`
          : `鳴いた面子（チー・ポン・カン）を入れると、その分だけ手牌の枚数が減ります。`;
      const types = (state.rules.sanma ? [['pon', 'ポン'], ['minkan', '明カン'], ['ankan', 'アンカン']] : [['chi', 'チー'], ['pon', 'ポン'], ['minkan', '明カン'], ['ankan', 'アンカン']])
        .map(([v, l]) => `<button type="button" data-action="cam-meld-type" data-value="${v}" aria-pressed="${t === v}">${l}</button>`)
        .join('');
      const hint = t === 'chi' ? '順子の一番小さい牌をタップ（3萬 → 345萬）' : `${MELD_LABELS[t]}した牌をタップ`;
      const now = k ? `<div class="ind-line"><span class="muted">今の鳴き</span>${state.melds.map((m) => tilesInline(m.tiles, 'xxs')).join('　')}</div>` : '';
      const body =
        `<p class="muted">${lead}</p>` +
        `<div class="prow"><span class="plabel">種類</span><div class="seg">${types}</div></div>` +
        now +
        `<p class="muted">${hint}</p>` +
        paletteHTML('cam-meld-add', (id) => meldKeyDisabled(id, t)) +
        `<button type="button" class="btn ghost" data-action="cam-pop-close">鳴いていない</button>`;
      return popShell(`鳴き${k + 1}組目を入れる`, body);
    }
    case 'demo': {
      const items = DEMOS.map(
        (d) =>
          `<button type="button" class="demo-item" data-action="cam-demo" data-id="${d.id}" aria-pressed="${cam.source === 'demo' && cam.demo === d.id}"><span class="demo-tiles">${tilesInline(parseTiles(d.tiles).concat(d.win ? parseTiles(d.win) : []), 'xxs')}</span><b>${d.title}</b><small>${d.note}</small></button>`,
      ).join('');
      return popShell('デモ画像で試す', `<div class="demo-list">${items}</div>`);
    }
    default:
      return '';
  }
}

// ---------- 表示: 全体 ----------
function mediaMessage() {
  // 手牌を表示しているときは案内を短くする（画面の高さを手牌側に回す）
  const compact = handIds().length > 0;
  const photoButtons = `<div class="btn-row"><label class="btn" for="file-pick">${ICON.photo}アルバムから選ぶ</label></div>`;
  if (cam.source === 'live') {
    if (cam.live === 'starting') return '<p>カメラを起動しています…</p>';
    // カメラが使えないと分かっている画面では、起動を試す前に代わりの方法を出す
    const blocked = cam.live === 'off' && cameraAllowedByPolicy() === false;
    if (cam.live === 'failed' || blocked) {
      const reason = blocked ? 'BlockedByPolicy' : liveError || '不明';
      if (compact) return `${photoButtons}<p class="muted small">カメラは使えません（${reason}）</p>`;
      return `<p>${liveFailureText(reason)}<br>写真を撮るか、アルバムから選んで読み取れます。</p>${photoButtons}<p class="muted small">理由: ${reason}</p>`;
    }
    if (cam.live === 'off') {
      const lead = compact ? '' : '<p>カメラで手牌を写します。</p>';
      return `${lead}<div class="btn-row"><button type="button" class="btn" data-action="cam-live-start">${ICON.live}カメラを起動</button></div>`;
    }
    return '';
  }
  if (cam.source === 'photo' && !cam.photoUrl) return photoButtons;
  return '';
}

function renderMedia() {
  const src = cam.source;
  $('cam-video').hidden = !(src === 'live' && (cam.live === 'on' || cam.live === 'frozen'));
  $('cam-photo').hidden = !(src === 'photo' && cam.photoUrl && cam.photoSize);
  $('demo-scene').hidden = src !== 'demo';
  if (src === 'demo') renderDemoScene();
  $('cam-stage').toggleAttribute('data-read', !!cam.read && src === 'photo' && !!cam.photoSize);
  // 写真を枠に合わせている間（とライブカメラ）は枠の高さを確保する
  $('cam-stage').toggleAttribute('data-framing', (src === 'photo' && !!cam.photoSize && !cam.read) || src === 'live');
  const msg = mediaMessage();
  const empty = $('cam-empty');
  empty.hidden = !msg;
  if (msg) $('cam-stage').dataset.empty = '';
  else delete $('cam-stage').dataset.empty;
  if (msg && empty.dataset.msg !== msg) {
    empty.innerHTML = msg;
    empty.dataset.msg = msg;
  }
  if (!$('cam-photo').hidden) applyPhotoTransform();
  $('cam-rotate').hidden = !(src === 'photo' && cam.photoSize && !cam.busy);
  $('cam-level').hidden = !(src === 'photo' && cam.photoSize && !cam.busy && cam.angle);
  let label = '手牌を横一列に';
  // 回している間（角度が 0 でない）は、案内の代わりに枠の左上に角度と「戻す」を出す
  if (src === 'photo' && cam.photoSize) label = cam.read || cam.angle ? '' : '指で動かして枠の中へ<small>・2本指で拡大・回転</small>';
  if (src === 'demo') label = `デモ画像・${(DEMOS.find((x) => x.id === cam.demo) || DEMOS[0]).title}`;
  if (src === 'live' && cam.live === 'frozen') label = '撮影した画像';
  // スマホを横にしたときはカメラだけの画面にする（Android のホーム画面のアプリは、撮る間だけ横向きに固定）
  const liveOn = src === 'live' && (cam.live === 'on' || cam.live === 'frozen' || cam.live === 'starting');
  const land = liveOn && !!landMQ && landMQ.matches;
  setLandCapture(land);
  if (liveOn) lockOrientation(cam.live === 'frozen' && handIds().length ? 'portrait' : 'landscape');
  if (src === 'live' && cam.live === 'on' && !land) label = '手牌を横一列に<small>・スマホを横にすると近くから撮れます</small>';
  $('roi-label').innerHTML = label;
  const lh = $('land-hint');
  if (lh) lh.hidden = !(land && cam.read && handIds().length > 0 && !cam.busy);
  $('roi-label').classList.toggle('photo-hint', src === 'photo' && !!cam.photoSize && !cam.read && !cam.angle);
  $('roi').classList.toggle('scan', !!cam.busy || !!cam.scanning);
  // 読み取り中の目印（枠の真ん中）。何の待ち時間か分かるように文字でも出す
  const rb = $('read-busy');
  if (rb) {
    rb.hidden = !cam.busy;
    const t = cam.busy === 'device' ? '読み取り中…' : 'AIが読み取り中…';
    if (rb.dataset.t !== t) {
      rb.querySelector('.rb-text').textContent = t;
      rb.dataset.t = t;
    }
  }
}

function renderControls() {
  const src = cam.source;
  // カメラは読み取った画像で止めている間（frozen）も「認識済み」を出す（押すと同じ画像をもう一度読む）
  const canRead = (src === 'live' && (cam.live === 'on' || cam.live === 'frozen')) || (src === 'photo' && !!cam.photoSize);
  const sh = $('shutter');
  sh.hidden = !(canRead || cam.busy);
  // 端末内の計算中は止められないので押せない（押しても何も起きない）。クラウドAIの待ち時間だけ「中止」
  const deviceBusy = cam.busy === 'device';
  sh.disabled = deviceBusy;
  sh.dataset.action = cam.busy && !deviceBusy ? 'cam-stop' : 'cam-read';
  // 読み取り前＝白／読み取り中＝黄／読み取り後＝緑（色で完了が分かるように）
  const done = !cam.busy && cam.read && handIds().length > 0;
  sh.dataset.state = cam.busy ? 'busy' : done ? 'done' : 'ready';
  // カメラで撮ったあと（撮った画像で止めている間）は、大きなボタンで撮り直す（同じ画像を読み直しても意味がないので）
  const liveFrozen = src === 'live' && cam.live === 'frozen' && !cam.busy;
  if (liveFrozen) sh.dataset.action = 'cam-retake';
  const text = deviceBusy ? '読み取り中' : cam.busy ? '中止' : liveFrozen ? '撮り直す' : done ? '認識済み' : getTileModel() || sampleImages ? '認識する' : src === 'live' ? '撮る' : '入力する';
  sh.setAttribute('aria-label', deviceBusy ? '読み取り中' : cam.busy ? '読み取りを中止' : liveFrozen ? 'カメラを動かして撮り直す' : done ? 'もう一度認識する' : text);
  sh.querySelector('.sh-label').textContent = text;
  const ic = sh.querySelector('.sh-ic');
  const want = liveFrozen ? 'retake' : done ? 'done' : 'scan';
  if (ic.dataset.ic !== want) {
    ic.innerHTML = SH_ICON[want];
    ic.dataset.ic = want;
  }
  // 小さいボタンは写真の「別の写真」だけ（カメラの撮り直しは大きなボタン）
  $('retake').hidden = !(!cam.busy && src === 'photo' && cam.photoSize);
  $('retake').textContent = '別の写真';
  // 「リセット」: 写真とカメラの画面で、牌のチップか認識の結果があるときだけ出す
  const hasHand = state.concealed.length > 0 || state.win != null || state.melds.length > 0 || !!cam.draft;
  $('cam-reset').hidden = !((src === 'photo' || (src === 'live' && cam.live !== 'off' && cam.live !== 'failed')) && !cam.busy && (hasHand || cam.read));
  const sort = $('cam-sort');
  const sortReady = cam.read && handIds().length >= 2;
  sort.hidden = cam.busy || !(canRead || sortReady);
  sort.dataset.ready = String(sortReady);
  sort.setAttribute('aria-pressed', String(sortReady && !!cam.sorted));
  sort.querySelector('.st-state').textContent = !sortReady ? '—' : cam.sorted ? 'ON' : 'OFF';
}

/** 鳴きを省いた10枚・7枚の「何待ち問題」の形は、テンパイの画面として見せる（点数は出さない） */
function cameraView(a) {
  if (a && a.phase === 'incomplete' && a.hidden && !cam.draft) {
    const h = a.hidden;
    return { ...a, phase: 'hand13', shanten: h.shanten, waits: h.waits, waitTotal: h.waitTotal, hiddenMelds: h.k };
  }
  return a;
}

function renderCamera(analysis) {
  if (!$('cam-stage')) return;
  const a = cameraView(analysis);
  ensureSelection(a);
  $('cam-stage').dataset.source = cam.source;
  syncViewTabs(state.mode, cam.source);
  renderMedia();
  renderControls();
  $('rules-bar').innerHTML = chipsHTML();
  // 状態の言葉（テンパイ・アガリなど）は操作ボタンと同じ行の左上へ。補足はその下の行に横幅いっぱいで出す
  const band = $('band');
  band.innerHTML = bandHTML(a);
  const headSlot = $('band-head');
  const head = band.querySelector('.band-head');
  headSlot.replaceChildren();
  if (head) {
    const sub = head.querySelector(':scope > span');
    if (sub && sub.textContent.trim()) {
      const line = document.createElement('div');
      line.className = 'band-sub';
      line.appendChild(sub);
      band.prepend(line);
    } else if (sub) sub.remove();
    headSlot.appendChild(head);
  }
  const twin = $('twin');
  twin.innerHTML = twinHTML(a);
  fitTwin();
  $('side-body').innerHTML = summaryHTML(a) + detailHTML(a) + notesHTML();
  renderPop();
}

// 手入力の画面でも開けるシート（ほかは写真の画面だけのもの）
const SHARED_POPS = new Set(['dora', 'settings']);

/** 設定シート（#pop）を描く。写真の画面と手入力の画面で共通 */
function renderPop() {
  const pop = $('pop');
  if (!pop) return;
  if (state.mode !== 'camera' && cam.pop && !SHARED_POPS.has(cam.pop)) cam.pop = null;
  const html = cam.pop ? popHTML() : '';
  // 同じポップアップを描き直すときは、スクロール位置を保つ（選ぶたびに先頭へ飛ばない）
  const prev = pop.querySelector('.pop-body');
  const keep = pop.dataset.kind === String(cam.pop) && prev ? prev.scrollTop : 0;
  pop.hidden = !html;
  pop.innerHTML = html;
  pop.dataset.kind = String(cam.pop);
  const body = pop.querySelector('.pop-body');
  if (keep && body) body.scrollTop = keep;
}

/** 画面の向き・大きさが変わったとき。縦横が入れ替わったら写真の位置を初期化する */
let lastLandscape = null;
function onViewportChange() {
  const land = window.innerWidth > window.innerHeight;
  if (lastLandscape !== null && land !== lastLandscape && cam.photoSize) {
    Object.assign(cam, { zoom: 1, panX: 0, panY: 0 });
  }
  lastLandscape = land;
  if (state.mode === 'camera') renderCamera(view.analysis);
}

// ---------- 操作 ----------
function handleCamera(el) {
  const d = el.dataset;
  // ドラ・その他のシートは手入力の画面からも開くので、今の画面を描き直す
  const rerender = () => (state.mode === 'camera' ? renderCamera(view.analysis) : update());
  switch (d.action) {
    case 'cam-sel':
      cam.sel = { kind: d.kind, tile: +d.tile };
      return rerender();
    case 'cam-level':
      // 2本指で回した角度を 0 に戻す
      cam.angle = 0;
      cam.read = false;
      applyPhotoTransform();
      return renderCamera(view.analysis);
    case 'cam-rotate':
      return rotatePhoto();
    case 'cam-edit':
      cam.editIndex = d.index === 'win' ? 'win' : +d.index;
      cam.pop = 'edit';
      return rerender();
    case 'cam-meld':
      cam.editIndex = +d.index;
      cam.pop = 'meld';
      return rerender();
    case 'cam-meld-type':
      cam.meldType = d.value;
      return rerender();
    case 'cam-meld-add': {
      const type = meldType();
      const meld = makeMeld(type, +d.id, false);
      if (!meld) return toast('チーは順子の一番小さい牌をタップします（例: 3萬 → 345萬）');
      if (state.melds.length >= 4) return toast('鳴きは4組までです');
      const newNeed = need() - 3;
      if (handIds().filter((x) => x != null).length > newNeed) {
        return toast(`鳴き${state.melds.length + 1}組なら手牌は${newNeed}枚です。多い牌をタップして減らしてください`);
      }
      snapshot();
      state.melds.push(meld);
      if (type !== 'ankan' && state.situation.riichi) toast('鳴きがあるためリーチは計算に含めません');
      cam.pop = null;
      cam.sel = null;
      return update();
    }
    case 'cam-meld-del':
      snapshot();
      state.melds.splice(cam.editIndex, 1);
      cam.pop = null;
      return update();
    case 'cam-key':
      return onKey(+d.id);
    case 'cam-del':
      return deleteEditTile();
    case 'cam-pop':
      cam.pop = cam.pop === d.pop ? null : d.pop;
      return rerender();
    case 'cam-pop-close':
      cam.pop = null;
      return rerender();
    case 'cam-set': {
      const v = +d.value;
      return setSituation(d.key, d.key === 'tsumo' ? v === 1 : v);
    }
    case 'cam-special':
      return toggleSpecial(d.value);
    case 'cam-step':
      return step(d.key, +d.delta);
    case 'cam-dora-add':
      return addDora(+d.id);
    case 'cam-dora-del':
      snapshot();
      state.dora.splice(+d.index, 1);
      markSetup('dora');
      return update();
    case 'cam-dora-undo':
      if (!state.dora.length) return undefined;
      snapshot();
      state.dora.pop();
      markSetup('dora');
      return update();
    case 'cam-undo':
      return undo();
    case 'cam-clear':
      cam.pop = null;
      return clearHand();
    case 'cam-live-start':
      return startLive();
    case 'cam-land-close':
      // 横にして撮る画面を閉じる（カメラを止めると、横向きのままでも元の画面になる）
      stopLive();
      unlockOrientation();
      return renderCamera(view.analysis);
    case 'cam-rule': {
      const raw = d.value;
      let value = raw === 'normal' || raw === 'fix30' || raw === 'fix40' ? raw : +raw === 1;
      if (d.key === 'doubleWindPairFu') value = +raw; // 2符／4符
      setRule(d.key, value);
      if (d.key === 'flowers' && cam.source === 'photo') {
        toast('花牌の設定を変えました。「認識する」を押すと反映します');
      }
      return undefined;
    }
    case 'cam-sort':
      return toggleSort();
    case 'cam-read':
      return readTiles();
    case 'cam-read-ai':
      return readCloud();
    case 'cam-retake':
      return retake();
    case 'cam-reset':
      return resetRead();
    case 'cam-stop':
      if (readCtl) readCtl.abort();
      return undefined;
    case 'cam-demo':
      return pickDemo(d.id);
    default:
      return undefined;
  }
}

/** 手入力画面へ移るとき: カメラを止め、読み取れなかった牌は外す */
function leaveCamera() {
  stopLive();
  setLandCapture(false);
  unlockOrientation();
  cam.pop = null;
  if (cam.draft) {
    cam.draft = null;
    toast('読み取れなかった牌（？）は外しました');
  }
}

function initCamera() {
  $('file-pick').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) loadPhoto(f);
  });
  const stage = $('cam-stage');
  stage.addEventListener('pointerdown', onPointerDown);
  stage.addEventListener('pointermove', onPointerMove);
  stage.addEventListener('pointerup', onPointerUp);
  stage.addEventListener('pointercancel', onPointerUp);
  stage.addEventListener('wheel', onWheel, { passive: false });
  if (window.ResizeObserver) new ResizeObserver(() => applyPhotoTransform()).observe(stage);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && cam.pop) {
      cam.pop = null;
      if (state.mode === 'camera') renderCamera(view.analysis);
      else update();
    }
  });
  if (cam.source === 'live') cam.live = 'off';
  initSample();
}
